name: Setup Android
description: Sets up Android tooling, signing, and Gradle caches.

inputs:
  flavor:
    description: Gradle cache scope.
    required: true
  native:
    description: Whether this job compiles native code.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Android build dependencies
      if: ${{ inputs.native == 'true' }}
      shell: bash
      run: |
        sudo_cmd=()
        [ "$(id -u)" -eq 0 ] || sudo_cmd=(sudo)
        "${sudo_cmd[@]}" apt-get update
        "${sudo_cmd[@]}" apt-get install --no-install-recommends -y build-essential libclang-dev libssl-dev pkg-config unzip

    - name: Set up Android SDK and NDK
      shell: bash
      run: |
        mise install
        echo "JAVA_HOME=$(mise where java)" >> "$GITHUB_ENV"
        # Skip the desktop GTK/WebKit dependencies.
        mise run --skip-deps tauri:setup:android

    - name: Set up signing
      shell: bash
      working-directory: ${{ github.workspace }}/src-tauri/gen/android
      run: |
        : "${ANDROID_KEY_BASE64:?ANDROID_KEY_BASE64 is required}"
        : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
        : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"
        base64 -d <<< "$ANDROID_KEY_BASE64" > "$RUNNER_TEMP/keystore.jks"
        mise exec -- keytool -list -keystore "$RUNNER_TEMP/keystore.jks" \
          -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEY_PASSWORD > /dev/null
        printf 'keyAlias=%s\npassword=%s\nstoreFile=%s\n' \
          "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" "$RUNNER_TEMP/keystore.jks" > keystore.properties

    - name: Configure Gradle cache
      id: revision
      shell: bash
      run: |
        echo "GRADLE_USER_HOME=${GRADLE_USER_HOME:-$HOME/.gradle}" >> "$GITHUB_ENV"
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Restore Gradle dependencies and task outputs
      uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ env.GRADLE_USER_HOME }}/caches
          ${{ env.GRADLE_USER_HOME }}/wrapper
        # Include the revision so cached task outputs can be refreshed.
        key: android-gradle-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.flavor }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', '.mise/config.tauri.toml', '.mise/mise.tauri.lock') }}-${{ steps.revision.outputs.sha }}
        restore-keys: |
          android-gradle-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.flavor }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', '.mise/config.tauri.toml', '.mise/mise.tauri.lock') }}-
          android-gradle-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.flavor }}-

    - name: Set up Gradle and validate the wrapper
      uses: https://github.com/gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-provider: external

    - name: Limit Gradle workers
      shell: bash
      run: printf '\norg.gradle.workers.max=1\n' >> src-tauri/gen/android/gradle.properties
