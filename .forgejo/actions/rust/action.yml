name: Setup Rust
description: Installs the pinned Rust toolchain, its cache and the system
  libraries the workspace links against.

inputs:
  components:
    description: Extra rustup components, comma-separated.
    required: false
    default: ''
  targets:
    description: Extra rustup targets, comma-separated.
    required: false
    default: ''
  tauri-dependencies:
    description: Whether the job compiles the app crate, which links webkit2gtk.
    required: false
    default: 'false'
  mise:
    description: Whether the job needs the tools declared in .mise/config.toml.
    required: false
    default: 'false'
  cache-key:
    description: rust-cache's shared-key, one per dependency tree.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Rust
      uses: https://github.com/dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: 1.99.1
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Install sccache
      uses: https://github.com/taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      with:
        tool: sccache@0.18.0

    - name: Cache Rust artifacts
      uses: https://github.com/Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache-key }}
        cache-on-failure: true
        cache-targets: false
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Set up mise
      if: ${{ inputs.mise == 'true' }}
      uses: https://github.com/jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        version: '2026.10.25'
        github_token: ''
        cache: true
        env: false

    - name: Trust project mise configuration
      if: ${{ inputs.mise == 'true' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: mise settings set trusted_config_paths "$GITHUB_WORKSPACE"

    # tauri-runtime depends on webkit2gtk on Linux whatever the runtime, so the
    # headers stay even though nothing renders through it.
    - name: Install Linux Tauri dependencies
      if: ${{ inputs.tauri-dependencies == 'true' }}
      shell: bash
      run: |
        SUDO=$([ "$(id -u)" -eq 0 ] || echo sudo)
        $SUDO apt-get update
        $SUDO apt-get install --no-install-recommends -y \
          build-essential \
          curl \
          file \
          libayatana-appindicator3-dev \
          libclang-dev \
          libpipewire-0.3-dev \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          libxdo-dev \
          librsvg2-dev \
          patchelf \
          wget
