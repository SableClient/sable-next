name: Setup App
description: Installs the Sable web toolchain and optionally builds the app.

inputs:
  build:
    description: Whether to build the WASM bindings and the static web app.
    required: false
    default: 'false'
  rust:
    description: Whether the job compiles Rust of its own.
    required: false
    default: 'false'
  rust-cache-key:
    description: rust-cache's shared-key.
    required: false
    default: 'wasm-release'
  rust-cache-targets:
    description: Cache compiled Cargo dependencies.
    required: false
    default: 'false'
  rust-cache-save:
    description: Allow cache writes outside main.
    required: false
    default: 'false'
  install-mise-tools:
    description: Whether to install tools declared in .mise/config.toml.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: https://github.com/pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Set up Node.js
      uses: https://github.com/actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.13.1
        cache: pnpm

    - name: Set up mise
      uses: https://github.com/jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        version: '2026.11.10'
        github_token: ''
        cache: true
        # Include tools installed by later steps.
        cache_save_post: ${{ inputs.install-mise-tools == 'false' }}
        cache_key_prefix: ${{ inputs.install-mise-tools == 'false' && 'mise-deferred-v1' || 'mise-v1' }}
        env: false
        install: ${{ inputs.install-mise-tools }}

    - name: Trust project mise configuration
      shell: bash
      working-directory: ${{ github.workspace }}
      run: mise settings set trusted_config_paths "$GITHUB_WORKSPACE"

    # Leaves out the app crate, whose version every release bumps.
    - name: Hash the WASM dependencies
      id: wasm-lock
      if: ${{ inputs.build == 'true' }}
      shell: bash
      run: echo "hash=$(awk 'BEGIN { RS = "" } !/^\[\[package\]\]\nname = "app"\n/' Cargo.lock | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    # The bindings are a pure function of the Rust sources and the pinned
    # toolchain, so every job that builds shares one entry and only the first
    # miss compiles.
    - name: Restore WASM bindings
      id: wasm
      if: ${{ inputs.build == 'true' }}
      uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: src/generated/wasm
        key: wasm-${{ runner.os }}-${{ steps.wasm-lock.outputs.hash }}-${{ hashFiles('crates/**', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', '.mise/config.toml', 'scripts/build/build-wasm.mjs', 'scripts/lib/cargo.mjs', 'scripts/lib/download.mjs', 'src/worker/wasm-debug.ts') }}

    - name: Set up Rust
      if: ${{ inputs.rust == 'true' || (inputs.build == 'true' && steps.wasm.outputs.cache-hit != 'true') }}
      uses: https://github.com/dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: 1.100.0
        targets: wasm32-unknown-unknown
        components: llvm-tools

    - name: Install sccache
      if: ${{ inputs.rust == 'true' || (inputs.build == 'true' && steps.wasm.outputs.cache-hit != 'true') }}
      uses: https://github.com/taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
      with:
        tool: sccache@0.18.0

    - name: Cache Rust artifacts
      if: ${{ inputs.rust == 'true' || (inputs.build == 'true' && steps.wasm.outputs.cache-hit != 'true') }}
      uses: https://github.com/Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.rust-cache-key }}
        cache-on-failure: true
        cache-targets: ${{ inputs.rust-cache-targets == 'true' || (inputs.build == 'true' && env.RUSTC_WRAPPER == '') }}
        save-if: ${{ github.ref == 'refs/heads/main' || inputs.rust-cache-save == 'true' }}

    - name: Install JavaScript dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      run: pnpm install --frozen-lockfile

    - name: Install the WASM C toolchain
      if: ${{ inputs.build == 'true' && steps.wasm.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        command -v clang && command -v llvm-ar && exit 0
        SUDO=$([ "$(id -u)" -eq 0 ] || echo sudo)
        $SUDO apt-get update
        $SUDO apt-get install --no-install-recommends -y clang llvm

    - name: Build the WASM bindings
      if: ${{ inputs.build == 'true' && steps.wasm.outputs.cache-hit != 'true' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CARGO_BUILD_JOBS: '1'
      run: pnpm wasm:build

    - name: Show sccache stats
      if: ${{ always() && inputs.build == 'true' && steps.wasm.outputs.cache-hit != 'true' && env.RUSTC_WRAPPER != '' }}
      shell: bash
      run: sccache --show-stats || true

    - name: Verify Sentry source map configuration
      if: ${{ inputs.build == 'true' }}
      shell: bash
      run: |
        if [ -z "${VITE_SENTRY_DSN:-}" ]; then
          exit 0
        fi
        : "${SENTRY_AUTH_TOKEN:?SENTRY_AUTH_TOKEN is required when VITE_SENTRY_DSN is set}"
        : "${SENTRY_ORG:?SENTRY_ORG is required when VITE_SENTRY_DSN is set}"
        : "${SENTRY_PROJECT:?SENTRY_PROJECT is required when VITE_SENTRY_DSN is set}"
        : "${VITE_APP_VERSION:?VITE_APP_VERSION is required when VITE_SENTRY_DSN is set}"

    # `vite build` rather than `pnpm build`, whose prebuild hook would recompile
    # the bindings the cache just restored.
    - name: Build app
      if: ${{ inputs.build == 'true' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: pnpm exec vite build

    - name: Upload source maps
      if: ${{ inputs.build == 'true' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        node scripts/ci/upload-sentry-sourcemaps.mjs dist
        if [ -n "${VITE_SENTRY_DSN:-}" ]; then
          pnpm exec sentry-cli debug-files upload src/generated/wasm/debug
        fi
