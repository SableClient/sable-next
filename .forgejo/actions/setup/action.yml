name: Setup App
description: Installs the Sable web toolchain and optionally builds the app.

inputs:
  build:
    description: Whether to build the WASM bindings and the static web app.
    required: false
    default: 'false'
  rust:
    description: Whether the job compiles Rust of its own.
    required: false
    default: 'false'
  rust-cache-key:
    description: rust-cache's shared-key.
    required: false
    default: 'wasm'
  install-mise-tools:
    description: Whether to install tools declared in mise.toml.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: https://github.com/pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Set up Node.js
      uses: https://github.com/actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.21.0
        cache: pnpm

    - name: Set up mise
      uses: https://github.com/jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: '2026.9.7'
        github_token: ''
        cache: true
        env: false
        install: ${{ inputs.install-mise-tools }}

    - name: Trust project mise configuration
      shell: bash
      working-directory: ${{ github.workspace }}
      run: mise settings set trusted_config_paths "$GITHUB_WORKSPACE"

    # The bindings are a pure function of the Rust sources and the pinned
    # toolchain, so every job that builds shares one entry and only the first
    # miss compiles.
    - name: Restore WASM bindings
      id: wasm
      if: ${{ inputs.build == 'true' }}
      uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: src/generated/wasm
        key: wasm-${{ runner.os }}-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'mise.toml', 'scripts/build-wasm.mjs') }}

    - name: Set up Rust
      if: ${{ inputs.rust == 'true' || (inputs.build == 'true' && steps.wasm.outputs.cache-hit != 'true') }}
      uses: https://github.com/dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: 1.98.1
        targets: wasm32-unknown-unknown

    - name: Install sccache
      if: ${{ inputs.rust == 'true' || (inputs.build == 'true' && steps.wasm.outputs.cache-hit != 'true') }}
      uses: https://github.com/taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
      with:
        tool: sccache@0.18.0

    - name: Cache Rust artifacts
      if: ${{ inputs.rust == 'true' || (inputs.build == 'true' && steps.wasm.outputs.cache-hit != 'true') }}
      uses: https://github.com/Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.rust-cache-key }}
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install JavaScript dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      run: pnpm install --frozen-lockfile

    - name: Build the WASM bindings
      if: ${{ inputs.build == 'true' && steps.wasm.outputs.cache-hit != 'true' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: pnpm wasm:build

    - name: Verify Sentry source map configuration
      if: ${{ inputs.build == 'true' }}
      shell: bash
      run: |
        if [ -z "${VITE_SENTRY_DSN:-}" ]; then
          exit 0
        fi
        : "${SENTRY_AUTH_TOKEN:?SENTRY_AUTH_TOKEN is required when VITE_SENTRY_DSN is set}"
        : "${SENTRY_ORG:?SENTRY_ORG is required when VITE_SENTRY_DSN is set}"
        : "${SENTRY_PROJECT:?SENTRY_PROJECT is required when VITE_SENTRY_DSN is set}"
        : "${VITE_APP_VERSION:?VITE_APP_VERSION is required when VITE_SENTRY_DSN is set}"

    # `vite build` rather than `pnpm build`, whose prebuild hook would recompile
    # the bindings the cache just restored.
    - name: Build app
      if: ${{ inputs.build == 'true' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: pnpm exec vite build
