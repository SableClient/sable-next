name: Renovate

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .renovaterc.json5
      - .forgejo/workflows/renovate.yml
  issues:
    types: [edited]
  pull_request:
    types: [closed, edited]

permissions: {}

concurrency:
  group: renovate-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    if: >-
      github.event_name != 'issues' && github.event_name != 'pull_request' ||
      (
        github.event_name == 'issues' &&
        contains(github.event.issue.title, 'Dependency Dashboard') &&
        contains(github.event.issue.body, '- [x]')
      ) ||
      (
        github.event_name == 'pull_request' &&
        endsWith(github.event.pull_request.user.login, '[bot]') &&
        (
          github.event.action == 'closed' ||
          contains(github.event.pull_request.body, '- [x]')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Renovate
        uses: https://github.com/renovatebot/github-action@c314dda4a9a93b08239ec978f2043b9a433b9ac4 # v46.3.0
        with:
          configurationFile: .renovaterc.json5
          token: ${{ secrets.RENOVATE_FORGEJO_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: https://git.sable.moe/api/v1
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: 'Renovate Bot <renovate@sable.moe>'
          GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
