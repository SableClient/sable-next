name: Create release PR

on:
  push:
    branches: [main]

env:
  MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}

concurrency:
  group: prepare-release
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare release
    if: "${{ !contains(github.event.head_commit.message, 'chore: prepare release') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up mise
        uses: https://github.com/jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: '2026.11.5'
          github_token: ''
          cache: true
          env: false
          install: false

      - name: Trust project mise configuration
        run: mise settings set trusted_config_paths "$GITHUB_WORKSPACE"

      - name: Install Lix
        uses: https://github.com/samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d # v2026-06-15
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Set up git identity
        run: |
          git config user.name 'Sable release'
          git config user.email 'release@sable.moe'

      - name: Prepare release
        run: mise run knope -- prepare-release --verbose
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
