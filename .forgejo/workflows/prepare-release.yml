name: Create release PR

on:
  push:
    branches: [main]

permissions: {}

env:
  MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}

concurrency:
  group: prepare-release
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare release
    if: "${{ !contains(github.event.head_commit.message, 'chore: prepare release') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up mise
        uses: https://github.com/jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.17'
          github_token: ''
          cache: true
          env: false
          install: false

      - name: Trust project mise configuration
        run: mise settings set trusted_config_paths "$GITHUB_WORKSPACE"

      - name: Set up git identity
        run: |
          git config user.name 'Sable release'
          git config user.email 'release@sable.moe'

      - name: Prepare release
        run: mise run knope -- prepare-release --verbose
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
