name: End-to-end tests

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Playwright's webServer builds the app itself, so this only needs tools.
      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          build: 'false'

      - name: Generate TypeScript protocol
        run: mise run generate:types

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm test:e2e

      - name: Run Playwright tests, failing on flake
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm test:e2e --fail-on-flaky-tests

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
