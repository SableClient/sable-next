name: Rust quality checks

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/generated/**'
      - 'rust-toolchain.toml'
      - 'deny.toml'
      - '.forgejo/workflows/rust-quality.yml'
      - '.forgejo/actions/rust/**'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/generated/**'
      - 'rust-toolchain.toml'
      - 'deny.toml'
      - '.forgejo/workflows/rust-quality.yml'
      - '.forgejo/actions/rust/**'

permissions: {}

concurrency:
  group: rust-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: https://github.com/dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  # Grouped by dependency tree, not by command: the workspace at --all-features
  # and the app crate share almost no compiled artifacts, so a job spanning both
  # builds two trees and pays for each again in every other such job.
  workspace:
    name: Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust workspace
        uses: ./.forgejo/actions/rust
        with:
          components: clippy
          cache-key: workspace

      - name: Run Clippy
        run: cargo clippy --locked --workspace --exclude app --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --exclude app --all-features

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --exclude app --all-features --no-deps

      - name: Check generated bindings are current
        run: cargo run --locked -p sable-core --example generate-types --features typegen -- --check

  # --all-features would turn on both desktop runtimes and download CEF, so the
  # app crate stays on its default runtime. The Linux release job covers CEF.
  app:
    name: App crate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust workspace
        uses: ./.forgejo/actions/rust
        with:
          components: clippy
          tauri-dependencies: 'true'
          cache-key: app

      - name: Run Clippy
        run: cargo clippy --locked -p app --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked -p app

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p app --no-deps

  wasm:
    name: WASM target
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Supplies wasm-bindgen-test-runner at the version mise pins.
      - name: Set up the Rust workspace
        uses: ./.forgejo/actions/rust
        with:
          components: clippy
          targets: wasm32-unknown-unknown
          mise: 'true'
          cache-key: wasm

      - name: Run Clippy
        run: cargo clippy --locked -p sable-wasm --target wasm32-unknown-unknown --all-targets --all-features -- -D warnings

      # Not a GitHub-hosted image, so it carries neither browser nor driver, and
      # Ubuntu packages no geckodriver. noble's `firefox` is a stub for the
      # snap, which cannot run here; the pin is what stops apt preferring it.
      - name: Install browsers and drivers
        id: drivers
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://packages.mozilla.org/apt/repo-signing-key.gpg \
            | sudo tee /etc/apt/keyrings/packages.mozilla.org.asc >/dev/null
          echo 'deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main' \
            | sudo tee /etc/apt/sources.list.d/mozilla.list >/dev/null
          printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n' \
            | sudo tee /etc/apt/preferences.d/mozilla >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y chromium chromium-driver firefox
          mise use --global ubi:mozilla/geckodriver@0.37.1
          echo "geckodriver=$(mise which geckodriver)" >>"$GITHUB_OUTPUT"

      # Chromium needs its sandbox off, having no user namespaces here; that is
      # what webdriver.json carries. Firefox's sandbox copes.
      - name: Run tests on Chromium
        env:
          CHROMEDRIVER: /usr/bin/chromedriver
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ github.workspace }}/.forgejo/webdriver.json
        run: cargo test --locked -p sable-wasm --target wasm32-unknown-unknown --profile wasm-dev

      - name: Run tests on Firefox
        env:
          GECKODRIVER: ${{ steps.drivers.outputs.geckodriver }}
        run: cargo test --locked -p sable-wasm --target wasm32-unknown-unknown --profile wasm-dev

  policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny resolves the graph through `cargo metadata`, so cargo has to
      # be on PATH, but it compiles nothing and wants no artifact cache.
      - name: Set up Rust
        uses: https://github.com/dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.1

      - name: Set up mise
        uses: https://github.com/jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.4'
          github_token: ''
          cache: true
          env: false
          install: false

      - name: Trust project mise configuration
        run: mise settings set trusted_config_paths "$GITHUB_WORKSPACE"

      # Prebuilt, rather than a `cargo install` that compiles it every run.
      - name: Check dependency policy
        run: mise exec aqua:EmbarkStudios/cargo-deny@0.20.2 -- cargo-deny check
