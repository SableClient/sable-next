name: Rust quality checks

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/generated/**'
      - 'rust-toolchain.toml'
      - 'deny.toml'
      - '.forgejo/workflows/rust-quality.yml'
      - '.forgejo/actions/rust/**'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/generated/**'
      - 'rust-toolchain.toml'
      - 'deny.toml'
      - '.forgejo/workflows/rust-quality.yml'
      - '.forgejo/actions/rust/**'

permissions: {}

concurrency:
  group: rust-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: https://github.com/dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Rust workspace
        uses: ./.forgejo/actions/rust
        with:
          components: clippy
          targets: wasm32-unknown-unknown
          tauri-dependencies: 'true'

      # --all-features would turn on both desktop runtimes and download CEF,
      # so the app crate is checked on its default runtime. The CEF build is
      # covered by the Linux release job.
      - name: Run workspace Clippy
        run: |
          cargo clippy --locked --workspace --exclude app --all-targets --all-features -- -D warnings
          cargo clippy --locked -p app --all-targets -- -D warnings

      - name: Run WASM-target Clippy
        run: cargo clippy --locked -p sable-wasm --target wasm32-unknown-unknown --all-targets --all-features -- -D warnings

  test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Rust workspace
        uses: ./.forgejo/actions/rust
        with:
          tauri-dependencies: 'true'

      - name: Run Rust tests
        run: |
          cargo test --locked --workspace --exclude app --all-features
          cargo test --locked -p app

  wasm-test:
    name: WASM tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Supplies wasm-bindgen-test-runner at the version mise pins.
      - name: Set up the Rust workspace
        uses: ./.forgejo/actions/rust
        with:
          targets: wasm32-unknown-unknown
          mise: 'true'

      # Not a GitHub-hosted image, so it carries no browser and no driver, and
      # Debian packages no geckodriver. Chromium needs its sandbox off because
      # the job has no user namespaces; that is what webdriver.json carries.
      - name: Install browsers and drivers
        id: drivers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y chromium chromium-driver firefox-esr
          sudo ln -sf /usr/bin/firefox-esr /usr/local/bin/firefox
          mise use --global ubi:mozilla/geckodriver@0.37.1
          echo "geckodriver=$(mise which geckodriver)" >>"$GITHUB_OUTPUT"

      - name: Run WASM-target tests on Chromium
        env:
          CHROMEDRIVER: /usr/bin/chromedriver
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ github.workspace }}/.forgejo/webdriver.json
        run: cargo test --locked -p sable-wasm --target wasm32-unknown-unknown --profile wasm-dev

      - name: Run WASM-target tests on Firefox
        env:
          GECKODRIVER: ${{ steps.drivers.outputs.geckodriver }}
        run: cargo test --locked -p sable-wasm --target wasm32-unknown-unknown --profile wasm-dev

  policy:
    name: Bindings and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Rust workspace
        uses: ./.forgejo/actions/rust
        with:
          mise: 'true'

      - name: Check generated bindings are current
        run: cargo run --locked -p sable-core --example generate-types --features typegen -- --check

      # Prebuilt, rather than a `cargo install` that compiles it every run.
      - name: Check dependency policy
        run: mise exec aqua:EmbarkStudios/cargo-deny@0.20.2 -- cargo-deny check

  doc:
    name: Rust documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Rust workspace
        uses: ./.forgejo/actions/rust
        with:
          tauri-dependencies: 'true'

      - name: Check Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --workspace --exclude app --all-features --no-deps
          cargo doc --locked -p app --no-deps
