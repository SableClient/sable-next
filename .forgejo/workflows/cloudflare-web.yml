name: Cloudflare Infra

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'infra/**'
      - 'wrangler.jsonc'
      - '.forgejo/workflows/cloudflare-web.yml'
      - '.forgejo/actions/prepare-tofu/**'
      - '.forgejo/actions/setup/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: cloudflare-web-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.TF_CLOUDFLARE_API_TOKEN }}
  TF_VAR_account_id: ${{ secrets.TF_VAR_ACCOUNT_ID }}
  TF_VAR_zone_id: ${{ secrets.TF_VAR_ZONE_ID }}
  TF_HTTP_USERNAME: ${{ secrets.TF_HTTP_USERNAME }}
  TF_HTTP_PASSWORD: ${{ secrets.TF_HTTP_PASSWORD }}
  TF_VAR_workers_message: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.ref_name }}
  TF_HTTP_ADDRESS: ${{ vars.TF_HTTP_ADDRESS }}
  TF_HTTP_LOCK_ADDRESS: ${{ vars.TF_HTTP_LOCK_ADDRESS }}
  TF_HTTP_UNLOCK_ADDRESS: ${{ vars.TF_HTTP_UNLOCK_ADDRESS }}
  TF_HTTP_LOCK_METHOD: 'POST'
  TF_HTTP_UNLOCK_METHOD: 'DELETE'
  TF_HTTP_RETRY_WAIT_MIN: '5'
  TF_VAR_custom_domain: ${{ vars.TF_VAR_CUSTOM_DOMAIN }}
  TF_VAR_worker_name: ${{ vars.TF_VAR_WORKER_NAME }}

jobs:
  build:
    name: Build web assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Absent on forks, which builds an app with error reporting switched off.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      VITE_APP_VERSION: ${{ github.sha }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up app and build
        uses: ./.forgejo/actions/setup
        with:
          build: 'true'

      - name: Upload Cloudflare assets
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: cloudflare-web-assets
          path: dist
          if-no-files-found: error
          retention-days: 1

  plan:
    name: Cloudflare plan
    needs: build
    # Forks cannot read the Cloudflare credentials a plan needs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Cloudflare assets
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: cloudflare-web-assets
          path: dist

      - name: Prepare OpenTofu
        uses: ./.forgejo/actions/prepare-tofu
        with:
          build: 'false'

      - name: Plan infrastructure
        working-directory: infra/web
        run: mise run opentofu -- plan -input=false -no-color | tee "$RUNNER_TEMP/plan.txt"

      - name: Publish plan summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '## OpenTofu plan (development)'
            echo
            echo '```terraform'
            cat "$RUNNER_TEMP/plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Cloudflare apply
    needs: plan
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: cloudflare-infra-development
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Cloudflare assets
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: cloudflare-web-assets
          path: dist

      - name: Prepare OpenTofu
        uses: ./.forgejo/actions/prepare-tofu
        with:
          build: 'false'

      - name: Apply infrastructure
        working-directory: infra/web
        run: mise run opentofu -- apply -input=false -auto-approve
