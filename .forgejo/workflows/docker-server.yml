name: Server Docker image

on:
  pull_request:
    paths:
      - 'packaging/server/**'
      - '.forgejo/workflows/docker-server.yml'

concurrency:
  group: docker-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
  CARGO_INCREMENTAL: 0
  SCCACHE_BUCKET: ow-oops-sccache
  SCCACHE_S3_KEY_PREFIX: sable-next
  SCCACHE_ENDPOINT: https://s3.gra.io.cloud.ovh.net
  SCCACHE_REGION: gra
  SCCACHE_S3_USE_SSL: 'true'

# Pushes publish the image from tauri-build. This only proves a Dockerfile
# change builds.
jobs:
  build-server:
    name: Build server image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RUSTC_WRAPPER: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: docker
          - arch: arm64
            runner: docker-arm64
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up app and build
        uses: ./.forgejo/actions/setup
        with:
          build: 'true'

      - name: Set up Docker Buildx
        id: buildx
        uses: https://github.com/docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: Build server image
        uses: https://github.com/docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: packaging/server/Dockerfile
          build-contexts: wasm=src/generated/wasm
          build-args: |
            SCCACHE_BUCKET
            SCCACHE_ENDPOINT
            SCCACHE_REGION
            SCCACHE_S3_KEY_PREFIX
            SCCACHE_S3_USE_SSL
          secret-envs: |
            aws_access_key_id=AWS_ACCESS_KEY_ID
            aws_secret_access_key=AWS_SECRET_ACCESS_KEY
          platforms: linux/${{ matrix.arch }}
          push: false
          outputs: type=cacheonly
