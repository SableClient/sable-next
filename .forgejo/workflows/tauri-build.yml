name: Build apps
on:
  schedule:
    - cron: '0 0,12 * * *'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach bundles to (e.g. v1.2.3). Empty builds a nightly from HEAD.'
        required: false
        type: string
permissions: {}
concurrency:
  group: tauri-build-${{ github.event_name == 'workflow_dispatch' && (inputs.tag || github.run_id) || github.ref_name }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}
env:
  MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
  CARGO_PROFILE_RELEASE_STRIP: none
  CARGO_TERM_COLOR: always
  FORGEJO_URL: https://git.sable.moe
  FORGEJO_REPOSITORY: ${{ github.repository }}
  FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
  # Each nightly is ~1.5 GB of bundles on a node with ~100 GB of disk.
  NIGHTLY_KEEP: 20
  SCCACHE_BUCKET: sccache
  SCCACHE_S3_KEY_PREFIX: sable-next
  SCCACHE_ENDPOINT: https://s3.erwanleboucher.dev
  SCCACHE_REGION: us-east-1
  SCCACHE_S3_USE_SSL: 'true'
  SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
jobs:
  setup-release:
    name: Resolve release target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
      nightly: ${{ steps.meta.outputs.nightly }}
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release meta
        id: meta
        uses: ./.forgejo/actions/resolve-release-meta
        with:
          input-tag: ${{ inputs.tag }}
      - name: Check out the release target
        if: ${{ steps.meta.outputs.nightly != 'true' }}
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.ref }}
          persist-credentials: false
      - name: Verify the release preparation
        if: ${{ steps.meta.outputs.nightly != 'true' }}
        run: node scripts/release/release-prep.mjs "${{ steps.meta.outputs.version }}"
      - name: Skip scheduled build without new commits
        id: gate
        if: ${{ github.event_name == 'schedule' }}
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -gt 43200 ]; then echo 'skip=true' >> "$GITHUB_OUTPUT"; fi
      - name: Wait for release to exist
        if: ${{ steps.meta.outputs.nightly != 'true' }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: node scripts/ci/forgejo-release.mjs wait --attempts 12 --interval 15
      - name: Dispatch the GitHub build for the tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          TAG: ${{ steps.meta.outputs.nightly != 'true' && steps.meta.outputs.tag || '' }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo 'GH_DISPATCH_TOKEN is not set; dispatch the GitHub build for this tag by hand.' >&2; exit 1; }
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/SableClient/sable-next/actions/workflows/tauri-build.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"tag\":\"$TAG\"}}"
      - name: Create nightly prerelease
        if: ${{ steps.meta.outputs.nightly == 'true' && steps.gate.outputs.skip != 'true' }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          node scripts/ci/forgejo-release.mjs ensure \
            --tag "$TAG" \
            --sha "$SHA" \
            --prerelease true \
            --title "Nightly build $VERSION" \
            --notes "Nightly build from main at $SHA"
  build-web:
    name: Build web assets
    needs: setup-release
    if: ${{ needs.setup-release.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # Cold, this compiles the workspace for wasm32 in release. Warm, the setup
    # action restores the bindings and only Vite runs.
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RUSTC_WRAPPER: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      # Absent on forks, which builds an app with error reporting switched off.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Set up app and build
        uses: ./.forgejo/actions/setup
        with:
          build: 'true'
      - name: Build FOSS web assets
        if: ${{ needs.setup-release.outputs.nightly != 'true' }}
        run: |
          mv dist "$RUNNER_TEMP/dist"
          mv .svelte-kit/output "$RUNNER_TEMP/svelte-kit-output"
          env -u VITE_SENTRY_DSN -u VITE_SENTRY_ENVIRONMENT -u SENTRY_AUTH_TOKEN -u SENTRY_ORG \
            -u SENTRY_PROJECT SABLE_FOSS=1 pnpm exec vite build
          mv dist dist-foss
          rm -rf .svelte-kit/output
          mv "$RUNNER_TEMP/dist" dist
          mv "$RUNNER_TEMP/svelte-kit-output" .svelte-kit/output
      # Matching the package naming keeps the nightly prune replacing old web
      # bundles in step with the desktop and mobile ones.
      - name: Attach web bundle to release
        run: |
          tar --create --gzip --file "sable-${VERSION}-web.tar.gz" --directory dist .
          node scripts/ci/forgejo-release.mjs upload "sable-${VERSION}-web.tar.gz"
      - name: Upload web assets
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: web-assets
          path: |
            .svelte-kit/output
            dist
            dist-foss
            src/generated/wasm
          if-no-files-found: error
          retention-days: 7
  docker:
    name: Build ${{ matrix.image }} image (${{ matrix.arch }})
    needs: [setup-release, build-web]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: web
            arch: amd64
            runner: docker
            file: packaging/docker/Dockerfile
          - image: web
            arch: arm64
            runner: docker-arm64
            file: packaging/docker/Dockerfile
          - image: server
            arch: amd64
            runner: docker
            file: packaging/server/Dockerfile
          - image: server
            arch: arm64
            runner: docker-arm64
            file: packaging/server/Dockerfile
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: git.sable.moe
      ARCH: ${{ matrix.arch }}
      IMAGE_KIND: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.file }}
      PACKAGES_USER: ${{ secrets.PACKAGES_USER }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      # The web image reuses the bundle built for the desktop packages.
      - name: Download web assets
        if: ${{ matrix.image == 'web' }}
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: web-assets
      - name: Log in to the container registry
        run: echo "$PACKAGES_TOKEN" | docker login "$REGISTRY" --username "$PACKAGES_USER" --password-stdin
      # Pass digests through registry tags instead of artifact storage.
      - name: Build and push architecture image
        env:
          VERSION: ${{ needs.setup-release.outputs.version }}
        run: |
          revision="$(git rev-parse HEAD)"
          image="$REGISTRY/${GITHUB_REPOSITORY,,}"
          [ "$IMAGE_KIND" = web ] || image="$image-server"
          builder="ci-builder-$GITHUB_RUN_ID-$IMAGE_KIND-$ARCH"
          cleanup() {
            docker buildx rm --force "$builder" || {
              docker rm -f "buildx_buildkit_${builder}0" || true
              docker volume rm "buildx_buildkit_${builder}0_state" || true
            }
            docker context rm --force "ci-$GITHUB_RUN_ID-$IMAGE_KIND-$ARCH" || true
          }
          trap cleanup EXIT
          docker context create "ci-$GITHUB_RUN_ID-$IMAGE_KIND-$ARCH"
          docker buildx create "ci-$GITHUB_RUN_ID-$IMAGE_KIND-$ARCH" --name "$builder" --driver docker-container --buildkitd-config .forgejo/buildkitd.toml --use
          # Forgejo fails the push when both arch jobs upload the same layer at once.
          for attempt in 1 2 3; do
            docker buildx build . \
              --file "$DOCKERFILE" \
              --platform "linux/$ARCH" \
              --label "org.opencontainers.image.source=$FORGEJO_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$revision" \
              --label "org.opencontainers.image.version=$VERSION" \
              --cache-from "type=registry,ref=$image:buildcache-$ARCH" \
              --cache-to "type=registry,ref=$image:buildcache-$ARCH,mode=max,ignore-error=true" \
              --output "type=image,name=$image,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "$RUNNER_TEMP/build-metadata.json" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 10))
          done
          digest="$(node -p "require(process.env.RUNNER_TEMP + '/build-metadata.json')['containerimage.digest']")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Invalid image digest' >&2; exit 1; }
          for attempt in 1 2 3; do
            docker buildx imagetools create --prefer-index=false \
              --tag "$image:ci-$GITHUB_RUN_ID-$ARCH" "$image@$digest" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 5))
          done
      - name: Remove the builder
        if: ${{ always() }}
        run: |
          builder="ci-builder-$GITHUB_RUN_ID-$IMAGE_KIND-$ARCH"
          docker buildx rm --force "$builder" || {
            docker rm -f "buildx_buildkit_${builder}0" || true
            docker volume rm "buildx_buildkit_${builder}0_state" || true
          }
          docker context rm --force "ci-$GITHUB_RUN_ID-$IMAGE_KIND-$ARCH" || true

  docker-manifest:
    name: Publish ${{ matrix.image }} image manifest
    needs: [setup-release, docker]
    strategy:
      matrix:
        image: [web, server]
    runs-on: docker-arm64
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: git.sable.moe
      PACKAGES_USER: ${{ secrets.PACKAGES_USER }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      IMAGE_KIND: ${{ matrix.image }}
      NIGHTLY: ${{ needs.setup-release.outputs.nightly }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      SHA: ${{ github.sha }}
    steps:
      - name: Log in to the container registry
        run: echo "$PACKAGES_TOKEN" | docker login "$REGISTRY" --username "$PACKAGES_USER" --password-stdin
      - name: Create and push the multi-arch manifest
        run: |
          image="$REGISTRY/${GITHUB_REPOSITORY,,}"
          [ "$IMAGE_KIND" = web ] || image="$image-server"
          if [ "$NIGHTLY" = 'true' ]; then
            tags=(dev "${SHA::7}")
          else
            tags=(latest "$VERSION" "${VERSION%.*}")
          fi
          sources=()
          for arch in amd64 arm64; do
            ref="$image:ci-$GITHUB_RUN_ID-$arch"
            for attempt in 1 2 3; do
              digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')" && break
              [ "$attempt" -lt 3 ] || exit 1
              sleep $((attempt * 5))
            done
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid digest for $ref" >&2; exit 1; }
            sources+=("$image@$digest")
          done
          tag_args=()
          for tag in "${tags[@]}"; do tag_args+=(--tag "$image:$tag"); done
          for attempt in 1 2 3; do
            docker buildx imagetools create "${tag_args[@]}" "${sources[@]}" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 5))
          done
          docker buildx imagetools inspect "$image:${tags[0]}"
      - name: Remove published image staging tags
        run: |
          image="${GITHUB_REPOSITORY,,}"
          [ "$IMAGE_KIND" = web ] || image="$image-server"
          # Delete tags, not digests referenced by the published index.
          for arch in amd64 arm64; do
            tag="ci-$GITHUB_RUN_ID-$arch"
            status="$(printf 'user = "%s:%s"\n' "$PACKAGES_USER" "$PACKAGES_TOKEN" | \
              curl --config - --silent --show-error --connect-timeout 10 --max-time 30 \
                --retry 3 --retry-delay 2 --output /dev/null --write-out '%{http_code}' \
                --request DELETE "https://$REGISTRY/v2/$image/manifests/$tag")" || status=000
            case "$status" in
              202|404) ;;
              *) echo "::warning::Could not remove staging tag $tag (HTTP $status)" ;;
            esac
          done

  android-native:
    name: Build Android native ${{ matrix.target }}
    needs: [setup-release, build-web]
    if: ${{ needs.setup-release.outputs.skip != 'true' }}
    runs-on: docker
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.setup-release.outputs.nightly == 'true' && '["aarch64"]' || '["aarch64", "armv7", "i686", "x86_64"]') }}
    env:
      RUSTC_WRAPPER: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      MISE_ENV: tauri
      CARGO_BUILD_JOBS: '2'
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      IS_NIGHTLY: ${{ needs.setup-release.outputs.nightly }}
      RUST_TARGETS: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download web assets
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: web-assets
      - name: Drop assets the native app never loads
        run: rm -rf dist/_app/immutable/workers
      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          rust: 'true'
          rust-cache-key: ${{ env.RUSTC_WRAPPER == '' && format('tauri-android-{0}', matrix.target) || 'tauri-android' }}
          rust-cache-targets: ${{ env.RUSTC_WRAPPER == '' }}
          rust-cache-save: 'true'
          install-mise-tools: 'false'
      - name: Set up Android
        uses: ./.forgejo/actions/setup-android
        with:
          flavor: gms
      - name: Add Rust targets
        run: |
          # shellcheck disable=SC2086 # RUST_TARGETS is a space-separated list.
          rustup target add $RUST_TARGETS
      - name: Stamp release version into tauri.conf.json
        run: |
          node scripts/ci/set-tauri-version.mjs "$VERSION"
      - name: Build one ABI
        env:
          TARGET: ${{ matrix.target }}
        run: |
          config_args=(--config src-tauri/tauri.ci.conf.json)
          [ "$IS_NIGHTLY" = 'true' ] || config_args+=(--config src-tauri/tauri.stable.conf.json)
          pnpm tauri android build "${config_args[@]}" --apk --target "$TARGET"
          case "$TARGET" in
            aarch64) rust_target=aarch64-linux-android ;;
            armv7) rust_target=armv7-linux-androideabi ;;
            i686) rust_target=i686-linux-android ;;
            x86_64) rust_target=x86_64-linux-android ;;
            *) exit 1 ;;
          esac
          node scripts/ci/upload-sentry-symbols.mjs "target/$rust_target/release"
          BUILD_REVISION="$(git rev-parse HEAD)" mise exec -- src-tauri/gen/android/gradlew \
            -p src-tauri/gen/android :app:archiveNativeRelease -PnativeTarget="$TARGET" --console=plain
          cp "src-tauri/gen/android/build/native-artifacts/android-native-$TARGET.tar.gz" .
          sha256sum "android-native-$TARGET.tar.gz" > "android-native-$TARGET.tar.gz.sha256"
      - name: Upload native libraries and Gradle inputs
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: android-native-${{ matrix.target }}
          path: |
            android-native-${{ matrix.target }}.tar.gz
            android-native-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          overwrite: true
          compression-level: 0
      - name: Show sccache stats
        if: ${{ always() && env.RUSTC_WRAPPER != '' }}
        run: sccache --show-stats || true
  android-foss:
    name: Build FOSS Android ${{ matrix.target }}
    needs: [setup-release, build-web]
    if: ${{ needs.setup-release.outputs.skip != 'true' && needs.setup-release.outputs.nightly != 'true' }}
    runs-on: docker
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64, armv7]
    env:
      RUSTC_WRAPPER: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      MISE_ENV: tauri
      CARGO_BUILD_JOBS: '2'
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download web assets
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: web-assets
      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          rust: 'true'
          rust-cache-key: ${{ env.RUSTC_WRAPPER == '' && format('tauri-android-foss-{0}', matrix.target) || 'tauri-android-foss' }}
          rust-cache-targets: ${{ env.RUSTC_WRAPPER == '' }}
          rust-cache-save: 'true'
          install-mise-tools: 'false'
      - name: Set up Android
        uses: ./.forgejo/actions/setup-android
        with:
          flavor: foss-${{ matrix.target }}
      - name: Build FOSS APK
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node scripts/release/fastlane-changelog.mjs "$VERSION" --check
          rm -rf dist
          mv dist-foss dist
          pnpm android:build --version "$VERSION" --target "$TARGET" --web-dist dist
          case "$TARGET" in
            aarch64) flavor=arm64 ;;
            armv7) flavor=arm ;;
            *) exit 1 ;;
          esac
          dir="src-tauri/gen/android/app/build/outputs/apk/$flavor/release"
          mapfile -t apks < <(find "$dir" -maxdepth 1 -name '*.apk' -type f)
          [ "${#apks[@]}" -eq 1 ] || { echo 'Expected exactly one FOSS APK' >&2; exit 1; }
          mkdir foss-apks
          cp "${apks[0]}" "foss-apks/sable-${VERSION}-android-${TARGET}-foss.apk"
      - name: Upload FOSS APK
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: android-foss-${{ matrix.target }}
          path: foss-apks/*.apk
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Show sccache stats
        if: ${{ always() && env.RUSTC_WRAPPER != '' }}
        run: sccache --show-stats || true
  android:
    name: Build Android
    needs: [setup-release, android-native, android-foss]
    if: ${{ !cancelled() && needs.setup-release.result == 'success' && needs.android-native.result == 'success' && (needs.android-foss.result == 'success' || (needs.setup-release.outputs.nightly == 'true' && needs.android-foss.result == 'skipped')) }}
    runs-on: docker
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      MISE_ENV: tauri
      ANDROID_TARGETS: ${{ needs.setup-release.outputs.nightly == 'true' && 'aarch64' || 'aarch64 armv7 i686 x86_64' }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      IS_NIGHTLY: ${{ needs.setup-release.outputs.nightly }}
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          install-mise-tools: 'false'
      - name: Set up Android
        uses: ./.forgejo/actions/setup-android
        with:
          flavor: gms
          native: 'false'
      - name: Download native libraries and Gradle inputs
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          pattern: android-native-*
          merge-multiple: true
          path: native-archives
      - name: Restore and validate native libraries
        run: |
          mkdir android-native
          (cd native-archives && sha256sum --check ./*.sha256)
          for archive in native-archives/*.tar.gz; do tar -xzf "$archive" -C android-native; done
          rm -rf src-tauri/gen/android/app/src/main/jniLibs
          for target in $ANDROID_TARGETS; do
            printf '%s\n' "$(git rev-parse HEAD)" "$VERSION" "$SABLE_BUILD_FLAVOR" "$target" > "$RUNNER_TEMP/native-identity"
            cmp "$RUNNER_TEMP/native-identity" "android-native/$target/identity"
            case "$target" in
              aarch64) abi=arm64-v8a; machine=183 ;;
              armv7) abi=armeabi-v7a; machine=40 ;;
              i686) abi=x86; machine=3 ;;
              x86_64) abi=x86_64; machine=62 ;;
              *) exit 1 ;;
            esac
            dir="android-native/$target/jniLibs/$abi"
            [ -s "$dir/libapp_lib.so" ] || { echo "Missing native library: $target" >&2; exit 1; }
            for library in "$dir"/*.so; do
              readelf --file-header "$library"
              [ "$(od -An -tu2 -j18 -N2 "$library" | tr -d ' ')" = "$machine" ] || exit 1
            done
            mkdir -p src-tauri/gen/android/app/src/main/jniLibs
            cp -a "$dir" src-tauri/gen/android/app/src/main/jniLibs/
          done
          cp -a android-native/aarch64/gradle/. src-tauri/gen/android/
      - name: Build Android bundles
        run: |
          abis=arm64-v8a
          [ "$IS_NIGHTLY" = 'true' ] || abis=arm64-v8a,armeabi-v7a,x86,x86_64
          mise exec -- src-tauri/gen/android/gradlew -p src-tauri/gen/android \
            :app:assembleUniversalRelease :app:bundleUniversalRelease \
            -PabiList="$abis" -x :app:rustBuildUniversalRelease --console=plain
          out='src-tauri/gen/android/app/build/outputs'
          apk="$(find "$out/apk/universal/release" -name '*.apk' -type f | head -n 1)"
          aab="$(find "$out/bundle/universalRelease" -name '*.aab' -type f | head -n 1)"
          [ -n "$apk" ] || { echo 'APK not found' >&2; exit 1; }
          [ -n "$aab" ] || { echo 'AAB not found' >&2; exit 1; }
          mv "$apk" "$(dirname "$apk")/sable-${VERSION}-android-universal.apk"
          mv "$aab" "$(dirname "$aab")/sable-${VERSION}-android-universal.aab"
      - name: Download FOSS APKs
        if: ${{ needs.setup-release.outputs.nightly != 'true' }}
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          pattern: android-foss-*
          merge-multiple: true
          path: src-tauri/gen/android/app/build/outputs/foss
      - name: Verify Android release bundles
        run: |
          sdk="$(mise exec -- printenv ANDROID_HOME)"
          apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort | tail -n 1)"
          [ -n "$apksigner" ] || { echo 'apksigner not found' >&2; exit 1; }
          out=src-tauri/gen/android/app/build/outputs
          mapfile -d '' apks < <(find "$out" -name 'sable-*.apk' -type f -print0)
          expected=3
          [ "$IS_NIGHTLY" != 'true' ] || expected=1
          [ "${#apks[@]}" -eq "$expected" ] || { echo 'Missing release APKs' >&2; exit 1; }
          version_code="$(node --input-type=module -e 'import { tauriVersionConfig } from "./scripts/ci/set-tauri-version.mjs"; console.log(tauriVersionConfig(process.env.VERSION).bundle.android.versionCode)')"
          for apk in "${apks[@]}"; do
            mise exec -- "$apksigner" verify --print-certs "$apk"
            expected_id=moe.sable.client
            [ "$IS_NIGHTLY" != 'true' ] || expected_id=moe.sable.next.nightly
            [ "$(mise exec -- apkanalyzer manifest application-id "$apk")" = "$expected_id" ] || exit 1
            [ "$(mise exec -- apkanalyzer manifest version-name "$apk")" = "$VERSION" ] || exit 1
            expected_code="$version_code"
            case "$apk" in
              *-aarch64-foss.apk) expected_code=$((version_code + 2)) ;;
              *-armv7-foss.apk) expected_code=$((version_code + 1)) ;;
            esac
            [ "$(mise exec -- apkanalyzer manifest version-code "$apk")" = "$expected_code" ] || exit 1
            # Rust calls this method by name through JNI.
            mise exec -- apkanalyzer dex code --class moe.sable.client.TauriActivity \
              --method 'getPluginManager()Lapp/tauri/plugin/PluginManager;' "$apk" \
              | grep -E '^\.method public (final )?getPluginManager\(\)Lapp/tauri/plugin/PluginManager;$'
          done
          apk="$out/apk/universal/release/sable-${VERSION}-android-universal.apk"
          aab="$out/bundle/universalRelease/sable-${VERSION}-android-universal.aab"
          for target in $ANDROID_TARGETS; do
            case "$target" in
              aarch64) abi=arm64-v8a ;;
              armv7) abi=armeabi-v7a ;;
              i686) abi=x86 ;;
              x86_64) abi=x86_64 ;;
              *) exit 1 ;;
            esac
            unzip -p "$apk" "lib/$abi/libapp_lib.so" > "$RUNNER_TEMP/packaged.so"
            readelf --file-header "$RUNNER_TEMP/packaged.so"
            unzip -p "$aab" "base/lib/$abi/libapp_lib.so" > "$RUNNER_TEMP/packaged.so"
            readelf --file-header "$RUNNER_TEMP/packaged.so"
          done
          mise exec -- jarsigner -verify "$aab" | grep -F 'jar verified.'
      - name: Attach Android bundles to release
        run: |
          mapfile -d '' bundles < <(find src-tauri/gen/android/app/build/outputs -type f \
            -name 'sable-*' \( -name '*.apk' -o -name '*.aab' \) -print0)
          [ "${#bundles[@]}" -gt 0 ] || { echo 'No Android bundles found' >&2; exit 1; }
          node scripts/ci/forgejo-release.mjs upload "${bundles[@]}"
  android-reproducible:
    name: Reproduce FOSS Android APK
    # Runs last so the long rebuild never holds a runner other builds wait on.
    needs:
      - setup-release
      - android
      - docker-manifest
      - publish-latest
      - distribute-aur
      - distribute-homebrew
      - distribute-gentoo
      - distribute-playstore
    if: ${{ !cancelled() && needs.android.result == 'success' && needs.setup-release.outputs.nightly != 'true' }}
    # The pinned image is amd64.
    runs-on: ubuntu-latest
    container:
      image: ubuntu:resolute@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
    steps:
      # Not actions/checkout: it needs Node, which the bare image lacks.
      - name: Check out the tag
        run: |
          # The runner mounts the host's zoneinfo read-only, so tzdata cannot unpack there.
          echo 'path-exclude=/usr/share/zoneinfo/*' > /etc/dpkg/dpkg.cfg.d/runner-zoneinfo
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
          git init -q /shared/workdir/SableClient/sable-next
          cd /shared/workdir/SableClient/sable-next
          git fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/$TAG"
          git checkout -q FETCH_HEAD
      - name: Rebuild and compare
        working-directory: /shared/workdir/SableClient/sable-next
        run: scripts/ci/reproduce-android.sh "$VERSION"
  electron-linux:
    name: Linux x86_64 (Electron)
    needs: [setup-release, build-web]
    runs-on: docker
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RUSTC_WRAPPER: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      MISE_DISABLE_TOOLS: github:WebAssembly/binaryen,ubi:rustwasm/wasm-bindgen
      VERSION: ${{ needs.setup-release.outputs.version }}
      TAG: ${{ needs.setup-release.outputs.tag }}
      SHA: ${{ github.sha }}
      # Baked into the main process by electron/build.mjs.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download web assets
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: web-assets
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libclang-dev libpipewire-0.3-dev pkg-config rpm
          # The Electron binary links these even under ELECTRON_RUN_AS_NODE.
          asound=$(apt-cache show libasound2t64 >/dev/null 2>&1 && echo libasound2t64 || echo libasound2)
          sudo apt-get install --no-install-recommends -y libnss3 libgtk-3-0 libgbm1 "$asound"
      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          rust: 'true'
          rust-cache-key: electron-linux
          install-mise-tools: 'false'
      - name: Package
        run: pnpm --dir electron package --linux
      - name: Upload native addon symbols
        run: node scripts/ci/upload-sentry-symbols.mjs electron/dist
      - name: Verify native core shutdown
        run: SABLE_NODE_ADDON="$PWD/electron/dist/sable_node.node" node --test crates/sable-node/tests/native-lifecycle.mjs
      - name: Verify native core shutdown in Electron
        run: ELECTRON_RUN_AS_NODE=1 SABLE_NODE_ADDON="$PWD/electron/dist/sable_node.node" pnpm --dir electron exec electron --test "$PWD/crates/sable-node/tests/native-lifecycle.mjs"
      - name: Publish Electron bundles and update metadata
        run: node electron/publish-updates.mjs
      - name: Publish deb and rpm to the package registries
        env:
          PACKAGES_USER: ${{ secrets.PACKAGES_USER }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          channel=stable
          case "$VERSION" in *-nightly.*) channel=nightly ;; esac
          api="https://git.sable.moe/api/packages/${GITHUB_REPOSITORY_OWNER}"
          upload() {
            code=$(curl -sS -o /dev/null -w '%{http_code}' --user "$PACKAGES_USER:$PACKAGES_TOKEN" \
              --upload-file "$1" "$2")
            # 409 means this exact version is already published.
            case "$code" in 201|409) ;; *) echo "Upload of $1 failed with HTTP $code" >&2; exit 1 ;; esac
          }
          for deb in electron/release/*.deb; do
            upload "$deb" "$api/debian/pool/$channel/main/upload"
          done
          for rpm in electron/release/*.rpm; do
            upload "$rpm" "$api/rpm/$channel/upload?sign=true"
          done

  electron-macos:
    name: macOS arm64 (Electron)
    needs: [setup-release, build-web]
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.setup-release.outputs.version }}
      TAG: ${{ needs.setup-release.outputs.tag }}
      SHA: ${{ github.sha }}
      # Baked into the main process by electron/build.mjs.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_API_ISSUER: ${{ secrets.APP_STORE_API_ISSUER_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download web assets
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: web-assets
      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          rust: 'true'
          rust-cache-key: electron-macos
          install-mise-tools: 'false'
      - name: Write the App Store Connect API key
        uses: ./.forgejo/actions/app-store-connect-key
        with:
          key-id: ${{ secrets.APP_STORE_API_KEY_ID }}
          key: ${{ secrets.APP_STORE_API_KEY_BASE64 }}
      - name: Import the signing identity
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        uses: ./.forgejo/actions/apple-signing-keychain
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Package
        run: |
          sign_args=()
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            # electron-builder takes the key's path, not its ID, from APPLE_API_KEY.
            export APPLE_API_KEY="$APPLE_API_KEY_PATH"
            export CSC_KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            sign_args=(-c.mac.identity=NXLJ6G3CP7 -c.mac.hardenedRuntime=true -c.forceCodeSigning=true)
          else
            case "$VERSION" in
              *-nightly.*) unset APPLE_API_ISSUER APPLE_API_KEY_ID ;;
              *) echo 'APPLE_CERTIFICATE is required to build a stable macOS release.' >&2; exit 1 ;;
            esac
          fi
          pnpm --dir electron package --mac "${sign_args[@]}"
      - name: Remove the signing keychain
        if: ${{ always() && env.APPLE_CERTIFICATE != '' }}
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - name: Upload native addon symbols
        run: node scripts/ci/upload-sentry-symbols.mjs electron/dist
      - name: Verify native core shutdown
        run: SABLE_NODE_ADDON="$PWD/electron/dist/sable_node.node" node --test crates/sable-node/tests/native-lifecycle.mjs
      - name: Verify native core shutdown in Electron
        run: ELECTRON_RUN_AS_NODE=1 SABLE_NODE_ADDON="$PWD/electron/dist/sable_node.node" pnpm --dir electron exec electron --test "$PWD/crates/sable-node/tests/native-lifecycle.mjs"
      - name: Publish Electron bundles and update metadata
        run: node electron/publish-updates.mjs

  ios:
    name: Build iOS
    needs: [setup-release, build-web]
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      ipa_size: ${{ steps.ipa.outputs.size }}
      ipa_version: ${{ steps.ipa.outputs.version }}
      ipa_build: ${{ steps.ipa.outputs.build }}
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      RUST_TARGETS: aarch64-apple-ios
      # Read by src-tauri/build.rs, which bakes them into the binary.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      TAURI_VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      TAURI_VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      TAURI_VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      APPLE_API_ISSUER: ${{ secrets.APP_STORE_API_ISSUER_ID }}
      APPLE_API_KEY: ${{ secrets.APP_STORE_API_KEY_ID }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download web assets
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: web-assets
      - name: Drop browser core assets
        run: rm -rf dist/_app/immutable/workers
      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          rust: 'true'
          rust-cache-key: tauri-ios
          install-mise-tools: 'false'
      - name: Write the App Store Connect API key
        uses: ./.forgejo/actions/app-store-connect-key
        with:
          key-id: ${{ secrets.APP_STORE_API_KEY_ID }}
          key: ${{ secrets.APP_STORE_API_KEY_BASE64 }}
      - name: Prepare in-place v1 upgrade identity
        if: ${{ needs.setup-release.outputs.nightly != 'true' }}
        run: node scripts/ci/prepare-v1-release.mjs
      - name: Stamp release version into tauri.conf.json
        run: node scripts/ci/set-tauri-version.mjs "${VERSION%%-*}"
      - name: Set up iOS project
        run: |
          command -v pod >/dev/null || brew install cocoapods
          pnpm tauri ios init --ci
      - name: Download iOS frameworks
        run: pnpm ios:frameworks
      - name: Test iOS notification cooldown
        run: |
          swiftc src-tauri/ios/NotificationService/AlertCooldown.swift src-tauri/ios/tests/AlertCooldownTests.swift -o "$RUNNER_TEMP/sable-alert-cooldown-tests"
          "$RUNNER_TEMP/sable-alert-cooldown-tests"
      - name: Add Rust target
        run: |
          # shellcheck disable=SC2086 # RUST_TARGETS is a space-separated list.
          rustup target add $RUST_TARGETS
      - name: Build iOS bundle
        id: ipa
        run: |
          pnpm tauri ios build --config src-tauri/tauri.ci.conf.json \
            --export-method app-store-connect --build-number "$(date -u +%s)" --ci
          node scripts/ci/upload-sentry-symbols.mjs --ios
          ipa="$(find src-tauri/gen/apple/build -type f -name '*.ipa' | head -n 1)"
          [ -n "$ipa" ] || { echo 'No iOS IPA found' >&2; exit 1; }
          target="$(dirname "$ipa")/sable-${VERSION}-ios-arm64.ipa"
          [ "$ipa" = "$target" ] || mv "$ipa" "$target"

          unzip -p "$target" 'Payload/*.app/Info.plist' > Info.plist
          short_version="$(plutil -extract CFBundleShortVersionString raw -o - Info.plist)"
          bundle_version="$(plutil -extract CFBundleVersion raw -o - Info.plist)"

          {
            echo "path=$target"
            echo "size=$(stat -f%z "$target")"
            echo "version=$short_version"
            echo "build=$bundle_version"
          } >> "$GITHUB_OUTPUT"
      - name: Attach iOS bundle to release
        env:
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: node scripts/ci/forgejo-release.mjs upload "$IPA_PATH"
      - name: Upload to TestFlight
        env:
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: |
          command -v fastlane >/dev/null || brew install fastlane
          fastlane ios testflight ipa:"$IPA_PATH" version:"$VERSION"

