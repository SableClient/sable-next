name: Build apps
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach bundles to (e.g. v1.2.3). Empty builds a nightly from HEAD.'
        required: false
        type: string
permissions: {}
concurrency:
  group: tauri-build-${{ github.event_name == 'workflow_dispatch' && (inputs.tag || github.run_id) || github.ref_name }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}
env:
  MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: '1'
  CARGO_PROFILE_RELEASE_STRIP: none
  CARGO_TERM_COLOR: always
  FORGEJO_URL: https://git.sable.moe
  FORGEJO_REPOSITORY: ${{ github.repository }}
  FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
  # Each nightly is ~1.5 GB of bundles on a node with ~100 GB of disk.
  NIGHTLY_KEEP: 20
  SCCACHE_BUCKET: sccache
  SCCACHE_S3_KEY_PREFIX: sable-next
  SCCACHE_ENDPOINT: https://s3.erwanleboucher.dev
  SCCACHE_REGION: us-east-1
  SCCACHE_S3_USE_SSL: 'true'
jobs:
  setup-release:
    name: Resolve release target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
      nightly: ${{ steps.meta.outputs.nightly }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release meta
        id: meta
        uses: ./.forgejo/actions/resolve-release-meta
        with:
          input-tag: ${{ inputs.tag }}
      - name: Wait for release to exist
        if: ${{ steps.meta.outputs.nightly != 'true' }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: node scripts/ci/forgejo-release.mjs wait --attempts 12 --interval 15
      - name: Create nightly prerelease
        if: ${{ steps.meta.outputs.nightly == 'true' }}
        env:
          SHA: ${{ github.sha }}
        run: |
          node scripts/ci/forgejo-release.mjs ensure \
            --tag "${{ steps.meta.outputs.tag }}" \
            --sha "$SHA" \
            --prerelease true \
            --title "Nightly build ${{ steps.meta.outputs.version }}" \
            --notes "Nightly build from main at $SHA"
  build-web:
    name: Build web assets
    needs: setup-release
    runs-on: ubuntu-latest
    # Cold, this compiles the workspace for wasm32 in release. Warm, the setup
    # action restores the bindings and only Vite runs.
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RUSTC_WRAPPER: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      # Absent on forks, which builds an app with error reporting switched off.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      UPDATER_ENDPOINT: ${{ needs.setup-release.outputs.nightly == 'true' && 'https://git.sable.moe/SableClient/sable-next/releases/download/nightly/latest.json' || '' }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Set up app and build
        uses: ./.forgejo/actions/setup
        with:
          build: 'true'
      # Matching the package naming keeps the nightly prune replacing old web
      # bundles in step with the desktop and mobile ones.
      - name: Attach web bundle to release
        run: |
          tar --create --gzip --file "sable-next-${VERSION}-web.tar.gz" --directory dist .
          node scripts/ci/forgejo-release.mjs upload "sable-next-${VERSION}-web.tar.gz"
      - name: Upload web assets
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: web-assets
          path: |
            .svelte-kit/output
            dist
            src/generated/wasm
          if-no-files-found: error
          retention-days: 7
  docker:
    name: Build and push image
    needs: [setup-release, build-web]
    runs-on: multiarch
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: git.sable.moe
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      # The Dockerfile only copies `dist`, so the image reuses the bundle
      # build-web already produced for the desktop packages.
      - name: Download web assets
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: web-assets
      # `github.repository` keeps the owner's capitals and an image reference
      # cannot. metadata-action lowercases its own tags; the cache refs below
      # are handed to buildx verbatim.
      - name: Resolve the image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
      - name: Extract image metadata
        id: meta
        uses: https://github.com/docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable=${{ needs.setup-release.outputs.nightly == 'true' }}
            type=sha,prefix=,format=short,enable=${{ needs.setup-release.outputs.nightly == 'true' }}
            type=raw,value=latest,enable=${{ needs.setup-release.outputs.nightly == 'false' }}
            type=semver,pattern={{version}},value=${{ needs.setup-release.outputs.version }},enable=${{ needs.setup-release.outputs.nightly == 'false' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.setup-release.outputs.version }},enable=${{ needs.setup-release.outputs.nightly == 'false' }}
      - name: Log in to the container registry
        uses: https://github.com/docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.PACKAGES_USER }}
          password: ${{ secrets.PACKAGES_TOKEN }}
      # The base image is multi-arch but `setcap` still runs under emulation.
      - name: Set up QEMU
        uses: https://github.com/docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push image
        uses: https://github.com/docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache,mode=max

  linux:
    name: Linux x86_64 (CEF)
    needs: [setup-release, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RUSTC_WRAPPER: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      ARCH: x86_64
      MISE_DISABLE_TOOLS: aqua:WebAssembly/binaryen,ubi:rustwasm/wasm-bindgen
      # rustc peaks at several GB per crate while compiling the CEF runtime.
      CARGO_BUILD_JOBS: '4'
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      # Read by src-tauri/build.rs, which bakes them into the binary.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      IS_NIGHTLY: ${{ needs.setup-release.outputs.nightly }}
      UPDATER_ENDPOINT: ${{ needs.setup-release.outputs.nightly == 'true' && 'https://git.sable.moe/SableClient/sable-next/releases/download/nightly/latest.json' || '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download web assets
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: web-assets
      # tauri-runtime depends on webkit2gtk on Linux whatever the runtime, so
      # the headers stay even though nothing renders through it. --as-needed
      # keeps it out of the binary, hence no runtime dep in nfpm.yaml.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            file \
            libayatana-appindicator3-1 \
            libclang-dev \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config
      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          rust: 'true'
          rust-cache-key: tauri-linux
          install-mise-tools: 'false'
      - name: Prepare in-place v1 upgrade identity
        if: ${{ needs.setup-release.outputs.nightly != 'true' }}
        run: node scripts/ci/prepare-v1-release.mjs
      - name: Stamp release version into tauri.conf.json
        run: |
          args=''
          [ -n "$UPDATER_ENDPOINT" ] && args="--updater-endpoint=$UPDATER_ENDPOINT"
          node scripts/ci/set-tauri-version.mjs "$VERSION" $args
      - name: Build Linux bundles
        run: |
          config_args=(--config src-tauri/tauri.ci.conf.json)
          if [ "$IS_NIGHTLY" = 'true' ]; then
            config_args+=(--config src-tauri/tauri.nightly.conf.json)
            package_args=('Sable v2 Nightly' sable-next)
          else
            package_args=(Sable sable)
          fi
          pnpm tauri:cef build "${config_args[@]}"
          mise run cef:package "$VERSION" "${package_args[@]}"
          node scripts/ci/upload-sentry-symbols.mjs target/release
      - name: Check the CEF packages carry what they should
        run: |
          deb="target/release/bundle/deb/sable-next-${VERSION}-linux-${ARCH}.deb"
          contents=$(dpkg-deb --contents "$deb")
          ctrl=$(dpkg-deb --ctrl-tarfile "$deb" | tar -t)
          grep -q 'etc/apparmor.d/sable-next$' <<<"$contents"
          grep -qx './postinst' <<<"$ctrl"
          grep -qx './prerm' <<<"$ctrl"
          grep -q 'opt/sable-next/CEF-LICENSE.txt$' <<<"$contents"
      - name: Check stable packages replace v1
        if: ${{ needs.setup-release.outputs.nightly != 'true' }}
        run: test "$(dpkg-deb --field "target/release/bundle/deb/sable-next-${VERSION}-linux-${ARCH}.deb" Package)" = sable
      - name: Sign the AppImage for the updater
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: pnpm tauri signer sign "target/release/bundle/appimage/sable-next-${VERSION}-linux-${ARCH}.AppImage"
      - name: Attach Linux bundles to release
        run: |
          bundles=()
          for bundle in "target/release/bundle/deb/sable-next-${VERSION}-linux-${ARCH}.deb" \
                        "target/release/bundle/rpm/sable-next-${VERSION}-linux-${ARCH}.rpm" \
                        "target/release/bundle/sable-next-${VERSION}-linux-${ARCH}.tar.gz" \
                        "target/release/bundle/appimage/sable-next-${VERSION}-linux-${ARCH}.AppImage" \
                        "target/release/bundle/appimage/sable-next-${VERSION}-linux-${ARCH}.AppImage.sig"; do
            [ -e "$bundle" ] && bundles+=("$bundle")
          done
          node scripts/ci/forgejo-release.mjs upload "${bundles[@]}"
  android:
    name: Build Android
    needs: [setup-release, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RUSTC_WRAPPER: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      MISE_ENV: tauri
      # Limit peak memory while compiling the SDK and linking the app on the Android runner.
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '4'
      # Matches the ABIs passed to `tauri android build` below.
      RUST_TARGETS: aarch64-linux-android armv7-linux-androideabi
      # Read by src-tauri/build.rs, which bakes them into the binary.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      IS_NIGHTLY: ${{ needs.setup-release.outputs.nightly }}
      UPDATER_ENDPOINT: ${{ needs.setup-release.outputs.nightly == 'true' && 'https://git.sable.moe/SableClient/sable-next/releases/download/nightly/latest.json' || '' }}
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download web assets
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: web-assets
      - name: Drop assets the native app never loads
        run: rm -rf dist/deepfilternet3 dist/_app/immutable/workers
      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          rust: 'true'
          rust-cache-key: tauri-android
          install-mise-tools: 'false'
      - name: Set up Android SDK and NDK
        run: mise run tauri:setup:android
      - name: Add Rust targets
        run: |
          # shellcheck disable=SC2086 # RUST_TARGETS is a space-separated list.
          rustup target add $RUST_TARGETS
      - name: Set up Gradle cache
        uses: https://github.com/gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Limit Gradle memory
        run: |
          printf '\n%s\n' \
            'org.gradle.workers.max=1' \
            'org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8' \
            'kotlin.daemon.jvmargs=-Xmx512m' \
            >> src-tauri/gen/android/gradle.properties
      - name: Prepare in-place v1 upgrade identity
        if: ${{ needs.setup-release.outputs.nightly != 'true' }}
        run: node scripts/ci/prepare-v1-release.mjs
      - name: Stamp release version into tauri.conf.json
        run: |
          args=''
          [ -n "$UPDATER_ENDPOINT" ] && args="--updater-endpoint=$UPDATER_ENDPOINT"
          node scripts/ci/set-tauri-version.mjs "$VERSION" $args
      - name: Prepare nightly Android package
        if: ${{ needs.setup-release.outputs.nightly == 'true' }}
        run: |
          app_dir=src-tauri/gen/android/app
          build_src_dir=src-tauri/gen/android/buildSrc
          nightly_package_dir=moe/sable/next/nightly
          nightly_source_dir="$RUNNER_TEMP/android-nightly-package"

          # Tauri resolves sources from the active identifier's package path.
          mkdir -p "$nightly_source_dir"
          cp -a "$app_dir/src/main/java/moe/sable/next" "$nightly_source_dir/app"
          cp -a "$build_src_dir/src/main/java/moe/sable/next" "$nightly_source_dir/buildSrc"
          find "$nightly_source_dir" -type f -exec sed -i \
            's/moe\.sable\.next/moe.sable.next.nightly/g' {} +
          rm -rf "$app_dir/src/main/java/moe/sable/next" "$build_src_dir/src/main/java/moe/sable/next"
          mkdir -p "$app_dir/src/main/java/moe/sable/next" "$build_src_dir/src/main/java/moe/sable/next"
          mv "$nightly_source_dir/app" "$app_dir/src/main/java/$nightly_package_dir"
          mv "$nightly_source_dir/buildSrc" "$build_src_dir/src/main/java/$nightly_package_dir"
          sed -i 's/moe\.sable\.next/moe.sable.next.nightly/g' \
            "$app_dir/build.gradle.kts" "$app_dir/src/main/AndroidManifest.xml"
          sed -i \
            -e 's/Java_moe_sable_next_MainActivity/Java_moe_sable_next_nightly_MainActivity/g' \
            -e 's#moe/sable/next/MainActivity#moe/sable/next/nightly/MainActivity#g' \
            src-tauri/src/mobile.rs
      - name: Set up Android signing
        if: ${{ env.ANDROID_KEY_BASE64 != '' }}
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=$ANDROID_KEY_ALIAS" > keystore.properties
          echo "password=$ANDROID_KEY_PASSWORD" >> keystore.properties
          base64 -d <<< "$ANDROID_KEY_BASE64" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
      - name: Build FOSS Android APKs
        if: ${{ needs.setup-release.outputs.nightly != 'true' }}
        env:
          SABLE_FOSS: '1'
        run: |
          node scripts/fastlane-changelog.mjs "$VERSION" --check
          unset VITE_SENTRY_DSN VITE_SENTRY_ENVIRONMENT SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT
          mv src-tauri/capabilities/geolocation.json "$RUNNER_TEMP/geolocation.json"
          pnpm tauri android build --config src-tauri/tauri.ci.conf.json --apk --split-per-abi \
            --target aarch64 armv7 -- --no-default-features --features wry
          mv "$RUNNER_TEMP/geolocation.json" src-tauri/capabilities/geolocation.json
          for pair in 'arm64:aarch64' 'arm:armv7'; do
            flavor="${pair%%:*}"
            abi="${pair##*:}"
            dir="src-tauri/gen/android/app/build/outputs/apk/$flavor/release"
            apk="$(find "$dir" -name '*.apk' -type f | head -n 1)"
            [ -n "$apk" ] || { echo "FOSS $abi APK not found" >&2; exit 1; }
            mv "$apk" "$dir/sable-next-${VERSION}-android-${abi}-foss.apk"
          done
      - name: Build Android bundles
        run: |
          config_args=(--config src-tauri/tauri.ci.conf.json)
          [ "$IS_NIGHTLY" = 'true' ] && config_args+=(--config src-tauri/tauri.nightly.conf.json)
          pnpm tauri android build "${config_args[@]}" --apk --aab --target aarch64 armv7
          node scripts/ci/upload-sentry-symbols.mjs \
            target/aarch64-linux-android/release target/armv7-linux-androideabi/release
          out='src-tauri/gen/android/app/build/outputs'
          apk="$(find "$out/apk/universal/release" -name '*.apk' -type f | head -n 1)"
          aab="$(find "$out/bundle/universalRelease" -name '*.aab' -type f | head -n 1)"
          [ -n "$apk" ] || { echo 'APK not found' >&2; exit 1; }
          [ -n "$aab" ] || { echo 'AAB not found' >&2; exit 1; }
          mv "$apk" "$(dirname "$apk")/sable-next-${VERSION}-android-universal.apk"
          mv "$aab" "$(dirname "$aab")/sable-next-${VERSION}-android-universal.aab"
      - name: Verify the APK is signed
        if: ${{ env.ANDROID_KEY_BASE64 != '' }}
        run: |
          apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/sable-next-${VERSION}-android-universal.apk"
          sdk="$(mise exec -- printenv ANDROID_HOME)"
          apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort | tail -n 1)"
          [ -n "$apksigner" ] || { echo 'apksigner not found' >&2; exit 1; }
          mise exec -- "$apksigner" verify --print-certs "$apk"
      - name: Attach Android bundles to release
        run: |
          mapfile -d '' bundles < <(find src-tauri/gen/android/app/build/outputs -type f \
            -name 'sable-next-*' \( -name '*.apk' -o -name '*.aab' \) -print0)
          [ "${#bundles[@]}" -gt 0 ] || { echo 'No Android bundles found' >&2; exit 1; }
          node scripts/ci/forgejo-release.mjs upload "${bundles[@]}"
  github-bundles:
    name: Wait for GitHub bundles
    needs: setup-release
    runs-on: ubuntu-latest
    # github-bundles.json is published by the GitHub-side handoff job, which
    # waits on the whole desktop/linux/ios matrix.
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Wait for handoff manifest
        env:
          TAG: ${{ needs.setup-release.outputs.tag }}
        run: |
          node scripts/ci/forgejo-release.mjs wait-assets \
            --names github-bundles.json --attempts 220 --interval 30
  obtainium:
    name: Publish Obtainium config
    needs: [setup-release, android, github-bundles]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Generate obtainium.json
        run: node scripts/ci/obtainium-generate.mjs "$VERSION" "$TAG" obtainium.json
      - name: Attach Obtainium config to release
        run: node scripts/ci/forgejo-release.mjs upload obtainium.json
  altstore:
    name: Publish AltStore source
    needs: [setup-release, github-bundles]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      IS_NIGHTLY: ${{ needs.setup-release.outputs.nightly }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      # One asset name for both channels keeps the subscribed URL stable.
      - name: Build AltStore source
        run: |
          node scripts/ci/forgejo-release.mjs download --pattern github-bundles.json --dir .
          ipa_name="$(jq -r '.ipa.name' github-bundles.json)"
          ipa_size="$(jq -r '.ipa.size' github-bundles.json)"
          ipa_version="$(jq -r '.ipa.version' github-bundles.json)"
          ipa_build="$(jq -r '.ipa.build' github-bundles.json)"

          if [ "$IS_NIGHTLY" = 'true' ]; then
            # Older entries would 404 once their nightly release is pruned.
            export ALTSTORE_MAX_VERSIONS="$NIGHTLY_KEEP"
            node scripts/ci/forgejo-release.mjs download \
              --tag nightly --pattern altstore-source.json --dir .
            [ -e altstore-source.json ] || \
              cp scripts/ci/templates/altstore-source-nightly.json altstore-source.json
          else
            previous="$(
              node scripts/ci/forgejo-release.mjs find-previous --asset altstore-source.json
            )"
            if [ -n "$previous" ]; then
              echo "Carrying versions forward from $previous."
              node scripts/ci/forgejo-release.mjs download \
                --tag "$previous" --pattern altstore-source.json --dir .
            else
              cp scripts/ci/templates/altstore-source.json altstore-source.json
            fi
          fi

          if [ "$IS_NIGHTLY" = 'true' ]; then
            export ALTSTORE_BUNDLE_IDENTIFIER=moe.sable.next.nightly
          else
            export ALTSTORE_BUNDLE_IDENTIFIER=moe.sable.client
          fi
          node scripts/ci/update-altstore-source.mjs \
            altstore-source.json \
            "$ipa_version" \
            "$ipa_build" \
            "$ipa_size" \
            "https://git.sable.moe/SableClient/sable-next/releases/download/${TAG}/${ipa_name}" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "Sable v2 $VERSION"
      - name: Attach AltStore source to release
        run: node scripts/ci/forgejo-release.mjs upload altstore-source.json
  updater-manifest:
    name: Publish updater manifest
    needs: [setup-release, linux, github-bundles]
    if: ${{ always() && needs.setup-release.result == 'success' && needs.linux.result == 'success' && needs.github-bundles.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Build updater manifest
        run: node scripts/ci/build-updater-manifest.mjs
      - name: Upload updater manifest
        if: ${{ hashFiles('latest.json') != '' }}
        run: node scripts/ci/forgejo-release.mjs upload latest.json
  publish-latest:
    name: Refresh latest tag
    needs: [setup-release, updater-manifest, altstore]
    if: ${{ needs.setup-release.outputs.nightly != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      SHA: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Upload manifests to latest
        run: |
          node scripts/ci/forgejo-release.mjs download \
            --tag "$TAG" --pattern 'latest.json' --dir .
          node scripts/ci/forgejo-release.mjs download \
            --tag "$TAG" --pattern 'altstore-source.json' --dir .

          git tag -f latest "$SHA"
          git push --force \
            "https://oauth2:${FORGEJO_TOKEN}@git.sable.moe/${FORGEJO_REPOSITORY}.git" \
            refs/tags/latest

          node scripts/ci/forgejo-release.mjs ensure \
            --tag latest \
            --sha "$SHA" \
            --title 'Latest stable' \
            --notes "Stable manifests for $VERSION. Bundles live on the $TAG release."
          node scripts/ci/forgejo-release.mjs edit \
            --tag latest \
            --title 'Latest stable' \
            --notes "Stable manifests for $VERSION. Bundles live on the $TAG release."
          node scripts/ci/forgejo-release.mjs upload --tag latest latest.json altstore-source.json
  publish-nightly-channel:
    name: Refresh nightly channel metadata
    needs: [setup-release, updater-manifest, obtainium, altstore]
    if: ${{ always() && needs.setup-release.outputs.nightly == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      SHA: ${{ github.sha }}
      VERSION: ${{ needs.setup-release.outputs.version }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Update the nightly channel
        run: |
          notes="Update metadata for nightly build $VERSION. Bundles live on the $TAG release."
          node scripts/ci/forgejo-release.mjs ensure \
            --tag nightly \
            --sha "$SHA" \
            --prerelease true \
            --title 'Nightly channel' \
            --notes "$notes"
          node scripts/ci/forgejo-release.mjs edit \
            --tag nightly \
            --prerelease true \
            --title 'Nightly channel' \
            --notes "$notes"
          for name in obtainium.json altstore-source.json latest.json; do
            node scripts/ci/forgejo-release.mjs download \
              --tag "$TAG" --pattern "$name" --dir .
            [ ! -e "$name" ] || \
              node scripts/ci/forgejo-release.mjs upload --tag nightly "$name"
          done
      - name: Prune old nightly releases
        run: |
          repo=https://sableclient.github.io/sable-next/repo
          protect=""
          for arch in x86_64 aarch64; do
            commit="$(curl -fsS "$repo/refs/heads/app/moe.sable.next.Nightly/$arch/master")"
            protect="$protect,$(curl -fsS "$repo/objects/${commit:0:2}/${commit:2}.commit" \
              | grep -aoE 'download/nightly-[^/]+' | cut -d/ -f2 | tr '\n' ',')"
          done
          mkdir channel
          node scripts/ci/forgejo-release.mjs download --tag nightly --pattern '*.json' --dir channel
          protect="$protect,$(cat channel/*.json | grep -oE 'download/nightly-[^/]+' \
            | cut -d/ -f2 | sort -u | tr '\n' ',')"
          node scripts/ci/forgejo-release.mjs prune --keep "$NIGHTLY_KEEP" --protect "$protect"
  distribute-aur:
    name: Publish to the AUR
    needs: [setup-release, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      IS_NIGHTLY: ${{ needs.setup-release.outputs.nightly }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download the deb
        run: |
          mkdir debs
          node scripts/ci/forgejo-release.mjs download \
            --pattern "sable-next-${VERSION}-linux-x86_64.deb" --dir debs
          ls debs | grep -q . || { echo 'The x86_64 deb is not on the release' >&2; exit 1; }
      - name: Push to the AUR
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          if [ -z "${AUR_KEY:-}" ]; then
            echo '::notice::AUR_KEY is not set; skipping the AUR publish.'
            exit 0
          fi
          if [ "$IS_NIGHTLY" = 'true' ]; then
            pkg=sable-nightly-bin
            pkgver="${VERSION//-/.}"
            relver="$VERSION"
          else
            pkg=sable-bin
            pkgver="$VERSION"
            relver=-
          fi
          sha="$(sha256sum "debs/sable-next-${VERSION}-linux-x86_64.deb" | awk '{print $1}')"

          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur_key -o IdentitiesOnly=yes"

          git clone "ssh://aur@aur.archlinux.org/${pkg}.git" aur-repo
          bash scripts/ci/render-aur.sh "$pkg" "$pkgver" "$relver" "$sha" aur-render
          cp aur-render/PKGBUILD aur-render/.SRCINFO "aur-render/${pkg}.install" aur-repo/

          cd aur-repo
          git config user.name 'Sable release'
          git config user.email 'release@sable.moe'
          git add PKGBUILD .SRCINFO "${pkg}.install"
          if git diff --cached --quiet; then
            echo 'Nothing changed; skipping the push.'
            exit 0
          fi
          git commit -m "${pkg} ${VERSION}"
          git push
  distribute-homebrew:
    name: Publish the Homebrew cask
    needs: [setup-release, github-bundles]
    if: ${{ needs.setup-release.outputs.nightly != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download the DMG
        run: |
          mkdir dmg
          node scripts/ci/forgejo-release.mjs download \
            --pattern "sable-next-${VERSION}-macos-universal.dmg" --dir dmg
          ls dmg | grep -q . || { echo 'The DMG is not on the release' >&2; exit 1; }
      - name: Push the cask to the tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo '::notice::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew publish.'
            exit 0
          fi
          sha="$(sha256sum "dmg/sable-next-${VERSION}-macos-universal.dmg" | awk '{print $1}')"
          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@git.sable.moe/SableClient/homebrew-sable.git" tap

          mkdir -p tap/Casks
          sed \
            -e "s/^  version .*/  version '${VERSION}'/" \
            -e "s/^  sha256 .*/  sha256 '${sha}'/" \
            packaging/homebrew/sable.rb > tap/Casks/sable.rb

          cd tap
          git config user.name 'Sable release'
          git config user.email 'release@sable.moe'
          git add Casks/sable.rb
          if git diff --cached --quiet; then
            echo 'Nothing changed; skipping the push.'
            exit 0
          fi
          git commit -m "sable ${VERSION}"
          git push origin HEAD:refs/heads/main
  distribute-flathub:
    name: Open the Flathub update PR
    needs: [setup-release, github-bundles]
    if: ${{ needs.setup-release.outputs.nightly != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download the tarballs
        run: |
          mkdir tarballs
          node scripts/ci/forgejo-release.mjs download \
            --pattern "sable-next-${VERSION}-linux-*.tar.gz" --dir tarballs
      - name: Open the Flathub PR
        env:
          FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
        run: |
          if [ -z "${FLATHUB_TOKEN:-}" ]; then
            echo '::notice::FLATHUB_TOKEN is not set; skipping the Flathub PR.'
            exit 0
          fi
          if ! git clone --depth 1 \
            "https://x-access-token:${FLATHUB_TOKEN}@github.com/flathub/moe.sable.client.git" flathub; then
            echo '::notice::flathub/moe.sable.client does not exist yet; submit the app first.'
            exit 0
          fi

          arch_args() {
            local file="tarballs/sable-next-${VERSION}-linux-$1.tar.gz"
            if [ -e "$file" ]; then
              echo "$(sha256sum "$file" | awk '{print $1}'):$(stat -c %s "$file")"
            else
              echo '-'
            fi
          }
          node scripts/ci/render-flatpak-stable.mjs "$VERSION" "$(arch_args x86_64)" "$(arch_args aarch64)"

          src=packaging/flatpak
          sed 's#\.\./\.\./LICENSE#LICENSE#' "$src/moe.sable.client.yml" > flathub/moe.sable.client.yml
          cp "$src/moe.sable.client.desktop" "$src/moe.sable.client.metainfo.xml" "$src/flathub.json" "$src/sable-next.sh" flathub/
          cp LICENSE flathub/LICENSE
          rm -rf flathub/icons && cp -r "$src/icons" flathub/icons

          cd flathub
          git config user.name 'Sable release'
          git config user.email 'release@sable.moe'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing changed; skipping the Flathub PR.'
            exit 0
          fi
          git checkout -b "update-${VERSION}"
          git commit -m "Update Sable to ${VERSION}"
          git push origin "update-${VERSION}"
          VERSION="$VERSION" python3 - <<'PY' | curl -fsS -X POST \
            -H "Authorization: Bearer ${FLATHUB_TOKEN}" -H 'Accept: application/vnd.github+json' \
            -d @- https://api.github.com/repos/flathub/moe.sable.client/pulls
          import json, os
          version = os.environ["VERSION"]
          print(json.dumps({
              "title": f"Update Sable to {version}",
              "head": f"update-{version}",
              "base": "master",
              "body": f"Bumps the release tarballs to {version}.",
          }))
          PY
