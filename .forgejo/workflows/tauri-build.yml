  altstore:
    name: Publish AltStore source
    needs: [setup-release, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      IS_NIGHTLY: ${{ needs.setup-release.outputs.nightly }}
      IPA_SIZE: ${{ needs.ios.outputs.ipa_size }}
      IPA_VERSION: ${{ needs.ios.outputs.ipa_version }}
      IPA_BUILD: ${{ needs.ios.outputs.ipa_build }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      # One asset name for both channels keeps the subscribed URL stable.
      - name: Build AltStore source
        run: |
          ipa_name="sable-${VERSION}-ios-arm64.ipa"
          ipa_size="$IPA_SIZE"
          ipa_version="$IPA_VERSION"
          ipa_build="$IPA_BUILD"

          if [ "$IS_NIGHTLY" = 'true' ]; then
            # Older entries would 404 once their nightly release is pruned.
            export ALTSTORE_MAX_VERSIONS="$NIGHTLY_KEEP"
            node scripts/ci/forgejo-release.mjs download \
              --tag nightly --pattern altstore-source.json --dir . --optional
            [ -e altstore-source.json ] || \
              cp scripts/ci/templates/altstore-source-nightly.json altstore-source.json
          else
            previous="$(
              node scripts/ci/forgejo-release.mjs find-previous --asset altstore-source.json
            )"
            if [ -n "$previous" ]; then
              echo "Carrying versions forward from $previous."
              node scripts/ci/forgejo-release.mjs download \
                --tag "$previous" --pattern altstore-source.json --dir .
            else
              cp scripts/ci/templates/altstore-source.json altstore-source.json
            fi
          fi

          export ALTSTORE_BUNDLE_IDENTIFIER=moe.sable.app
          node scripts/ci/update-altstore-source.mjs \
            altstore-source.json \
            "$ipa_version" \
            "$ipa_build" \
            "$ipa_size" \
            "https://git.sable.moe/SableClient/sable-next/releases/download/${TAG}/${ipa_name}" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "Sable $VERSION"
      - name: Attach AltStore source to release
        run: node scripts/ci/forgejo-release.mjs upload altstore-source.json
  publish-latest:
    name: Refresh latest tag
    needs: [setup-release, altstore, obtainium]
    if: ${{ needs.setup-release.outputs.nightly != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      SHA: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Upload manifests to latest
        run: |
          node scripts/ci/forgejo-release.mjs download \
            --tag "$TAG" --pattern 'altstore-source.json' --dir .
          node scripts/ci/forgejo-release.mjs download \
            --tag "$TAG" --pattern 'obtainium.json' --dir .
          node scripts/ci/forgejo-release.mjs download \
            --tag "$TAG" --pattern "sable-$VERSION-x64.exe" --dir .
          node scripts/ci/forgejo-release.mjs download \
            --tag "$TAG" --pattern "sable-$VERSION-x64.msi" --dir .
          mv "sable-$VERSION-x64.exe" sable-windows-x86_64-setup.exe
          mv "sable-$VERSION-x64.msi" sable-windows-x86_64.msi

          git tag -f latest "$SHA"
          git push --force \
            "https://oauth2:${FORGEJO_TOKEN}@git.sable.moe/${FORGEJO_REPOSITORY}.git" \
            refs/tags/latest

          node scripts/ci/forgejo-release.mjs ensure \
            --tag latest \
            --sha "$SHA" \
            --title 'Latest stable' \
            --notes "Stable manifests for $VERSION. Bundles live on the $TAG release."
          node scripts/ci/forgejo-release.mjs edit \
            --tag latest \
            --title 'Latest stable' \
            --notes "Stable manifests for $VERSION. Bundles live on the $TAG release."
          node scripts/ci/forgejo-release.mjs upload --tag latest altstore-source.json obtainium.json \
            sable-windows-x86_64-setup.exe sable-windows-x86_64.msi
  publish-nightly-channel:
    name: Refresh nightly channel metadata
    needs: [setup-release, obtainium, altstore]
    if: ${{ always() && needs.setup-release.outputs.nightly == 'true' && needs.setup-release.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      SHA: ${{ github.sha }}
      VERSION: ${{ needs.setup-release.outputs.version }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Update the nightly channel
        run: |
          notes="Update metadata for nightly build $VERSION. Bundles live on the $TAG release."
          node scripts/ci/forgejo-release.mjs ensure \
            --tag nightly \
            --sha "$SHA" \
            --prerelease true \
            --title 'Nightly channel' \
            --notes "$notes"
          node scripts/ci/forgejo-release.mjs edit \
            --tag nightly \
            --prerelease true \
            --title 'Nightly channel' \
            --notes "$notes"
          for name in obtainium.json altstore-source.json; do
            node scripts/ci/forgejo-release.mjs download \
              --tag "$TAG" --pattern "$name" --dir . --optional
            [ ! -e "$name" ] || \
              node scripts/ci/forgejo-release.mjs upload --tag nightly "$name"
          done
      - name: Prune old nightly releases
        run: |
          repo=https://sableclient.github.io/sable-next/repo
          protect=""
          for arch in x86_64; do
            commit="$(curl -fsS "$repo/refs/heads/app/moe.sable.next.electron.Nightly/$arch/master")"
            protect="$protect,$(curl -fsS "$repo/objects/${commit:0:2}/${commit:2}.commit" \
              | grep -aoE 'download/nightly-[^/]+' | cut -d/ -f2 | tr '\n' ',')"
          done
          mkdir channel
          node scripts/ci/forgejo-release.mjs download --tag nightly --pattern '*.json' --dir channel --optional
          node scripts/ci/forgejo-release.mjs download --tag nightly --pattern '*.yml' --dir channel --optional
          protect="$protect,$(cat channel/* | grep -oE 'download/nightly-[^/]+' \
            | cut -d/ -f2 | sort -u | tr '\n' ',')"
          node scripts/ci/forgejo-release.mjs prune --keep "$NIGHTLY_KEEP" --protect "$protect"
  sign-release:
    name: Sign release checksums
    needs: [setup-release, electron-linux, electron-macos, obtainium, altstore]
    if: ${{ needs.setup-release.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
      RELEASE_GPG_KEY_ID: ${{ secrets.RELEASE_GPG_KEY_ID }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
    steps:
      - name: Check out repository
        if: ${{ env.RELEASE_GPG_KEY != '' && env.RELEASE_GPG_KEY_ID != '' }}
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download the release assets
        if: ${{ env.RELEASE_GPG_KEY != '' && env.RELEASE_GPG_KEY_ID != '' }}
        run: |
          mkdir assets
          node scripts/ci/forgejo-release.mjs download --pattern '*' --dir assets
          rm -f assets/SHA256SUMS assets/SHA256SUMS.asc
      - name: Sign and upload the checksums
        if: ${{ env.RELEASE_GPG_KEY != '' && env.RELEASE_GPG_KEY_ID != '' }}
        run: |
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          printf '%s\n' "$RELEASE_GPG_KEY" | gpg --batch --import
          (cd assets && sha256sum -- *) > SHA256SUMS
          printf '%s' "$RELEASE_GPG_PASSPHRASE" | gpg --batch --yes \
            --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$RELEASE_GPG_KEY_ID" \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          node scripts/ci/forgejo-release.mjs upload SHA256SUMS SHA256SUMS.asc
      - name: Report the skipped signing
        if: ${{ env.RELEASE_GPG_KEY == '' || env.RELEASE_GPG_KEY_ID == '' }}
        run: echo '::notice::RELEASE_GPG_KEY/RELEASE_GPG_KEY_ID are not set; skipping the checksum signature.'
  distribute-aur:
    name: Publish to the AUR
    needs: [setup-release, electron-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      IS_NIGHTLY: ${{ needs.setup-release.outputs.nightly }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download the deb
        run: |
          mkdir debs
          node scripts/ci/forgejo-release.mjs download \
            --pattern "sable-${VERSION}-amd64.deb" --dir debs
      - name: Push to the AUR
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          if [ -z "${AUR_KEY:-}" ]; then
            echo '::notice::AUR_KEY is not set; skipping the AUR publish.'
            exit 0
          fi
          if [ "$IS_NIGHTLY" = 'true' ]; then
            pkg=sable-nightly-bin
            pkgver="${VERSION//-/.}"
            relver="$VERSION"
          else
            pkg=sable-bin
            pkgver="$VERSION"
            relver=-
          fi
          sha="$(sha256sum "debs/sable-${VERSION}-amd64.deb" | awk '{print $1}')"

          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          # Pinned from https://aur.archlinux.org (SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4).
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur_key -o IdentitiesOnly=yes -o ConnectTimeout=30"

          retry() {
            for attempt in 1 2 3 4; do
              "$@" && return 0
              [ "$attempt" -lt 4 ] && sleep $((attempt * 15))
            done
            return 1
          }

          retry git clone "ssh://aur@aur.archlinux.org/${pkg}.git" aur-repo
          scripts/ci/render-aur.sh "$pkg" "$pkgver" "$relver" "$sha" aur-render
          cp aur-render/PKGBUILD aur-render/.SRCINFO aur-repo/
          rm -f "aur-repo/${pkg}.install"

          cd aur-repo
          git config user.name 'Sable release'
          git config user.email 'release@sable.moe'
          git add -A -- .
          if git diff --cached --quiet; then
            echo 'Nothing changed; skipping the push.'
            exit 0
          fi
          git commit -m "${pkg} ${VERSION}"
          retry git push
  distribute-homebrew:
    name: Publish the Homebrew cask
    needs: [setup-release, electron-macos]
    if: ${{ needs.setup-release.outputs.nightly != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download the DMG
        run: |
          mkdir dmg
          node scripts/ci/forgejo-release.mjs download \
            --pattern "sable-${VERSION}-arm64.dmg" --dir dmg
      - name: Push the cask to the Forgejo tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          sha="$(sha256sum "dmg/sable-${VERSION}-arm64.dmg" | awk '{print $1}')"
          export GIT_TERMINAL_PROMPT=0

          push_tap() (
            local name="$1" token="$2" url="$3"
            token="$(printf '%s' "$token" | tr -d '\r\n')"
            if [ -z "$token" ]; then
              echo "::notice::The ${name} tap token is not set; skipping that tap."
              return 0
            fi
            local auth
            auth="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\r\n')"
            echo "::add-mask::${auth}"
            export GIT_CONFIG_COUNT=2
            export GIT_CONFIG_KEY_0="http.https://${url%%/*}/.extraHeader"
            export GIT_CONFIG_VALUE_0=''
            export GIT_CONFIG_KEY_1="$GIT_CONFIG_KEY_0"
            export GIT_CONFIG_VALUE_1="Authorization: Basic ${auth}"
            rm -rf tap
            git clone --depth 1 "https://${url}" tap
            mkdir -p tap/Casks
            sed \
              -e "s/^  version .*/  version '${VERSION}'/" \
              -e "s/^  sha256 .*/  sha256 '${sha}'/" \
              packaging/homebrew/sable.rb > tap/Casks/sable.rb
            cd tap
            git config user.name 'Sable release'
            git config user.email 'release@sable.moe'
            git add Casks/sable.rb
            if git diff --cached --quiet; then
              echo "Nothing changed on the ${name} tap; skipping the push."
              return 0
            fi
            git commit -m "sable ${VERSION}"
            git push origin HEAD:refs/heads/main
          )

          push_tap Forgejo "${HOMEBREW_TAP_TOKEN:-}" git.sable.moe/SableClient/homebrew-sable.git
  distribute-gentoo:
    name: Publish the Gentoo overlay
    needs: [setup-release, electron-linux]
    if: ${{ needs.setup-release.outputs.nightly != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download the debs
        run: |
          mkdir debs
          node scripts/ci/forgejo-release.mjs download \
            --pattern "sable-${VERSION}-amd64.deb" --dir debs
          node scripts/ci/forgejo-release.mjs download \
            --pattern "sable-${VERSION}-arm64.deb" --dir debs --optional
      - name: Push the ebuild to the overlay
        env:
          GENTOO_OVERLAY_TOKEN: ${{ secrets.GENTOO_OVERLAY_TOKEN }}
        run: |
          if [ -z "$GENTOO_OVERLAY_TOKEN" ]; then
            echo '::notice::GENTOO_OVERLAY_TOKEN is not set; skipping the Gentoo overlay.'
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${GENTOO_OVERLAY_TOKEN}@git.sable.moe/SableClient/gentoo-sable.git" overlay
          scripts/ci/render-gentoo.sh "$VERSION" debs overlay
          cd overlay
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name='Sable release' -c user.email='release@sable.moe' commit -m "net-im/sable-bin: add ${VERSION}"
          git push
  distribute-playstore:
    name: Publish to Google Play
    needs: [setup-release, android]
    if: ${{ needs.setup-release.outputs.nightly != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check out repository
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download the AAB
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          mkdir aab
          node scripts/ci/forgejo-release.mjs download \
            --pattern "sable-${VERSION}-android-universal.aab" --dir aab
      - name: Prepare the release notes
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        id: notes
        run: |
          IFS=. read -r major minor patch <<<"$VERSION"
          code=$(( (major * 1000000 + minor * 1000 + patch) * 10 + 2 ))
          changelog="fastlane/metadata/android/en-US/changelogs/${code}.txt"
          if [ -f "$changelog" ]; then
            mkdir whatsnew
            cp "$changelog" whatsnew/whatsnew-en-US
            echo 'dir=whatsnew' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No changelog at ${changelog}; publishing without release notes."
            echo 'dir=' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to Google Play
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: https://github.com/r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: moe.sable.client
          releaseFiles: aab/sable-${{ needs.setup-release.outputs.version }}-android-universal.aab
          tracks: production
          status: completed
          whatsNewDirectory: ${{ steps.notes.outputs.dir }}
      - name: Report the skipped publish
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON == '' }}
        run: echo '::notice::PLAY_SERVICE_ACCOUNT_JSON is not set; skipping the Google Play publish.'
