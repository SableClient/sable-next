name: Docker image

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Caddyfile'
      - '.dockerignore'
      - '.forgejo/workflows/docker-publish.yml'

permissions: {}

concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}

# Pushes publish the image from tauri-build, which reuses the bundle it already
# builds for the desktop packages. This only proves a Dockerfile change builds.
jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up app and build
        uses: ./.forgejo/actions/setup
        with:
          build: 'true'

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: https://github.com/docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
