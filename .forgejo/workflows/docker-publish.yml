name: Docker image

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Caddyfile'
      - '.dockerignore'
      - '.forgejo/workflows/docker-publish.yml'

permissions: {}

concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}

# Pushes publish the image from tauri-build, which reuses the bundle it already
# builds for the desktop packages. This only proves a Dockerfile change builds.
jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up app and build
        uses: ./.forgejo/actions/setup
        with:
          build: 'true'

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: https://github.com/docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
