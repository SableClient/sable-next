name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Caddyfile'
      - '.dockerignore'
      - '.forgejo/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v1.2.3). Empty publishes HEAD as a dev image.'
        required: false
        type: string

permissions: {}

concurrency:
  group: docker-publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
  REGISTRY: git.sable.moe
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push
    runs-on: multiarch
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pull requests have no release target; they build an untagged image.
      - name: Resolve release meta
        id: release
        if: ${{ github.event_name != 'pull_request' }}
        uses: ./.forgejo/actions/resolve-release-meta
        with:
          input-tag: ${{ inputs.tag }}

      - name: Check out release target
        if: ${{ github.event_name != 'pull_request' }}
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.ref }}
          persist-credentials: false

      - name: Set up app and build
        uses: ./.forgejo/actions/setup
        with:
          build: 'true'
        env:
          # Absent on forks, which builds an app with error reporting switched off.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ steps.release.outputs.nightly == 'true' && 'preview' || 'production' }}
          VITE_APP_VERSION: ${{ steps.release.outputs.version || github.sha }}

      - name: Extract image metadata
        id: meta
        uses: https://github.com/docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=pr
            type=raw,value=dev,enable=${{ steps.release.outputs.nightly == 'true' }}
            type=sha,prefix=,format=short,enable=${{ steps.release.outputs.nightly == 'true' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.nightly == 'false' }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.nightly == 'false' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.nightly == 'false' }}

      - name: Log in to the container registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: https://github.com/docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_TOKEN }}

      - name: Set up QEMU
        uses: https://github.com/docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push image
        id: push
        uses: https://github.com/docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}
