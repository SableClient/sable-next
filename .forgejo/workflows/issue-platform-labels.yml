name: Label issue platforms

on:
  issues:
    types: [opened]

jobs:
  label-platforms:
    runs-on: light
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply platform labels
        run: node scripts/ci/label-issue-platforms.mjs
