name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: quality-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
  CARGO_INCREMENTAL: 0
  SCCACHE_BUCKET: sccache
  SCCACHE_S3_KEY_PREFIX: sable-next
  SCCACHE_ENDPOINT: https://s3.erwanleboucher.dev
  SCCACHE_REGION: us-east-1
  SCCACHE_S3_USE_SSL: 'true'
jobs:
  build:
    name: Build web assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sentry credentials are withheld so this throwaway build does not upload
      # source maps against a release.
      - name: Set up app and build
        uses: ./.forgejo/actions/setup
        with:
          build: 'true'

      - name: Upload web assets
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: web-assets
          path: |
            .svelte-kit/output
            dist
            src/generated/wasm
          if-no-files-found: error
          retention-days: 7

  format:
    name: Format and Stylelint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          build: 'false'
          install-mise-tools: 'false'

      - name: Check Oxfmt formatting
        run: pnpm fmt:check

      - name: Run Stylelint
        if: ${{ !cancelled() }}
        run: pnpm stylelint

  checks:
    name: Lint, typecheck and tests
    # ESLint runs with projectService, so it needs the generated WASM bindings.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download web assets
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: web-assets

      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          build: 'false'
          install-mise-tools: 'false'

      # `--cache-strategy content`, because a fresh checkout remtimes every file.
      - name: Restore ESLint cache
        uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'pnpm-lock.yaml') }}-

      - name: Run ESLint
        run: pnpm lint

      - name: Run svelte-check
        if: ${{ !cancelled() }}
        run: pnpm check

      - name: Run Vitest with coverage thresholds
        if: ${{ !cancelled() }}
        run: pnpm test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Playwright
    needs: build
    # The homeserver fixture needs a daemon; ubuntu-latest has none.
    runs-on: docker
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SABLE_E2E_PREBUILT: '1'
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download web assets
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: web-assets

      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          install-mise-tools: 'false'

      - name: Restore Playwright browsers
        id: browsers
        uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install chromium webkit

      # The shared libraries the browsers link against live outside the cache.
      - name: Install Playwright system libraries
        run: pnpm exec playwright install-deps chromium webkit

      - name: Point testcontainers at the docker host
        run: |
          echo "DOCKER_HOST=${DOCKER_HOST:-<unset>} in-container=$([ -f /.dockerenv ] && echo yes || echo no)"
          if [ -n "${DOCKER_HOST:-}" ] && [ "${DOCKER_HOST#unix://}" = "$DOCKER_HOST" ]; then
            echo 'leaving the host to testcontainers'
          elif [ -f /.dockerenv ]; then
            gateway=$(node -e '
              const lines = require("node:fs").readFileSync("/proc/net/route", "utf8").split("\n").slice(1);
              for (const line of lines) {
                const f = line.trim().split(/\s+/);
                if (f[1] === "00000000") {
                  const hex = f[2];
                  process.stdout.write([6, 4, 2, 0].map((i) => parseInt(hex.slice(i, i + 2), 16)).join("."));
                }
              }
            ')
            echo "gateway=$gateway"
            echo "TESTCONTAINERS_HOST_OVERRIDE=$gateway" >>"$GITHUB_ENV"
          fi

      - name: Run Playwright tests
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm test:e2e

      - name: Run Playwright tests, failing on flake
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm test:e2e --fail-on-flaky-tests

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
