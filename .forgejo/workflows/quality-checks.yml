name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: quality-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
jobs:
  build:
    name: Build web assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sentry credentials are withheld so this throwaway build does not upload
      # source maps against a release.
      - name: Set up app and build
        uses: ./.forgejo/actions/setup
        with:
          build: 'true'

      - name: Upload web assets
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: web-assets
          path: |
            src/generated/wasm
          if-no-files-found: error
          retention-days: 7

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          build: 'false'
          install-mise-tools: 'false'

      - name: Check Oxfmt formatting
        run: pnpm fmt:check

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          build: 'false'
          install-mise-tools: 'false'

      - name: Run Stylelint
        run: pnpm stylelint

  lint:
    name: Lint
    # ESLint runs with projectService, so it needs the generated WASM bindings.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download web assets
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: web-assets
          path: src/generated/wasm

      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          build: 'false'
          install-mise-tools: 'false'

      # `--cache-strategy content`, because a fresh checkout remtimes every file.
      - name: Restore ESLint cache
        uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'pnpm-lock.yaml') }}-

      - name: Run ESLint
        run: pnpm lint

  typecheck:
    name: Typecheck
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download web assets
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: web-assets
          path: src/generated/wasm

      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          build: 'false'
          install-mise-tools: 'false'

      - name: Run svelte-check
        run: pnpm check

  tests:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download web assets
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: web-assets
          path: src/generated/wasm

      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          build: 'false'
          install-mise-tools: 'false'

      - name: Run Vitest with coverage thresholds
        run: pnpm test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 7
