name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: quality-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
  CARGO_INCREMENTAL: 0
  SCCACHE_BUCKET: sccache
  SCCACHE_S3_KEY_PREFIX: sable-next
  SCCACHE_ENDPOINT: https://s3.erwanleboucher.dev
  SCCACHE_REGION: us-east-1
  SCCACHE_S3_USE_SSL: 'true'
jobs:
  build:
    name: Build web assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sentry credentials are withheld so this throwaway build does not upload
      # source maps against a release.
      - name: Set up app and build
        uses: ./.forgejo/actions/setup
        with:
          build: 'true'

      - name: Record web assets revision
        run: git rev-parse HEAD > dist/build-revision.txt

      - name: Upload web assets
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: web-assets
          path: |
            .svelte-kit/output
            dist
            src/generated/wasm
          if-no-files-found: error
          retention-days: 7

  format:
    name: Format and Stylelint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          build: 'false'
          install-mise-tools: 'false'

      - name: Check Oxfmt formatting
        run: pnpm fmt:check

      - name: Run Stylelint
        if: ${{ !cancelled() }}
        run: pnpm stylelint

  checks:
    name: Lint, typecheck and tests
    # ESLint runs with projectService, so it needs the generated WASM bindings.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The settings changes check diffs the release tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Download web assets
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: web-assets

      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          build: 'false'
          install-mise-tools: 'false'

      # `--cache-strategy content`, because a fresh checkout remtimes every file.
      - name: Restore ESLint cache
        uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'pnpm-lock.yaml') }}-

      - name: Run ESLint
        run: pnpm lint

      - name: Run svelte-check
        if: ${{ !cancelled() }}
        run: pnpm check

      - name: Run Vitest with coverage thresholds
        if: ${{ !cancelled() }}
        run: pnpm test:coverage --project node --project happy-dom

      - name: Test scripts
        if: ${{ !cancelled() }}
        run: node --test 'scripts/**/*.test.mjs'

      - name: Check settings changes
        if: ${{ !cancelled() }}
        run: node scripts/generate/settings-changes.mjs --check

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Playwright
    needs: build
    # The homeserver fixture needs a daemon; ubuntu-latest has none.
    runs-on: docker
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SABLE_E2E_PREBUILT: '1'
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download web assets
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: web-assets

      - name: Set up app
        uses: ./.forgejo/actions/setup
        with:
          install-mise-tools: 'false'

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: browsers
        uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: |
          for attempt in 1 2 3; do
            pnpm exec playwright install chromium webkit && exit 0
            echo "playwright install attempt $attempt failed"
            sleep 15
          done
          exit 1

      # The shared libraries the browsers link against live outside the cache.
      - name: Install Playwright system libraries
        run: pnpm exec playwright install-deps chromium webkit

      - name: Point testcontainers at the docker host
        run: |
          echo "DOCKER_HOST=${DOCKER_HOST:-<unset>} in-container=$([ -f /.dockerenv ] && echo yes || echo no)"
          if [ -n "${DOCKER_HOST:-}" ] && [ "${DOCKER_HOST#unix://}" = "$DOCKER_HOST" ]; then
            echo 'leaving the host to testcontainers'
          elif [ -f /.dockerenv ]; then
            gateway=$(node -e '
              const lines = require("node:fs").readFileSync("/proc/net/route", "utf8").split("\n").slice(1);
              for (const line of lines) {
                const f = line.trim().split(/\s+/);
                if (f[1] === "00000000") {
                  const hex = f[2];
                  process.stdout.write([6, 4, 2, 0].map((i) => parseInt(hex.slice(i, i + 2), 16)).join("."));
                }
              }
            ')
            echo "gateway=$gateway"
            echo "TESTCONTAINERS_HOST_OVERRIDE=$gateway" >>"$GITHUB_ENV"
          fi

      - name: Run browser component tests
        run: pnpm exec vitest run --project browser --project browser-touch

      - name: Run Playwright tests
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm test:e2e

      - name: Run Playwright tests, failing on flake
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm test:e2e --fail-on-flaky-tests

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  preview:
    name: Deploy preview
    needs: build
    # Forks cannot read the Cloudflare credentials wrangler needs.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      RUSTC_WRAPPER: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up app and build
        uses: ./.forgejo/actions/setup
        with:
          build: 'true'
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: preview
          VITE_APP_VERSION: ${{ github.event.pull_request.head.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Prepare preview metadata
        id: metadata
        run: |
          preview_message="$(git log -1 --pretty=%s | head -c 100)"

          {
            echo 'preview_message<<EOF'
            echo "$preview_message"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set deploy alias
        id: alias
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "alias=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload Worker preview
        id: deploy
        uses: https://github.com/cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          PREVIEW_MESSAGE: ${{ steps.metadata.outputs.preview_message }}
        with:
          apiToken: ${{ secrets.TF_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.TF_VAR_ACCOUNT_ID }}
          command: >
            versions upload
            --config infra/web/wrangler.jsonc
            --preview-alias ${{ steps.alias.outputs.alias }}
            --message "$PREVIEW_MESSAGE"

      - name: Resolve preview URL
        id: preview
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          COMMAND_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          ALIAS: ${{ steps.alias.outputs.alias }}
        run: |
          alias_url_pattern="^https?://${ALIAS}-[^[:space:]]+$"
          preview_url=""

          if printf '%s\n' "$DEPLOYMENT_URL" | grep -Eq "$alias_url_pattern"; then
            preview_url="$DEPLOYMENT_URL"
          else
            preview_url="$(printf '%s\n' "$COMMAND_OUTPUT" | grep -Eo "https?://${ALIAS}-[^[:space:]]*" | head -n 1 || true)"
          fi

          if ! printf '%s\n' "$preview_url" | grep -Eq "$alias_url_pattern"; then
            echo 'Failed to resolve aliased Worker preview URL.' >&2
            exit 1
          fi

          echo "preview_url=${preview_url}" >> "$GITHUB_OUTPUT"

      - name: Publish summary and PR comment
        env:
          MARKER: '<!-- cloudflare-worker-preview -->'
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          PREVIEW_ALIAS: ${{ steps.alias.outputs.alias }}
          SHORT_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          now="$(date -u +'%a, %d %b %Y %H:%M UTC')"
          row="| Deployment successful! | <a href=\"${PREVIEW_URL}\">${PREVIEW_URL}</a> | ${SHORT_SHA:0:7} | \`${PREVIEW_ALIAS}\` | ${now} |"
          body="$(printf '%s\n' \
            "$MARKER" \
            '## Deploying with &nbsp;<a href="https://workers.dev"><img alt="Cloudflare" src="https://workers.cloudflare.com/logo.svg" width="16"></a> &nbsp;Cloudflare Workers' \
            '' \
            '| Status | Preview URL | Commit | Alias | Updated (UTC) |' \
            '| - | - | - | - | - |' \
            "$row")"

          printf '%s\n' "$body" | tail -n +2 >> "$GITHUB_STEP_SUMMARY"

          api() { curl -sSf -H "Authorization: token ${TOKEN}" -H 'Content-Type: application/json' "$@"; }

          existing="$(
            api "${API_URL}/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?limit=100" \
              | jq -r --arg marker "$MARKER" \
                  'map(select(.body | contains($marker))) | last | .id // empty'
          )"
          if [ -n "$existing" ]; then
            api -X DELETE "${API_URL}/repos/${REPOSITORY}/issues/comments/${existing}" -o /dev/null
          fi

          jq -n --arg body "$body" '{body: $body}' \
            | api -X POST "${API_URL}/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" -d @- -o /dev/null
