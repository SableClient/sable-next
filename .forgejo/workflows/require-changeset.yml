name: Require changeset

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

concurrency:
  group: require-changeset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  require-changeset:
    name: Check for a changeset
    if: ${{ github.head_ref != 'release' && !contains(github.event.pull_request.labels.*.name, 'internal') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for a changeset added by this PR
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          count=$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" \
            | grep -cE '^\.changeset/.+\.md$' || true)
          if [ "$count" -eq 0 ]; then
            {
              echo 'This pull request adds no changeset.'
              echo 'Run `pnpm run document-change` and commit the file, or create .changeset/<name>.md:'
              printf -- '---\ndefault: patch\n---\n\nShort user-facing summary of the change.\n'
              echo 'Use major, minor, patch, docs or note. A maintainer can add the "internal" label to skip this check.'
            } >&2
            exit 1
          fi
          echo "Found $count new changeset file(s)."
