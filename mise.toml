min_version = '2026.7.11'

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
NODE_OPTIONS = "--max-old-space-size=4192"
# Here rather than in mise.tauri.toml: the setup task's own MISE_ENV reaches the
# commands it spawns, not the template that renders them.
ANDROID_NDK_VERSION = "29.0.14206865"

[settings]
idiomatic_version_file_enable_tools = ["pnpm", "node", "rust"]
minimum_release_age = "1d"
experimental = true

[task_config]
includes = ["scripts"]

[tools]
"cargo:wasm-bindgen-cli" = "0.2.127"
"aqua:WebAssembly/binaryen" = "132"
"aqua:watchexec/watchexec" = "2.5.1"
"aqua:evilmartians/lefthook" = "2.1.10"

[tasks.setup]
description = "Install mise tools, pnpm dependencies, and git hooks"
run = ["mise install", "pnpm install"]
sources = ['package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'mise.toml']
outputs = ['node_modules/.pnpm/lock.yaml']

[tasks.dev]
description = "Build development WASM and start SvelteKit (port 3000 for Tauri)"
alias = "d"
run = "pnpm dev"
raw = true

[tasks.build]
description = "Build release WASM and frontend with Vite"
alias = "b"
run = "pnpm build"

[tasks.preview]
description = "Preview the production build"
alias = "p"
run = "vite preview"

[tasks.format]
description = "Format frontend and project config with Oxfmt"
alias = "fmt"
run = "pnpm fmt"

[tasks.check]
description = "Run formatter, frontend, Rust, and dependency checks"
alias = "c"
run = [
  "pnpm fmt:check",
  "pnpm lint",
  "pnpm stylelint",
  "pnpm check",
  "cargo fmt --all -- --check",
  # --all-features would turn on both desktop runtimes and download CEF.
  "cargo clippy --locked --workspace --exclude app --all-targets --all-features -- -D warnings",
  "cargo clippy --locked -p app --all-targets -- -D warnings",
  "cargo clippy --locked -p sable-wasm --target wasm32-unknown-unknown --all-targets --all-features -- -D warnings",
  "cargo deny check",
]

[tasks.test]
description = "Run all frontend and Rust tests"
alias = "t"
run = [
  "pnpm test",
  "cargo test --locked --workspace --exclude app --all-features",
  "cargo test --locked -p app",
  # Needs chromedriver on PATH.
  "cargo test --locked -p sable-wasm --target wasm32-unknown-unknown --profile wasm-dev",
]
raw = true

[tasks.doc]
description = "Build Rust documentation with warnings denied"
env = { RUSTDOCFLAGS = "-D warnings" }
run = [
  "cargo doc --locked --workspace --exclude app --all-features --no-deps",
  "cargo doc --locked -p app --no-deps",
]

[tasks.ci]
description = "Full local CI: strict checks, tests, and documentation"
run = [{ task = "check" }, { task = "test" }, { task = "doc" }]

[tasks.fix]
description = "Apply safe frontend fixes and Rust formatting"
alias = "f"
run = ["pnpm lint:fix", "pnpm stylelint:fix", "cargo fmt --all"]

[tasks."generate:types"]
description = "Regenerate TypeScript bindings from Rust (ts-rs)"
run = "cargo test -p sable-core export_bindings -- --nocapture"

[tasks."wasm:build"]
description = "Build the WASM core for the web client"
alias = ["wasm", "wb"]
run = "pnpm wasm:build"

[tasks."wasm:watch"]
description = "Rebuild development WASM when Rust sources change"
alias = "ww"
run = "pnpm wasm:watch"
raw = true

[tasks."tauri:icons"]
description = "Generate native app icons from the canonical Sable SVG"
run = "pnpm tauri icon src/lib/assets/res/svg/logo.svg --output src-tauri/icons"

[tasks."tauri:setup"]
description = "Install Tauri tools and system packages"
run = ["mise install", "mise bootstrap packages apply --yes --update"]
env = { MISE_ENV = "tauri" }

[tasks."tauri:setup:android"]
description = "Install Android SDK packages + NDK (no Android Studio needed)"
depends = ["tauri:setup"]
env = { MISE_ENV = "tauri" }
# Through `mise exec`, which is what puts the tauri env's sdkmanager on PATH.
run = [
  "yes | mise exec -- sdkmanager --licenses",
  'mise exec -- sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;{{env.ANDROID_NDK_VERSION}}"',
]

[tasks."tauri:setup:macos"]
description = "Install Xcode"
confirm = { message = "Install Xcode? (required for Tauri)", default = "no" }
run = "xcode-select --print-path >/dev/null 2>&1 || xcode-select --install"

[tasks."tauri:setup:ios"]
description = "Set up iOS Xcode project"
depends = ["tauri:setup:macos"]
confirm = { message = "Set up iOS Xcode project? (required for Tauri)", default = "no" }
run = ["command -v pod >/dev/null 2>&1 || brew install cocoapods", "pnpm tauri ios init"]

[tasks."tauri:setup:windows"]
description = "Install Visual Studio Build Tools + WebView2 runtime"
confirm = { message = "Install Visual Studio Build Tools and WebView2 runtime? (required for Tauri)", default = "no" }
run = [
  "winget install --id Microsoft.VisualStudio.BuildTools --source winget --force --override \"--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --add Microsoft.VisualStudio.Component.Windows11SDK.26100 --addProductLang En-us\"",
  "winget install --id Microsoft.EdgeWebView2Runtime --source winget",
]

[tasks.opentofu]
description = "Run OpenTofu for the Cloudflare deployment"
run = "tofu"
dir = "infra/web"
raw_args = true
hide = true
tools = { "opentofu" = "1.11.5" }
