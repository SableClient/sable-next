[package]
name = "app"
version = "2.3.0"
description = "A Tauri App"
authors = ["you"]
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository = ""
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
tauri-codegen = "2.7.0"

[dev-dependencies]
quote = "1"
tempfile = { workspace = true }
tauri-codegen = "2.7.0"

[dependencies]
base64 = "0.23"
percent-encoding = "2.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_with = { workspace = true, features = ["base64"] }
http-cache-semantics = { version = "3.0", features = ["reqwest"] }
log = "0.4"
regex-lite = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2.11.3", default-features = false, features = [
  "compression",
  "dynamic-acl",
  "wry",
] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-os = "2.3.2"
# WKWebView rejects `navigator.clipboard.writeText` outside a touch or click
# handler, which a long press never is.
tauri-plugin-clipboard-manager = "2.4.1"
# Push stays off here: the feature pulls in Firebase and APNs, which only the
# mobile targets below enable.
# The published crate hands back a bare token; the fork takes a VAPID key and
# returns the keys a UnifiedPush distributor produces.
tauri-plugin-notifications = { version = "0.5.0", git = "https://github.com/SableClient/tauri-plugin-notifications.git", rev = "8097a87cb78cc4bf47c819ed59be4080db319a97", default-features = false }
sable-core = { path = "../crates/sable-core", version = "0.1.0" }
tokio = { workspace = true }
# default-features drags in reqwest and native-tls; ureq is a sync rustls
# transport with no async runtime of its own.
sentry = { version = "0.49", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "debug-images",
  "logs",
  "tracing",
  "ureq",
  "rustls",
] }
tauri-plugin-sentry = "0.8.0"

# The plugin only compiles on a host build, which lints and tests the crate,
# with a desktop backend.
[target."cfg(any(target_os = \"linux\", target_os = \"macos\"))".dependencies]
tauri-plugin-notifications = { version = "0.5.0", git = "https://github.com/SableClient/tauri-plugin-notifications.git", rev = "8097a87cb78cc4bf47c819ed59be4080db319a97", default-features = false, features = [
  "notify-rust",
] }

# The system bar icon contrast is only reachable through the Activity's window.
[target."cfg(target_os = \"android\")".dependencies]
jni = "0.22"
tauri-plugin-android-fs = "=30.2.0"
tauri-plugin-sable-push = { path = "../plugins/tauri-plugin-sable-push", version = "0.1.0" }

# Push drags in Firebase and APNs, which only these two builds should carry.
[target."cfg(any(target_os = \"android\", target_os = \"ios\"))".dependencies]
tauri-plugin-app-icon = { version = "0.1.0", git = "https://github.com/SableClient/tauri-plugin-app-icon", rev = "bb3b31dfe356425f36b4ff21cb4315fa5d3e535e" }
tauri-plugin-geolocation = { version = "2.3.3", optional = true }
tauri-plugin-notifications = { version = "0.5.0", git = "https://github.com/SableClient/tauri-plugin-notifications.git", rev = "8097a87cb78cc4bf47c819ed59be4080db319a97", default-features = false, features = [
  "push-notifications",
] }
tauri-plugin-livekit-mobile = { version = "0.2.0", git = "https://github.com/SableClient/tauri-plugin-livekit-mobile.git", rev = "13fbdc08bebe035065a05cd7a99041422cf38960" }
# Injects the --safe-area-inset-* custom properties: Android reports the system
# bars to nobody, and `env()` there only covers a display cutout.
tauri-plugin-edge-to-edge = { version = "0.3.3", git = "https://github.com/SableClient/tauri-plugin-edge-to-edge.git", rev = "33c6116c27be28c06df5a9d02231ecc5fdeb93c5" }
# `navigator.share` reaches no webview we ship, so the system share sheet only
# comes from the native side.
tauri-plugin-sharekit = { version = "=0.4.0-rc.7", git = "https://github.com/Choochmeque/tauri-plugin-sharekit", rev = "455a166070626bae1da4cf3c471d4d3a40d33d6d" }

[target."cfg(target_os = \"ios\")".dependencies]
# backtrace 0.3.76 needs dyld bindings that libc 0.2.190 removed on iOS.
libc = "=0.2.191"
tauri-plugin-auth-session = { version = "0.2.2", git = "https://github.com/yanqianglu/tauri-plugin-auth-session", rev = "b335cfff0662d04e468df8e32869c047e6400135" }
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSError",
  "NSString",
  "NSURL",
  "NSFileManager",
  "NSBundle",
] }
objc2-photos = { version = "0.3.2", default-features = false, features = [
  "std",
  "PHPhotoLibrary",
  "PHAssetChangeRequest",
  "PHAssetCreationRequest",
  "PHChangeRequest",
  "PhotosTypes",
  "block2",
  "dispatch2",
] }

[features]
default = ["geolocation"]
geolocation = ["dep:tauri-plugin-geolocation"]

[lints]
workspace = true
