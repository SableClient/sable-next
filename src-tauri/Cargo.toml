[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = "AGPL-3.0-only"
repository = ""
edition = "2021"
rust-version = "1.97.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
# Push stays off here: the feature pulls in Firebase and APNs, which belong to
# the mobile builds, not the desktop one.
tauri-plugin-notifications = { version = "0.4", default-features = false }
sable-core = { path = "../crates/sable-core", version = "0.1.0" }
tokio = { workspace = true }
# default-features drags in reqwest and native-tls; ureq is a sync rustls
# transport with no async runtime of its own.
sentry = { version = "0.49", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "debug-images",
  "ureq",
] }

# Desktop only: a second launch carrying the OIDC redirect must hand the URL to
# the running instance instead of starting a rival process.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-notifications = { version = "0.4", default-features = false, features = [
  "notify-rust",
] }

# Push drags in Firebase and APNs, which only these two builds should carry.
[target."cfg(any(target_os = \"android\", target_os = \"ios\"))".dependencies]
tauri-plugin-notifications = { version = "0.4", default-features = false, features = [
  "push-notifications",
] }

[lints]
workspace = true
