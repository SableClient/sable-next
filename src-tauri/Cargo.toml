[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = "AGPL-3.0-only"
repository = ""
edition = "2021"
rust-version = "1.97.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
# Push stays off here: the feature pulls in Firebase and APNs, which belong to
# the mobile builds, not the desktop one.
# The published crate hands back a bare token; the fork takes a VAPID key and
# returns the keys a UnifiedPush distributor produces.
tauri-plugin-notifications = { version = "0.5.0-rc.11", git = "https://github.com/eleboucher/tauri-plugin-notifications.git", rev = "a98f23f2b11fe082b1a2bdd87b527133e775acbd", default-features = false }
sable-core = { path = "../crates/sable-core", version = "0.1.0" }
tokio = { workspace = true }
# default-features drags in reqwest and native-tls; ureq is a sync rustls
# transport with no async runtime of its own.
sentry = { version = "0.49", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "debug-images",
  "ureq",
] }

# Desktop only: a second launch carrying the OIDC redirect must hand the URL to
# the running instance instead of starting a rival process.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-notifications = { version = "0.5.0-rc.11", git = "https://github.com/eleboucher/tauri-plugin-notifications.git", rev = "a98f23f2b11fe082b1a2bdd87b527133e775acbd", default-features = false, features = [
  "notify-rust",
] }

# The system bar icon contrast is only reachable through the Activity's window.
[target."cfg(target_os = \"android\")".dependencies]
jni = "0.22"
tauri-plugin-android-fs = "=29.0.0"

# Push drags in Firebase and APNs, which only these two builds should carry.
[target."cfg(any(target_os = \"android\", target_os = \"ios\"))".dependencies]
tauri-plugin-notifications = { version = "0.5.0-rc.11", git = "https://github.com/eleboucher/tauri-plugin-notifications.git", rev = "a98f23f2b11fe082b1a2bdd87b527133e775acbd", default-features = false, features = [
  "push-notifications",
] }
# Injects the --safe-area-inset-* custom properties: Android reports the system
# bars to nobody, and `env()` there only covers a display cutout.
tauri-plugin-edge-to-edge = { version = "0.3.3", git = "https://github.com/SableClient/tauri-plugin-edge-to-edge.git", rev = "33c6116c27be28c06df5a9d02231ecc5fdeb93c5" }

[target."cfg(target_os = \"ios\")".dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString", "NSURL"] }
objc2-photos = { version = "0.3.2", default-features = false, features = ["std", "PHPhotoLibrary", "PHAssetCreationRequest", "PhotosTypes", "block2", "dispatch2"] }

[lints]
workspace = true
