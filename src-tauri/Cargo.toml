[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository = ""
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.23"
percent-encoding = "2.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
regex-lite = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2.11.3", default-features = false, features = [
  "common-controls-v6",
  "compression",
  "dbus",
  "devtools",
  "dynamic-acl",
  "macos-proxy",
  "tray-icon",
  "x11",
] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-os = "2.3.2"
# Push stays off here: the feature pulls in Firebase and APNs, which belong to
# the mobile builds, not the desktop one.
# The published crate hands back a bare token; the fork takes a VAPID key and
# returns the keys a UnifiedPush distributor produces.
tauri-plugin-notifications = { version = "0.5.0", git = "https://github.com/SableClient/tauri-plugin-notifications.git", rev = "f230395e47f326cc09bcf644f7952d57cab518f7", default-features = false }
sable-core = { path = "../crates/sable-core", version = "0.1.0" }
tokio = { workspace = true }
# default-features drags in reqwest and native-tls; ureq is a sync rustls
# transport with no async runtime of its own.
sentry = { version = "0.49", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "debug-images",
  "logs",
  "tracing",
  "ureq",
] }
tauri-plugin-sentry = "0.6.0"

# Desktop only: a second launch carrying the OIDC redirect must hand the URL to
# the running instance instead of starting a rival process.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notifications = { version = "0.5.0", git = "https://github.com/SableClient/tauri-plugin-notifications.git", rev = "f230395e47f326cc09bcf644f7952d57cab518f7", default-features = false, features = [
  "notify-rust",
] }

# The system bar icon contrast is only reachable through the Activity's window.
[target."cfg(target_os = \"android\")".dependencies]
jni = "0.22"
tauri-plugin-android-fs = "=29.0.0"

# Push drags in Firebase and APNs, which only these two builds should carry.
[target."cfg(any(target_os = \"android\", target_os = \"ios\"))".dependencies]
tauri-plugin-app-icon = { version = "0.1.0", git = "https://github.com/SableClient/tauri-plugin-app-icon", rev = "bab80ae17f6d018702e472c539d0f02eba480c21" }
tauri-plugin-geolocation = "2.3.3"
tauri-plugin-notifications = { version = "0.5.0", git = "https://github.com/SableClient/tauri-plugin-notifications.git", rev = "f230395e47f326cc09bcf644f7952d57cab518f7", default-features = false, features = [
  "push-notifications",
] }
tauri-plugin-livekit-mobile = { version = "0.2.0", git = "https://github.com/SableClient/tauri-plugin-livekit-mobile.git", rev = "b18b6822fc48d44a0e316d737584d06a49027a90" }
# Injects the --safe-area-inset-* custom properties: Android reports the system
# bars to nobody, and `env()` there only covers a display cutout.
tauri-plugin-edge-to-edge = { version = "0.3.3", git = "https://github.com/SableClient/tauri-plugin-edge-to-edge.git", rev = "33c6116c27be28c06df5a9d02231ecc5fdeb93c5" }

# `navigator.share` reaches no webview we ship, so the system share sheet only
# comes from the native side. The plugin covers every platform but Linux.
[target."cfg(any(target_os = \"android\", target_os = \"ios\", target_os = \"macos\", target_os = \"windows\"))".dependencies]
tauri-plugin-sharekit = "=0.4.0-rc.7"

# `cef` is named here too so its build script unpacks the runtime into this
# target directory, where scripts/cef/copy-libs.sh looks for it.
[target."cfg(target_os = \"windows\")".dependencies]
enigo = { version = "0.6.1", default-features = false }
sable-hdr = { path = "../crates/sable-hdr", version = "0.1.0", features = ["tauri"] }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(target_os = \"linux\")".dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_34"], optional = true }
tauri-runtime-cef = { version = "0.1.0", git = "https://github.com/SableClient/tauri-runtime-cef", rev = "6568170ae5fb27b38dae1e367f0bb3a09a040152", optional = true }
# The CEF runtime currently uses the beta.2 drag event API. Keep Cargo from
# selecting beta.3, which removed its paths and DragMoved payloads.
winit = { version = "=0.31.0-beta.2", optional = true }
cef = { version = "=150.2.1", optional = true }
sha2 = { version = "0.11", optional = true }
# Auto-download stays off: fetching a codec build would make Sable the one
# distributing an H.264 decoder.
ffmpeg-sidecar = { version = "2.5", optional = true }
# Keeps the Rust heap out of glibc's mallinfo(), which CEF's MemoryInfra thread
# CHECKs into a SIGILL past 2 GiB. See .claude/rules/native.md.
tikv-jemallocator = { version = "0.7.0", optional = true }
libloading = "0.9"
# Ubuntu 22.04's PipeWire headers predate pipewire-rs 0.10's generated bindings.
# Keep the capture client on the compatible 0.9 series used by the release runner.
pipewire = "0.9.2"
sable-hdr = { path = "../crates/sable-hdr", version = "0.1.0" }
zbus = "5"

[target."cfg(target_os = \"ios\")".dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSError",
  "NSString",
  "NSURL",
  "NSFileManager",
  "NSBundle",
] }
objc2-photos = { version = "0.3.2", default-features = false, features = [
  "std",
  "PHPhotoLibrary",
  "PHAssetChangeRequest",
  "PHAssetCreationRequest",
  "PHChangeRequest",
  "PhotosTypes",
  "block2",
  "dispatch2",
] }

# Exactly one must be on. The Linux release build passes
# `--no-default-features --features cef`; everything else takes the default.
[features]
default = ["wry"]
wry = ["tauri/wry", "dep:webkit2gtk"]
cef = [
  "dep:tauri-runtime-cef",
  "dep:winit",
  "dep:cef",
  "dep:sha2",
  "dep:ffmpeg-sidecar",
  "dep:tikv-jemallocator",
  "tauri-runtime-cef/devtools",
]

[lints]
workspace = true
