[package]
name = "sable-wasm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sable-core = { path = "../sable-core", version = "0.1.0" }
serde_json = { workspace = true }
futures-util = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing.workspace = true
tracing-web = "0.1.3"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "fmt",
  "registry",
  "env-filter",
] }

# rustc emits bulk-memory ops that the wasm-opt wasm-pack ships does not enable
# by default, so it rejects its own input without these flags.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']

[lints]
workspace = true
