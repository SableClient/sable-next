[package]
name = "sable-loopback"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
audiofox = ["dep:audiofox", "dep:pipewire"]

[dependencies]
log = "0.4"
audiofox = { version = "=1.1.0", optional = true }
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", optional = true }

[target.'cfg(windows)'.dependencies]
wasapi = "0.26.0"

[lints]
workspace = true
