[package]
name = "sable-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
antissrf = { version = "0.1.1", default-features = false }
argon2 = "0.6.0"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["ws"] }
axum-client-ip = "1.3.1"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
figment = { version = "0.10.19", features = ["env", "toml"] }
futures-util.workspace = true
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
openidconnect = "4.0.1"
rpassword = "7.5.4"
sable-core = { path = "../sable-core", version = "0.1.0" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
time.workspace = true
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "signal", "time"] }
tokio-util = { workspace = true }
tower = { version = "0.5.3", features = ["limit"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tower-http = { version = "0.7.1", features = ["fs", "limit", "set-header", "timeout"] }
tower-sessions = "0.15.0"
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
url.workspace = true
uuid = { version = "1.29.0", features = ["v4"] }
yawc = { version = "0.5.0", default-features = false, features = ["axum"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio-tungstenite = "0.30.0"

[lints]
workspace = true
