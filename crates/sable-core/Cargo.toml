[package]
name = "sable-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[features]
unoptimized-build = []

[dependencies]
matrix-sdk = { workspace = true }
matrix-sdk-ui = { workspace = true }
matrix-sdk-base = { workspace = true }
mime = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }
url = { workspace = true }
ammonia = "4"
async-trait = "0.1"
probly-search = "2.0"
charabia = { version = "0.10", default-features = false, features = [
  "greek",
  "hebrew",
  "vietnamese",
  "turkish",
  "swedish-recomposition",
  "chinese-normalization",
] }
rust-stemmers = "1.2"
html-escape = "0.2"
linkify = "0.11"
base64 = "0.23"
getrandom = "0.4"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
matrix-sdk = { workspace = true, features = ["bundled-sqlite", "automatic-room-key-forwarding"] }
tokio = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
matrix-sdk = { workspace = true, features = ["indexeddb", "js"] }
matrix-sdk-ui = { workspace = true, features = ["js"] }
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
matrix-sdk = { workspace = true, features = ["testing"] }
matrix-sdk-test = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "cf9ae6a921472c8bd945727c3b84f7cc8b1ce72a" }
matrix-sdk-test-utils = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "cf9ae6a921472c8bd945727c3b84f7cc8b1ce72a" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"

[lints]
workspace = true
