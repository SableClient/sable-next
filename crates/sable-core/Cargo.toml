[package]
name = "sable-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
matrix-sdk = { workspace = true }
matrix-sdk-ui = { workspace = true }
matrix-sdk-base = { workspace = true }
mime = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }
url = { workspace = true }
ammonia = "4"
async-trait = "0.1"
probly-search = "2.0"
charabia = { version = "0.10", default-features = false, features = [
  "greek",
  "hebrew",
  "thai",
  "khmer",
  "vietnamese",
  "turkish",
  "swedish-recomposition",
  "german-segmentation",
  "chinese-normalization",
] }
rust-stemmers = "1.2"
html-escape = "0.2"
linkify = "0.11"
base64 = "0.22"
getrandom = "0.4"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
matrix-sdk = { workspace = true, features = ["bundled-sqlite", "automatic-room-key-forwarding"] }
tokio = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
matrix-sdk = { workspace = true, features = ["indexeddb", "js"] }
matrix-sdk-ui = { workspace = true, features = ["js"] }
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
matrix-sdk = { workspace = true, features = ["testing"] }
matrix-sdk-test = "0.18"
matrix-sdk-test-utils = "0.18"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"

[lints]
workspace = true
