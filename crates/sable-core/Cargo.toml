[package]
name = "sable-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[features]
unoptimized-build = []
typegen = ["dep:specta", "dep:specta-serde", "dep:specta-typescript"]

[[example]]
name = "generate-types"
required-features = ["typegen"]

[dependencies]
matrix-sdk = { workspace = true, features = ["qrcode"] }
qrcode = { version = "0.14.1", default-features = false }
matrix-sdk-ui = { workspace = true }
matrix-sdk-base = { workspace = true }
ruma.workspace = true
mime = "0.3"
http = "1.5"
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
specta = { workspace = true, optional = true }
specta-serde = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }
url = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
ammonia = "4"
async-trait = "0.1"
probly-search = "2.0"
charabia = { version = "0.10", default-features = false, features = [
  "greek",
  "hebrew",
  "vietnamese",
  "turkish",
  "swedish-recomposition",
  "chinese-normalization",
] }
rust-stemmers = "1.2"
html-escape = "0.2"
linkify = "0.11"
regex-lite = "0.1"
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
time = "0.3"
base64 = "0.23"
sha2 = "0.11"
getrandom = "0.4"
aes = { version = "0.9.3", default-features = false }
ctr = { version = "0.10.1", default-features = false }
hkdf = "0.13"
hmac = "0.13"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["socks"] }
matrix-sdk-common.workspace = true
matrix-sdk = { workspace = true, features = ["bundled-sqlite", "automatic-room-key-forwarding"] }
tempfile = "3"
rusqlite = { version = "0.40.2", default-features = false, features = ["backup"] }
tokio = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
matrix-sdk = { workspace = true, features = ["indexeddb", "js", "automatic-room-key-forwarding"] }
matrix-sdk-indexeddb = { version = "0.19.1", git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "bc2502ee3d3ba1dc687740df5be0f8635032399e", default-features = false, features = [
  "e2e-encryption",
  "state-store",
  "event-cache-store",
  "media-store",
] }
matrix-sdk-ui = { workspace = true, features = ["js"] }
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "IdbDatabase",
  "IdbFactory",
  "IdbObjectStore",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "DomException",
  "DomStringList",
] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
matrix-sdk = { workspace = true, features = ["testing"] }
matrix-sdk-test = { version = "0.19.1", git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
matrix-sdk-test-utils = { version = "0.19.1", git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
bs58 = "0.5"

[lints]
workspace = true
