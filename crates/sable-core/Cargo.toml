[package]
name = "sable-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["client"]
client = []
server = []
unoptimized-build = []
typegen = ["dep:specta", "dep:specta-serde", "dep:specta-typescript", "sable-model/typegen"]

[[example]]
name = "generate-types"
required-features = ["typegen"]

[dependencies]
sable-model = { path = "../sable-model", version = "0.1.0" }
matrix-sdk = { workspace = true, features = ["qrcode", "unstable-msc4388"] }
qrcode = { version = "0.14.1", default-features = false }
matrix-sdk-ui = { workspace = true }
matrix-sdk-base = { workspace = true }
matrix-sdk-common = { workspace = true }
ruma.workspace = true
mime = "0.3"
hashlink = "0.12"
backon = { version = "1.6", default-features = false }
pastey = "0.2.3"
http = "1.5"
web-time = "1"
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
specta = { workspace = true, optional = true }
specta-serde = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }
url = { workspace = true }
percent-encoding = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
ammonia = "4.2.3"
async-trait = "0.1"
probly-search = "2.0"
charabia = { version = "0.10", default-features = false, features = [
  "greek",
  "hebrew",
  "vietnamese",
  "turkish",
  "swedish-recomposition",
  "chinese-normalization",
] }
jieba-rs = { version = "=0.11.0", default-features = false }
rust-stemmers = "1.2"
html-escape = { workspace = true }
html5ever = { workspace = true }
linkify = { workspace = true }
regex-lite = { workspace = true }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
base64 = "0.23"
sha2 = "0.11"
getrandom = "0.4"
aes = { version = "0.9.3", default-features = false }
ctr = { version = "0.10.1", default-features = false }
hkdf = "0.13"
hmac = "0.13"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["socks", "gzip"] }
matrix-sdk = { workspace = true, features = ["bundled-sqlite", "automatic-room-key-forwarding"] }
tempfile = { workspace = true }
rusqlite = { version = "0.40.2", default-features = false, features = ["backup"] }
tokio = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring-core = "1.0.1"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain", "protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring-core = "1.0.1"
windows-native-keyring-store = "1.1.0"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
keyring-core = "1.0.1"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
matrix_indexed_db_futures = { version = "0.7", features = ["typed-arrays", "version-change"] }
matrix-sdk = { workspace = true, features = ["indexeddb", "js", "automatic-room-key-forwarding"] }
matrix-sdk-indexeddb = { workspace = true, features = [
  "e2e-encryption",
  "state-store",
  "event-cache-store",
  "media-store",
] }
matrix-sdk-ui = { workspace = true, features = ["js"] }
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { version = "0.3", features = [
  "IdbDatabase",
  "IdbFactory",
  "IdbObjectStore",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "DomException",
  "DomStringList",
  "Request",
  "RequestInit",
  "RequestMode",
] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
matrix-sdk = { workspace = true, features = ["testing"] }
matrix-sdk-test = { workspace = true }
matrix-sdk-test-utils = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
bs58 = "0.5"
jieba-rs = { version = "=0.11.0", features = ["default-dict"], default-features = false }

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true
