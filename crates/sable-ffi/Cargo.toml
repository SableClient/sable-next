[package]
name = "sable-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sable-protocol = { path = "../sable-protocol", version = "0.1.0" }
sable-runtime = { path = "../sable-runtime", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt"] }

[dev-dependencies]
futures-executor = "0.3"
sable-runtime = { path = "../sable-runtime", version = "0.1.0", features = ["testing"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
