[package]
name = "sable-hdr"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[features]
tauri = ["dep:tauri", "dep:serde"]

[dependencies]
half = "2.7.1"
log = "0.4"
linear-srgb = { version = "0.6.12", features = ["transfer"] }
zentone = "0.1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
] }
windows-capture = "2.0.1"
webview2-com = "0.38.2"
windows-core-061 = { package = "windows-core", version = "0.61.2" }
tauri = { version = "2.11.3", default-features = false, features = ["wry"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.9.2"

[lints]
workspace = true
