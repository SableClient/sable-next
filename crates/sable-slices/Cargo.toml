[package]
name = "sable-slices"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
typegen = [
  "dep:specta",
  "dep:specta-typescript",
  "sable-model/typegen",
  "sable-protocol/typegen",
  "sable-runtime/typegen",
]

[dependencies]
sable-model = { path = "../sable-model", version = "0.1.0" }
sable-protocol = { path = "../sable-protocol", version = "0.1.0" }
sable-runtime = { path = "../sable-runtime", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }
tracing = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
proptest = "1.12"
ruma = { workspace = true }
sable-runtime = { path = "../sable-runtime", version = "0.1.0", features = ["testing"] }
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }

[lints]
workspace = true
