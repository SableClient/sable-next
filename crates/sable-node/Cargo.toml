[package]
name = "sable-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
demo = ["sable-ffi/demo"]

[dependencies]
sable-core = { path = "../sable-core", version = "0.1.0" }
sable-ffi = { path = "../sable-ffi", version = "0.1.0" }
sable-runtime = { path = "../sable-runtime", version = "0.1.0" }
async-trait = "0.1"
napi = { version = "3.14.2", default-features = false, features = ["napi4", "tokio_rt"] }
napi-derive = "3.6.12"
serde_json = { workspace = true }
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[target.'cfg(windows)'.dependencies]
sable-loopback = { path = "../sable-loopback", version = "0.1.0" }

[build-dependencies]
napi-build = "2.6.0"

[lints]
workspace = true
