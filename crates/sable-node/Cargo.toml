[package]
name = "sable-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
global-hotkey = "0.9.0"
handy-keys = "0.3.4"
sable-core = { path = "../sable-core", version = "0.1.0" }
napi = { version = "3.14.2", default-features = false, features = ["napi4", "tokio_rt"] }
napi-derive = "3.6.12"
serde_json = { workspace = true }
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util.workspace = true

[target.'cfg(windows)'.dependencies]
sable-loopback = { path = "../sable-loopback", version = "0.1.0" }

[build-dependencies]
napi-build = "2.6.0"

[lints]
workspace = true
