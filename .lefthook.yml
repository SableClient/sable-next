pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  jobs:
    - name: scripts
      glob: '*.{js,mjs,cjs,ts,mts,cts}'
      # oxfmt ignores src/generated, so a commit whose only TypeScript is
      # regenerated bindings would hand it zero targets and fail.
      exclude:
        - 'src/generated/*'
      group:
        piped: true
        jobs:
          - run: pnpm exec eslint --fix --no-warn-ignored --max-warnings 0 {staged_files}
            stage_fixed: true
          - run: pnpm exec oxfmt {staged_files}
            stage_fixed: true

    - name: svelte
      glob: '*.svelte'
      group:
        piped: true
        jobs:
          - run: pnpm exec eslint --fix --max-warnings 0 {staged_files}
            stage_fixed: true
          - run: pnpm exec oxfmt {staged_files}
            stage_fixed: true
          - run: pnpm exec stylelint --fix --max-warnings 0 {staged_files}
            stage_fixed: true

    - name: type-aware
      glob: '*.{ts,tsx,mts,cts,svelte}'
      exclude:
        - 'src/generated/*'
      run: pnpm exec oxlint --type-aware {staged_files}

    - name: oxlint-js
      glob: '*.{js,mjs,cjs}'
      run: pnpm exec oxlint {staged_files}

    - name: css
      glob: '*.css'
      run: pnpm exec stylelint --fix --max-warnings 0 {staged_files}
      stage_fixed: true

    - name: rust-fmt
      glob: '*.rs'
      run: cargo fmt --all
      stage_fixed: true

    - name: typos
      run: mise exec -- typos --force-exclude {staged_files}

    - name: settings-changes
      glob:
        - 'src/lib/settings/registry/*'
        - 'src/lib/settings/registry.ts'
        - 'src/lib/settings/preferences.svelte.ts'
        - 'package.json'
      run: node scripts/generate/settings-changes.mjs --check

    - name: config-reference
      glob:
        - 'src/lib/settings/**'
        - 'src/lib/config/**'
        - 'src/locales/en.json'
      run: pnpm exec vitest run --project node src/lib/config/config-reference.test.ts
      fail_text: 'docs/settings.md or a config schema is stale, run pnpm vitest run --project node src/lib/config/config-reference.test.ts -u'

    - name: protocol-types
      glob: &protocol-sources
        - 'crates/sable-{core,model,frostbite}/**/*.rs'
        - 'crates/sable-{core,model,frostbite}/Cargo.toml'
        - 'Cargo.toml'
        - 'src/generated/protocol.ts'
      run: mise run check:types
      fail_text: 'src/generated/protocol.ts is stale, run mise run generate:types'

pre-push:
  parallel: true
  skip:
    - merge
    - rebase
  jobs:
    - name: svelte-check
      run: pnpm exec svelte-kit sync && pnpm exec svelte-check --tsconfig ./tsconfig.json --fail-on-warnings

    - name: protocol-types
      glob: *protocol-sources
      run: mise run check:types
      fail_text: 'src/generated/protocol.ts is stale, run mise run generate:types'

commit-msg:
  scripts:
    'check-sign-off.sh':
      runner: bash
