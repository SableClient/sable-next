[workspace]
members = ["crates/*", "src-tauri"]
# sable-wasm only compiles for wasm32 - its session store holds JS functions,
# which are not Send. Build it with `-p sable-wasm --target wasm32-unknown-unknown`.
default-members = ["crates/sable-core", "src-tauri"]
resolver = "3"

[workspace.dependencies]
matrix-sdk = { version = "0.18", default-features = false, features = ["e2e-encryption"] }
matrix-sdk-ui = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "fs"] }
futures-util = "0.3"
tracing = "0.1"
url = "2"
ts-rs = "12"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Selected stable nursery lints; keep the full nursery group disabled.
missing_const_for_fn = "deny"
option_if_let_else = "deny"
significant_drop_in_scrutinee = "deny"
needless_collect = "deny"
redundant_clone = "deny"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
string_slice = "deny"
indexing_slicing = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
unchecked_time_subtraction = "deny"

let_underscore_future = "deny"
unused_result_ok = "deny"
assertions_on_result_states = "deny"

await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_doc = "deny"
unnecessary_safety_comment = "deny"
mem_forget = "deny"

float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
cast_sign_loss = "deny"
invalid_upcast_comparisons = "deny"

rc_mutex = "deny"
debug_assert_with_mut_call = "deny"
iter_not_returning_iterator = "deny"
expl_impl_clone_on_copy = "deny"
infallible_try_from = "deny"

# Sizing the wasm bundle down belongs here, not on `release`, which also builds
# the `src-tauri` desktop binary. `strip` keeps the metadata wasm-bindgen reads
# and wasm-opt then drops.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"

# An unoptimised `dev` build is ~100 MB, which the browser recompiles on every
# reload and which OOMs wasm-bindgen-test-runner. This trades that for ~42 MB
# and keeps incremental rebuilds around a second.
[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = false

# 0.18.0 plus a fix for an event cache panic that aborts the wasm core. Patching
# one crate alone splits the family into two incompatible copies.
[patch.crates-io]
matrix-sdk = { git = "https://github.com/eleboucher/matrix-rust-sdk", rev = "723b1f80885216489df89640ce74b88f2a230373" }
matrix-sdk-base = { git = "https://github.com/eleboucher/matrix-rust-sdk", rev = "723b1f80885216489df89640ce74b88f2a230373" }
matrix-sdk-common = { git = "https://github.com/eleboucher/matrix-rust-sdk", rev = "723b1f80885216489df89640ce74b88f2a230373" }
matrix-sdk-crypto = { git = "https://github.com/eleboucher/matrix-rust-sdk", rev = "723b1f80885216489df89640ce74b88f2a230373" }
matrix-sdk-indexeddb = { git = "https://github.com/eleboucher/matrix-rust-sdk", rev = "723b1f80885216489df89640ce74b88f2a230373" }
matrix-sdk-sqlite = { git = "https://github.com/eleboucher/matrix-rust-sdk", rev = "723b1f80885216489df89640ce74b88f2a230373" }
matrix-sdk-store-encryption = { git = "https://github.com/eleboucher/matrix-rust-sdk", rev = "723b1f80885216489df89640ce74b88f2a230373" }
matrix-sdk-ui = { git = "https://github.com/eleboucher/matrix-rust-sdk", rev = "723b1f80885216489df89640ce74b88f2a230373" }
matrix-sdk-test = { git = "https://github.com/eleboucher/matrix-rust-sdk", rev = "723b1f80885216489df89640ce74b88f2a230373" }
matrix-sdk-test-macros = { git = "https://github.com/eleboucher/matrix-rust-sdk", rev = "723b1f80885216489df89640ce74b88f2a230373" }
matrix-sdk-test-utils = { git = "https://github.com/eleboucher/matrix-rust-sdk", rev = "723b1f80885216489df89640ce74b88f2a230373" }
