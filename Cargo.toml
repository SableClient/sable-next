[workspace]
members = ["crates/*", "plugins/*", "src-tauri"]
exclude = ["vendor/tauri-plugin-edge-to-edge", "vendor/tauri-plugin-livekit-mobile", "vendor/wry"]
# sable-wasm only compiles for wasm32 - its session store holds JS functions,
# which are not Send. Build it with `-p sable-wasm --target wasm32-unknown-unknown`.
default-members = ["crates/sable-core", "src-tauri"]
resolver = "3"

[patch.crates-io]
# bytecount 0.6.9 emits wasm SIMD even when simd128 is disabled.
bytecount = { path = "vendor/bytecount" }
wry = { path = "vendor/wry" }

[patch."https://github.com/SableClient/tauri-plugin-edge-to-edge.git"]
tauri-plugin-edge-to-edge = { path = "vendor/tauri-plugin-edge-to-edge" }

[patch."https://github.com/SableClient/tauri-plugin-livekit-mobile.git"]
tauri-plugin-livekit-mobile = { path = "vendor/tauri-plugin-livekit-mobile" }

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
matrix-sdk-common = { version = "0.19.1", git = "https://git.sable.moe/SableClient/matrix-rust-sdk", rev = "c4f4881d68e217a9538df30fa5428aac6afe074f" }
matrix-sdk = { version = "0.19.1", git = "https://git.sable.moe/SableClient/matrix-rust-sdk", rev = "c4f4881d68e217a9538df30fa5428aac6afe074f", default-features = false, features = [
  "e2e-encryption",
  "unstable-msc4274",
  "unstable-msc4354",
  "unstable-msc4560",
  "experimental-send-custom-to-device",
  "federation-api",
] }
matrix-sdk-ui = { version = "0.19.1", git = "https://git.sable.moe/SableClient/matrix-rust-sdk", rev = "c4f4881d68e217a9538df30fa5428aac6afe074f", features = [
  "unstable-msc4274",
  "unstable-msc4354",
] }
matrix-sdk-base = { version = "0.19.1", git = "https://git.sable.moe/SableClient/matrix-rust-sdk", rev = "c4f4881d68e217a9538df30fa5428aac6afe074f", default-features = false, features = [
  "e2e-encryption",
] }
matrix-sdk-indexeddb = { version = "0.19.1", git = "https://git.sable.moe/SableClient/matrix-rust-sdk", rev = "c4f4881d68e217a9538df30fa5428aac6afe074f", default-features = false }
matrix-sdk-test = { version = "0.19.1", git = "https://git.sable.moe/SableClient/matrix-rust-sdk", rev = "c4f4881d68e217a9538df30fa5428aac6afe074f" }
matrix-sdk-test-utils = { version = "0.19.1", git = "https://git.sable.moe/SableClient/matrix-rust-sdk", rev = "c4f4881d68e217a9538df30fa5428aac6afe074f" }
ruma-html = { version = "0.9", git = "https://github.com/ruma/ruma", rev = "0ed7fba34213f18a628a56f527c6cc795cd7eef5" }
ruma-common = { version = "0.20.2", git = "https://github.com/ruma/ruma", rev = "0ed7fba34213f18a628a56f527c6cc795cd7eef5", default-features = false }
ruma = { version = "0.17.2", git = "https://github.com/ruma/ruma", rev = "0ed7fba34213f18a628a56f527c6cc795cd7eef5", features = [
  "client-api-c",
  "unstable-msc4143",
  "unstable-msc4195",
  "unstable-msc4480",
  "unstable-msc4466",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_with = "3"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "fs"] }
futures-util = "0.3"
tracing = { version = "0.1", features = ["release_max_level_debug"] }
url = "2"
thiserror = "2"
specta = { version = "=2.0.0-rc.27", features = ["derive"] }
specta-serde = "=0.0.14"
specta-typescript = "=0.0.14"
pulldown-cmark = { version = "0.13", default-features = false }
regex-lite = "0.1"
unicode-segmentation = "1.13"
idna = "1.1"
icu_properties = "2.3"
form_urlencoded = "1.2"
percent-encoding = "2.3"
time = { version = "0.3", default-features = false }
html-escape = "0.3"
html5ever = "0.39"
linkify = "0.11"
tempfile = "3"
jiff = { version = "0.2", default-features = false, features = ["std"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
[workspace.lints.rust]
warnings = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(ruma_unstable_exhaustive_types)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
pedantic = { level = "deny", priority = -1 }
# Selected stable nursery lints; keep the full nursery group disabled.
missing_const_for_fn = "deny"
option_if_let_else = "deny"
significant_drop_in_scrutinee = "deny"
needless_collect = "deny"
redundant_clone = "deny"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
string_slice = "deny"
indexing_slicing = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
unchecked_time_subtraction = "deny"

let_underscore_future = "deny"
unused_result_ok = "deny"
assertions_on_result_states = "deny"

await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_doc = "deny"
unnecessary_safety_comment = "deny"
mem_forget = "deny"

float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
cast_sign_loss = "deny"
invalid_upcast_comparisons = "deny"

rc_mutex = "deny"
debug_assert_with_mut_call = "deny"
iter_not_returning_iterator = "deny"
expl_impl_clone_on_copy = "deny"
infallible_try_from = "deny"

# The SDK and serde_json unoptimised were 70% of the CPU on a phone, measured
# with simpleperf against a debug APK. Dependencies get the release treatment so
# an on-device debug build is usable. `sable-core` is optimised too, but for a
# different reason: its build script refuses opt-level 0.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
# Their symbols are what took the debug APK past 2 GB; ours are untouched.
debug = false

[profile.dev.package.sable-core]
opt-level = 1

[profile.dev.package.app]
opt-level = 1

# Full LTO stays off `release`, which also builds the `src-tauri` mobile
# libraries. `strip` keeps the metadata wasm-bindgen reads and wasm-opt then drops.
[profile.wasm-release]
inherits = "release"
lto = true
strip = "debuginfo"

# An unoptimised `dev` build is ~100 MB, which the browser recompiles on every
# reload and which OOMs wasm-bindgen-test-runner. This trades that for ~42 MB
# and keeps incremental rebuilds around a second.
[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = false

[profile.wasm-test]
inherits = "wasm-dev"
opt-level = "z"

[profile.wasm-test.package."*"]
opt-level = "z"

[profile.wasm-test.package.sable-core]
opt-level = "z"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
