[workspace]
members = ["crates/*", "src-tauri"]
# sable-wasm only compiles for wasm32 - its session store holds JS functions,
# which are not Send. Build it with `-p sable-wasm --target wasm32-unknown-unknown`.
default-members = ["crates/sable-core", "src-tauri"]
resolver = "3"

[workspace.dependencies]
matrix-sdk = { version = "0.18", default-features = false, features = ["e2e-encryption"] }
matrix-sdk-ui = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "fs"] }
futures-util = "0.3"
tracing = "0.1"
url = "2"
ts-rs = "12"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Selected stable nursery lints; keep the full nursery group disabled.
missing_const_for_fn = "deny"
option_if_let_else = "deny"
significant_drop_in_scrutinee = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
needless_collect = "deny"
redundant_clone = "deny"

# The wasm bundle is the web build's dominant cost, so the release profile
# optimises for size rather than speed.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# wasm-bindgen processes the linked module before wasm-opt strips its metadata.
[profile.wasm-release]
inherits = "release"
strip = "debuginfo"

# An unoptimised `dev` build is ~100 MB, which the browser recompiles on every
# reload and which OOMs wasm-bindgen-test-runner. This trades that for ~42 MB
# and keeps incremental rebuilds around a second.
[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = false

# 0.18.0 plus a fix for an event cache panic that aborts the wasm core. Patching
# one crate alone splits the family into two incompatible copies.
[patch.crates-io]
matrix-sdk = { git = "https://github.com/eleboucher/matrix-rust-sdk", branch = "sable/0.18.0-no-remove-panic" }
matrix-sdk-base = { git = "https://github.com/eleboucher/matrix-rust-sdk", branch = "sable/0.18.0-no-remove-panic" }
matrix-sdk-common = { git = "https://github.com/eleboucher/matrix-rust-sdk", branch = "sable/0.18.0-no-remove-panic" }
matrix-sdk-crypto = { git = "https://github.com/eleboucher/matrix-rust-sdk", branch = "sable/0.18.0-no-remove-panic" }
matrix-sdk-indexeddb = { git = "https://github.com/eleboucher/matrix-rust-sdk", branch = "sable/0.18.0-no-remove-panic" }
matrix-sdk-sqlite = { git = "https://github.com/eleboucher/matrix-rust-sdk", branch = "sable/0.18.0-no-remove-panic" }
matrix-sdk-store-encryption = { git = "https://github.com/eleboucher/matrix-rust-sdk", branch = "sable/0.18.0-no-remove-panic" }
matrix-sdk-ui = { git = "https://github.com/eleboucher/matrix-rust-sdk", branch = "sable/0.18.0-no-remove-panic" }
matrix-sdk-test = { git = "https://github.com/eleboucher/matrix-rust-sdk", branch = "sable/0.18.0-no-remove-panic" }
matrix-sdk-test-macros = { git = "https://github.com/eleboucher/matrix-rust-sdk", branch = "sable/0.18.0-no-remove-panic" }
matrix-sdk-test-utils = { git = "https://github.com/eleboucher/matrix-rust-sdk", branch = "sable/0.18.0-no-remove-panic" }
