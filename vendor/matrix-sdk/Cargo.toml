# Vendored from matrix-rust-sdk bc2502ee3d3ba1dc687740df5be0f8635032399e.

[package]
"authors" = ["Damir Jeli\u0107 <poljar@termina.org.uk>"]
"description" = "A high level Matrix client-server library."
"edition" = "2024"
"keywords" = ["matrix", "chat", "messaging", "ruma", "nio"]
"license" = "Apache-2.0"
"name" = "matrix-sdk"
"repository" = "https://github.com/matrix-org/matrix-rust-sdk"
"rust-version" = "1.96"
"version" = "0.19.1"
"include" = [".cargo/mermaid.html", "**/*.rs", "**/*.md"]
"metadata" = { "docs" = { "rs" = { "features" = ["docsrs"], "rustdoc-args" = ["--cfg", "docsrs", "--generate-link-to-definition"] } } }

[features]
"default" = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "rustls-aws-lc-rs"]
"testing" = ["matrix-sdk-sqlite?/testing", "matrix-sdk-indexeddb?/testing", "matrix-sdk-base/testing", "wiremock", "matrix-sdk-test", "strass"]
"e2e-encryption" = ["matrix-sdk-base/e2e-encryption", "matrix-sdk-sqlite?/crypto-store", "matrix-sdk-indexeddb?/e2e-encryption"]
"js" = ["matrix-sdk-common/js", "matrix-sdk-base/js"]
"sqlite" = ["dep:matrix-sdk-sqlite", "matrix-sdk-sqlite?/state-store", "matrix-sdk-sqlite?/event-cache-store", "matrix-sdk-sqlite?/media-store"]
"bundled-sqlite" = ["sqlite", "matrix-sdk-sqlite?/bundled"]
"indexeddb" = ["matrix-sdk-indexeddb/state-store", "matrix-sdk-indexeddb/event-cache-store", "matrix-sdk-indexeddb/media-store"]
"rustls-aws-lc-rs" = ["reqwest/rustls"]
"qrcode" = ["e2e-encryption", "matrix-sdk-base/qrcode"]
"automatic-room-key-forwarding" = ["e2e-encryption", "matrix-sdk-base/automatic-room-key-forwarding"]
"experimental-send-custom-to-device" = ["e2e-encryption", "matrix-sdk-base/experimental-send-custom-to-device"]
"experimental-encrypted-state-events" = ["e2e-encryption", "matrix-sdk-base/experimental-encrypted-state-events", "matrix-sdk-sqlite/experimental-encrypted-state-events", "matrix-sdk-test?/experimental-encrypted-state-events"]
"experimental-push-secrets" = ["e2e-encryption", "matrix-sdk-base/experimental-push-secrets", "matrix-sdk-sqlite?/experimental-push-secrets", "matrix-sdk-indexeddb?/experimental-push-secrets", "ruma/unstable-msc4385"]
"markdown" = ["ruma/markdown"]
"socks" = ["reqwest/socks"]
"local-server" = ["dep:axum", "dep:rand", "dep:tower"]
"sso-login" = ["local-server"]
"federation-api" = ["ruma/federation-api-c"]
"uniffi" = ["dep:uniffi", "matrix-sdk-base/uniffi", "dep:matrix-sdk-ffi-macros"]
"experimental-widgets" = ["dep:urlencoding", "dep:uuid", "experimental-send-custom-to-device"]
"docsrs" = ["e2e-encryption", "sqlite", "indexeddb", "sso-login", "qrcode", "federation-api"]
"unstable-msc4274" = ["ruma/unstable-msc4274", "matrix-sdk-base/unstable-msc4274"]
"unstable-msc4354" = ["matrix-sdk-base/unstable-msc4354"]
"unstable-msc4426" = ["matrix-sdk-base/unstable-msc4426"]
"experimental-search" = ["matrix-sdk-search"]
"experimental-element-recent-emojis" = ["matrix-sdk-base/experimental-element-recent-emojis"]
"experimental-x509-identity-verification" = ["e2e-encryption", "matrix-sdk-base/experimental-x509-identity-verification"]

[dependencies]
"anyhow" = { "version" = "1.0.104", "default-features" = false, "optional" = true }
"anymap2" = { "version" = "0.13.0", "default-features" = false }
"as_variant" = { "version" = "1.3.0", "default-features" = false }
"async-stream" = { "version" = "0.3.6", "default-features" = false }
"async-trait" = { "version" = "0.1.92", "default-features" = false }
"axum" = { "version" = "0.8.9", "optional" = true }
"bytes" = { "version" = "1.12.1", "default-features" = false, "features" = ["std"] }
"bytesize" = { "version" = "2.7.0", "default-features" = false, "features" = ["std"] }
"cfg-if" = { "version" = "1.0.4", "default-features" = false }
"event-listener" = "5.4.2"
"eyeball" = { "version" = "0.8.8", "default-features" = false, "features" = ["tracing"] }
"eyeball-im" = { "version" = "0.9.1", "default-features" = false, "features" = ["tracing"] }
"eyre" = { "version" = "0.6.14", "optional" = true }
"futures-core" = { "version" = "0.3.34", "default-features" = false, "features" = ["std"] }
"futures-util" = { "version" = "0.3.34", "default-features" = false, "features" = ["std", "async-await-macro"] }
"hex" = "0.4.3"
"http" = { "version" = "1.5.0", "default-features" = false }
"imbl" = { "version" = "7.0.2", "default-features" = false, "features" = ["serde"] }
"indexmap" = { "version" = "2.14.2", "default-features" = false }
"itertools" = { "version" = "0.15.0", "default-features" = false, "features" = ["use_std"] }
"js_int" = "0.2.2"
"language-tags" = "0.3.2"
"matrix-sdk-base" = { "version" = "0.19.1", "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"matrix-sdk-common" = { "version" = "0.19.1", "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"matrix-sdk-ffi-macros" = { "version" = "0.7.0", "optional" = true, "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"matrix-sdk-indexeddb" = { "version" = "0.19.1", "default-features" = false, "optional" = true, "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"matrix-sdk-search" = { "version" = "0.19.1", "optional" = true, "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"matrix-sdk-sqlite" = { "version" = "0.19.1", "default-features" = false, "optional" = true, "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"matrix-sdk-test" = { "version" = "0.19.1", "optional" = true, "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"mime" = { "version" = "0.3.17", "default-features" = false }
"mime2ext" = "0.1.54"
"oauth2" = { "version" = "5.0.0", "default-features" = false, "features" = ["timing-resistant-secret-traits"] }
"oauth2-reqwest" = { "version" = "0.1.0-alpha.3", "default-features" = false }
"percent-encoding" = "2.3.2"
"pin-project-lite" = { "version" = "0.2.17", "default-features" = false }
"rand" = { "version" = "0.10.2", "optional" = true }
"ruma" = { "version" = "0.17.0", "features" = ["client-api-c", "compat-unset-avatar", "compat-upload-signatures", "compat-arbitrary-length-ids", "compat-tag-info", "compat-encrypted-stickers", "compat-lax-room-create-deser", "compat-lax-room-topic-deser", "unstable-msc1763", "unstable-msc3230", "unstable-msc3401", "unstable-msc3417", "unstable-msc3488", "unstable-msc3489", "unstable-msc4075", "unstable-msc4140", "unstable-msc4143", "unstable-msc4171", "unstable-msc4195", "unstable-msc4278", "unstable-msc4286", "unstable-msc4306", "unstable-msc4308", "unstable-msc4310", "unstable-msc4388", "rand", "unstable-msc2448", "unstable-msc3930", "unstable-msc3245-v1-compat", "unstable-msc4108", "unstable-msc4278", "unstable-msc4262"] }
"serde" = { "version" = "1.0.229", "default-features" = false, "features" = ["std", "rc", "derive"] }
"serde_html_form" = { "version" = "0.4.1", "default-features" = false }
"serde_json" = { "version" = "1.0.151", "default-features" = false, "features" = ["std"] }
"sha2" = { "version" = "0.11.0" }
"strass" = { "version" = "0.2.0", "optional" = true }
"tempfile" = { "version" = "3.27.0", "default-features" = false }
"thiserror" = { "version" = "2.0.20", "default-features" = false }
"tokio-stream" = { "version" = "0.1.19", "default-features" = false, "features" = ["sync"] }
"tokio-util" = "0.7.19"
"tower" = { "version" = "0.5.3", "features" = ["util"], "optional" = true }
"tracing" = { "version" = "0.1.44", "default-features" = false, "features" = ["std", "attributes"] }
"uniffi" = { "version" = "0.32.1", "default-features" = false, "optional" = true, "features" = ["cargo-metadata"] }
"url" = { "version" = "2.5.8", "default-features" = false, "features" = ["serde"] }
"urlencoding" = { "version" = "2.1.3", "optional" = true }
"uuid" = { "version" = "1.26.1", "default-features" = false, "optional" = true, "features" = ["serde", "v4"] }
"vodozemac" = { "version" = "0.11.0", "features" = ["insecure-pk-encryption", "experimental-session-config"] }
"zeroize" = { "version" = "1.9.0" }

[target."cfg(not(target_family = \"wasm\"))".dependencies]
"backon" = "1.6.0"
"reqwest" = { "version" = "0.13.5", "default-features" = false, "features" = ["stream", "gzip", "http2", "rustls-no-provider"] }
"tokio" = { "version" = "1.53.1", "default-features" = false, "features" = ["sync", "fs", "rt", "macros"] }
"wiremock" = { "version" = "0.6.5", "default-features" = false, "optional" = true }

[target."cfg(target_family = \"wasm\")".dependencies]
"gloo-timers" = { "version" = "0.4.0", "default-features" = false, "features" = ["futures"] }
"reqwest" = { "version" = "0.13.5", "default-features" = false, "features" = ["gzip", "http2", "rustls-no-provider"] }
"tokio" = { "version" = "1.53.1", "default-features" = false, "features" = ["sync", "macros"] }

[lints]
"rust" = { "rust_2018_idioms" = "warn", "semicolon_in_expressions_from_macros" = "warn", "unexpected_cfgs" = { "level" = "warn", "check-cfg" = ["cfg(tarpaulin_include)", "cfg(ruma_unstable_exhaustive_types)"] }, "unused_extern_crates" = "warn", "unused_import_braces" = "warn", "unused_qualifications" = "warn", "trivial_casts" = "warn", "trivial_numeric_casts" = "warn" }
