["package"]
"name" = "matrix-sdk-indexeddb"
"version" = "0.19.1"
"repository" = "https://github.com/matrix-org/matrix-rust-sdk"
"description" = "Web's IndexedDB Storage backend for matrix-sdk"
"license" = "Apache-2.0"
"edition" = "2024"
"rust-version" = "1.96"
"metadata" = { "cargo-machete" = { "ignored" = ["serde_bytes"] }, "docs" = { "rs" = { "all-features" = true, "default-target" = "wasm32-unknown-unknown", "rustdoc-args" = ["--cfg", "docsrs", "--generate-link-to-definition"] } } }

["features"]
"default" = ["e2e-encryption", "state-store", "event-cache-store", "media-store"]
"event-cache-store" = ["dep:matrix-sdk-base", "media-store", "indexed-type-serializer"]
"media-store" = ["dep:matrix-sdk-base", "indexed-type-serializer"]
"state-store" = ["dep:matrix-sdk-base", "growable-bloom-filter", "safe-encode-traits"]
"e2e-encryption" = ["dep:matrix-sdk-base", "dep:matrix-sdk-crypto", "safe-encode-serializer"]
"safe-encode-traits" = []
"safe-encode-serializer" = ["dep:matrix-sdk-crypto", "safe-encode-traits"]
"indexed-type-serializer" = ["safe-encode-serializer"]
"testing" = ["matrix-sdk-crypto?/testing"]
"experimental-encrypted-state-events" = ["matrix-sdk-crypto?/experimental-encrypted-state-events"]
"experimental-push-secrets" = ["matrix-sdk-crypto?/experimental-push-secrets"]

["dependencies"]
"async-trait" = { "version" = "0.1.92", "default-features" = false }
"base64" = { "version" = "0.23.1", "default-features" = false, "features" = ["std"] }
"futures-util" = { "version" = "0.3.34", "default-features" = false, "features" = ["std"] }
"gloo-utils" = { "version" = "0.3.0", "default-features" = false, "features" = ["serde"] }
"growable-bloom-filter" = { "version" = "2.1.1", "default-features" = false, "optional" = true }
"hkdf" = { "version" = "0.13.0" }
"indexed_db_futures" = { "version" = "0.7.0", "package" = "matrix_indexed_db_futures", "default-features" = false, "features" = ["serde", "cursors", "indices", "streams"] }
"js-sys" = { "version" = "0.3.105", "default-features" = false, "features" = ["std"] }
"matrix-sdk-base" = { "version" = "0.19.1", "optional" = true, "features" = ["js"], "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"matrix-sdk-crypto" = { "version" = "0.19.1", "optional" = true, "features" = ["js"], "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"matrix-sdk-store-encryption" = { "version" = "0.19.1", "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"rmp-serde" = { "version" = "1.3.1", "default-features" = false }
"ruma" = { "version" = "0.17.0", "features" = ["client-api-c", "compat-unset-avatar", "compat-upload-signatures", "compat-arbitrary-length-ids", "compat-tag-info", "compat-encrypted-stickers", "compat-lax-room-create-deser", "compat-lax-room-topic-deser", "unstable-msc1763", "unstable-msc3230", "unstable-msc3401", "unstable-msc3417", "unstable-msc3488", "unstable-msc3489", "unstable-msc4075", "unstable-msc4140", "unstable-msc4143", "unstable-msc4171", "unstable-msc4195", "unstable-msc4278", "unstable-msc4286", "unstable-msc4306", "unstable-msc4308", "unstable-msc4310", "unstable-msc4388"] }
"serde" = { "version" = "1.0.229", "default-features" = false, "features" = ["std", "rc", "derive"] }
"serde_bytes" = { "version" = "0.11.19", "default-features" = false, "features" = ["std"] }
"serde-wasm-bindgen" = { "version" = "0.6.5", "default-features" = false }
"serde_json" = { "version" = "1.0.151", "default-features" = false, "features" = ["std"] }
"sha2" = { "version" = "0.11.0" }
"thiserror" = { "version" = "2.0.20", "default-features" = false }
"tokio" = { "version" = "1.53.1", "default-features" = false, "features" = ["sync"] }
"tracing" = { "version" = "0.1.44", "default-features" = false, "features" = ["std"] }
"uuid" = { "version" = "1.26.1", "default-features" = false, "features" = ["js", "serde", "v4"] }
"wasm-bindgen" = { "version" = "0.2.128", "default-features" = false }
"web-sys" = { "version" = "0.3.105", "default-features" = false, "features" = ["IdbKeyRange"] }
"zeroize" = { "version" = "1.9.0" }

["target"]
"cfg(target_family = \"wasm\")" = { "dependencies" = { "getrandom" = { "version" = "0.4.3", "default-features" = false, "features" = ["wasm_js"] } } }

["dev-dependencies"]
"assert_matches" = { "version" = "1.5.0", "default-features" = false }
"strass" = { "version" = "0.2.0" }
"gloo-timers" = { "version" = "0.4.0", "default-features" = false, "features" = ["futures"] }
"matrix-sdk-base" = { "version" = "0.19.1", "features" = ["testing"], "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"matrix-sdk-common" = { "version" = "0.19.1", "features" = ["js"], "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"matrix-sdk-crypto" = { "version" = "0.19.1", "features" = ["js", "testing"], "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"matrix-sdk-test" = { "version" = "0.19.1", "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"rand" = { "version" = "0.10.2" }
"tracing-subscriber" = { "version" = "0.3.23", "default-features" = false, "features" = ["std", "smallvec", "fmt", "registry", "tracing-log"] }
"wasm-bindgen-test" = { "version" = "0.3.78", "default-features" = false, "features" = ["std"] }
"web-sys" = { "version" = "0.3.105", "default-features" = false, "features" = ["IdbKeyRange", "Window", "Performance"] }

["lints"]
"rust" = { "rust_2018_idioms" = "warn", "semicolon_in_expressions_from_macros" = "warn", "unexpected_cfgs" = { "level" = "warn", "check-cfg" = ["cfg(tarpaulin_include)", "cfg(ruma_unstable_exhaustive_types)"] }, "unused_extern_crates" = "warn", "unused_import_braces" = "warn", "unused_qualifications" = "warn", "trivial_casts" = "warn", "trivial_numeric_casts" = "warn" }
"clippy" = { "assigning_clones" = "allow", "box_default" = "allow", "cloned_instead_of_copied" = "warn", "dbg_macro" = "warn", "inefficient_to_string" = "warn", "macro_use_imports" = "warn", "manual_let_else" = "warn", "mut_mut" = "warn", "needless_borrow" = "warn", "nonstandard_macro_braces" = "warn", "redundant_clone" = "warn", "single_range_in_vec_init" = "allow", "str_to_string" = "warn", "todo" = "warn", "unnecessary_semicolon" = "warn", "unused_async" = "warn" }
