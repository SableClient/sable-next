["package"]
"authors" = ["Damir Jeli\u0107 <poljar@termina.org.uk>"]
"description" = "Matrix encryption library"
"edition" = "2024"
"keywords" = ["matrix", "chat", "messaging", "ruma", "nio"]
"license" = "Apache-2.0"
"name" = "matrix-sdk-crypto"
"repository" = "https://github.com/matrix-org/matrix-rust-sdk"
"rust-version" = "1.96"
"version" = "0.19.1"
"include" = [".cargo/mermaid.html", "**/*.rs"]
"metadata" = { "docs" = { "rs" = { "rustdoc-args" = ["--cfg", "docsrs", "--generate-link-to-definition"] } }, "cargo-machete" = { "ignored" = ["rustls-webpki", "rustls-pki-types"] } }

["features"]
"default" = []
"automatic-room-key-forwarding" = []
"experimental-send-custom-to-device" = []
"experimental-encrypted-state-events" = ["matrix-sdk-common/experimental-encrypted-state-events", "ruma/unstable-msc4362"]
"js" = ["ruma/js", "vodozemac/wasm_js", "matrix-sdk-common/js"]
"qrcode" = ["dep:matrix-sdk-qrcode"]
"experimental-algorithms" = []
"uniffi" = ["dep:uniffi"]
"_disable-minimum-rotation-period-ms" = []
"test-send-sync" = []
"testing" = ["matrix-sdk-test"]
"experimental-push-secrets" = []
"experimental-x509-identity-verification" = ["dep:cms", "dep:pkcs1", "dep:sha2_0_10"]
"rust-x509-verifier-impl" = ["experimental-x509-identity-verification", "dep:rustls", "dep:rustls-pki-types", "dep:rustls-webpki", "dep:ring"]

["dependencies"]
"aes" = { "version" = "0.9.3", "default-features" = false }
"as_variant" = { "version" = "1.3.0", "default-features" = false }
"async-trait" = { "version" = "0.1.92", "default-features" = false }
"bs58" = { "version" = "0.5.1", "default-features" = false, "features" = ["std"] }
"byteorder" = { "version" = "1.5.0", "default-features" = false, "features" = ["std"] }
"cfg-if" = { "version" = "1.0.4", "default-features" = false }
"cms" = { "version" = "0.2.3", "default-features" = false, "features" = ["std"], "optional" = true }
"ctr" = { "version" = "0.10.1", "default-features" = false }
"eyeball" = { "version" = "0.8.8", "default-features" = false, "features" = ["tracing"] }
"futures-core" = { "version" = "0.3.34", "default-features" = false, "features" = ["std"] }
"futures-util" = { "version" = "0.3.34", "default-features" = false, "features" = ["std"] }
"hkdf" = { "version" = "0.13.0" }
"hmac" = { "version" = "0.13.0" }
"itertools" = { "version" = "0.15.0", "default-features" = false, "features" = ["use_std"] }
"js_option" = { "version" = "0.2.0", "default-features" = false }
"matrix-sdk-common" = { "version" = "0.19.1", "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"matrix-sdk-qrcode" = { "version" = "0.19.1", "optional" = true, "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"matrix-sdk-test" = { "version" = "0.19.1", "optional" = true, "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"pbkdf2" = { "version" = "0.13.0", "default-features" = false }
"pkcs1" = { "version" = "0.7.5", "default-features" = false, "optional" = true }
"rand" = { "version" = "0.10.2" }
"ring" = { "version" = "0.17.14", "optional" = true, "features" = ["wasm32_unknown_unknown_js"] }
"rmp-serde" = { "version" = "1.3.1", "default-features" = false }
"ruma" = { "version" = "0.17.0", "features" = ["client-api-c", "compat-unset-avatar", "compat-upload-signatures", "compat-arbitrary-length-ids", "compat-tag-info", "compat-encrypted-stickers", "compat-lax-room-create-deser", "compat-lax-room-topic-deser", "unstable-msc1763", "unstable-msc3230", "unstable-msc3401", "unstable-msc3417", "unstable-msc3488", "unstable-msc3489", "unstable-msc4075", "unstable-msc4140", "unstable-msc4143", "unstable-msc4171", "unstable-msc4195", "unstable-msc4278", "unstable-msc4286", "unstable-msc4306", "unstable-msc4308", "unstable-msc4310", "unstable-msc4388", "rand", "unstable-msc3814"] }
"rustls" = { "version" = "0.23.45", "default-features" = false, "optional" = true, "features" = ["std", "ring"] }
"rustls-pki-types" = { "version" = "1.15.1", "optional" = true, "default-features" = false, "features" = ["alloc", "web"] }
"rustls-webpki" = { "version" = "0.103.15", "default-features" = false, "optional" = true }
"serde" = { "version" = "1.0.229", "default-features" = false, "features" = ["std", "rc", "derive", "derive", "rc"] }
"serde_json" = { "version" = "1.0.151", "default-features" = false, "features" = ["std"] }
"sha2" = { "version" = "0.11.0" }
"sha2_0_10" = { "package" = "sha2", "version" = "0.10.9", "features" = ["oid"], "optional" = true }
"subtle" = { "version" = "2.6.1", "default-features" = false, "features" = ["std", "i128"] }
"thiserror" = { "version" = "2.0.20", "default-features" = false }
"time" = { "version" = "0.3.55", "default-features" = false, "features" = ["std", "formatting"] }
"tokio" = { "version" = "1.53.1", "default-features" = false, "features" = ["sync"] }
"tokio-stream" = { "version" = "0.1.19", "default-features" = false, "features" = ["sync"] }
"tracing" = { "version" = "0.1.44", "default-features" = false, "features" = ["std", "attributes"] }
"ulid" = { "version" = "3.0.0", "default-features" = false, "features" = ["std"] }
"uniffi" = { "version" = "0.32.1", "default-features" = false, "features" = ["cargo-metadata"], "optional" = true }
"url" = { "version" = "2.5.8", "default-features" = false }
"vodozemac" = { "version" = "0.11.0", "features" = ["insecure-pk-encryption", "experimental-session-config"] }
"zeroize" = { "version" = "1.9.0", "features" = ["zeroize_derive"] }

["target"]
"cfg(not(target_family = \"wasm\"))" = { "dependencies" = { "tokio" = { "version" = "1.53.1", "default-features" = false, "features" = ["sync", "time"] } } }
"cfg(target_family = \"wasm\")" = { "dependencies" = { "tokio" = { "version" = "1.53.1", "default-features" = false, "features" = ["sync"] } } }

["dev-dependencies"]
"anyhow" = { "version" = "1.0.104", "default-features" = false }
"assert_matches" = { "version" = "1.5.0", "default-features" = false }
"futures-executor" = { "version" = "0.3.34", "default-features" = false, "features" = ["std"] }
"http" = { "version" = "1.5.0", "default-features" = false }
"insta" = { "version" = "1.48.0", "features" = ["json", "redactions"] }
"matrix-sdk-test" = { "version" = "0.19.1", "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"matrix-sdk-test-utils" = { "version" = "0.19.1", "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "bc2502ee3d3ba1dc687740df5be0f8635032399e" }
"proptest" = { "version" = "1.11.0", "default-features" = false, "features" = ["std"] }
"rmp-serde" = { "version" = "1.3.1", "default-features" = false }
"rcgen" = { "version" = "0.14.10", "default-features" = false, "features" = ["pem", "aws_lc_rs", "x509-parser"] }
"similar-asserts" = { "version" = "2.0.0", "default-features" = false }
"strass" = { "version" = "0.2.0" }
"stream_assert" = { "version" = "0.1.1", "default-features" = false }
"tokio" = { "version" = "1.53.1", "default-features" = false, "features" = ["sync", "macros", "rt-multi-thread"] }
"ring" = { "version" = "0.17.14", "features" = ["wasm32_unknown_unknown_js"] }
"rustls" = { "version" = "0.23.45", "default-features" = false, "features" = ["std", "ring"] }
"rustls-webpki" = { "version" = "0.103.15", "default-features" = false }
"rustls-pki-types" = { "version" = "1.15.1", "default-features" = false, "features" = ["alloc", "web"] }

["lints"]
"rust" = { "rust_2018_idioms" = "warn", "semicolon_in_expressions_from_macros" = "warn", "unexpected_cfgs" = { "level" = "warn", "check-cfg" = ["cfg(tarpaulin_include)", "cfg(ruma_unstable_exhaustive_types)"] }, "unused_extern_crates" = "warn", "unused_import_braces" = "warn", "unused_qualifications" = "warn", "trivial_casts" = "warn", "trivial_numeric_casts" = "warn" }
"clippy" = { "assigning_clones" = "allow", "box_default" = "allow", "cloned_instead_of_copied" = "warn", "dbg_macro" = "warn", "inefficient_to_string" = "warn", "macro_use_imports" = "warn", "manual_let_else" = "warn", "mut_mut" = "warn", "needless_borrow" = "warn", "nonstandard_macro_braces" = "warn", "redundant_clone" = "warn", "single_range_in_vec_init" = "allow", "str_to_string" = "warn", "todo" = "warn", "unnecessary_semicolon" = "warn", "unused_async" = "warn" }
