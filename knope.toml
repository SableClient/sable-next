[package]
versioned_files = [
  "package.json",
  "src-tauri/tauri.conf.json",
  "src-tauri/Cargo.toml",
  "Cargo.lock",
]
changelog = "CHANGELOG.md"
extra_changelog_sections = [
  { name = "Security", types = [
    "security",
  ] },
  { name = "Breaking Changes", types = [
    "major",
  ] },
  { name = "Features", types = [
    "minor",
    "feature",
  ] },
  { name = "Fixes", types = [
    "patch",
  ] },
  { name = "Documentation", types = [
    "docs",
  ] },
  { name = "Notes", types = [
    "note",
  ] },
]

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "prepare-release"
help_text = "Prepare a release PR"

[[workflows.steps]]
type = "Command"
command = "git switch -c release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "node scripts/release/fastlane-changelog.mjs $version"

[[workflows.steps]]
type = "Command"
command = "git add fastlane/metadata/android/en-US/changelogs"

[[workflows.steps]]
type = "Command"
command = "node scripts/release/flatpak-metainfo-release.mjs $version"

[[workflows.steps]]
type = "Command"
command = "git add packaging/flatpak"

[[workflows.steps]]
type = "Command"
command = "node scripts/release/settings-changes-release.mjs $version"

[[workflows.steps]]
type = "Command"
command = "git add src/generated/settings-changes.json"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release $version\""

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "Command"
command = "node scripts/release/forgejo-release-pr.mjs pr"

[[workflows]]
name = "release"
help_text = "Create the release and tag the prepared commit"

[[workflows.steps]]
type = "Command"
command = "node scripts/release/forgejo-release-pr.mjs release"

[[workflows]]
name = "document-change"
help_text = "Create a new change file to be included in the next release"

[[workflows.steps]]
type = "CreateChangeFile"

[gitea]
owner = "SableClient"
repo = "sable-next"
host = "https://git.sable.moe"

[release_notes]
change_templates = ["* $summary"]
