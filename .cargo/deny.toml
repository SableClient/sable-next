[advisories]
version = 2
# matrix-sdk 0.18 still resolves blake3's yanked arrayref 0.3.9; Cargo cannot
# select arrayref 0.3.10 without introducing additional duplicate dependencies.
yanked = "warn"
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "openidconnect uses RSA to verify provider signatures with public keys; Sable does not perform RSA private-key operations" },
  { id = "RUSTSEC-2026-0387", reason = "openidconnect uses p256 and p384 to verify provider signatures with public keys; Sable does not use them for secret-key operations" },
  { id = "RUSTSEC-2026-0459", reason = "Sable opens its own account stores, not externally supplied SQLite/WAL files; rusqlite must remain compatible with the pinned Matrix SDK" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = [{ crate = "audiofox", allow = ["GPL-2.0-or-later WITH Classpath-exception-2.0"] }]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = []
