packages:
  - .
  - electron

hoistPattern:
  - '*'
  - '!electron'

allowBuilds:
  '@sentry/cli': true
  '@vencord/venmic': false
  cpu-features: false
  core-js: false
  electron: true
  electron-winstaller: false
  esbuild: true
  exifreader: false
  lightningcss: true
  protobufjs: false
  ssh2: false
  workerd: true
  '@swc/core': false
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@sableclient/*'
  - electron@45.0.0
packageExtensions:
  # Its entry imports React without declaring it: https://github.com/storybookjs/storybook/issues/37184
  '@storybook/addon-themes':
    peerDependencies:
      react: '*'
    peerDependenciesMeta:
      react:
        optional: true
patchedDependencies:
  # Start the worklet's message port so destroy() stops RNNoise processing.
  '@sapphi-red/web-noise-suppressor@0.4.1': patches/@sapphi-red__web-noise-suppressor@0.4.1.patch
  '@sveltejs/kit@3.4.0': patches/@sveltejs__kit@3.4.0.patch
  # Run RPM setup after the previous version's removal script.
  app-builder-lib@26.18.0: patches/app-builder-lib@26.18.0.patch
  livekit-client@2.24.1: patches/livekit-client@2.24.1.patch
  # Backport https://github.com/benjamn/recast/pull/1442 until it is released.
  recast@0.23.21: patches/recast@0.23.21.patch
  svelte@5.57.3: patches/svelte@5.57.3.patch
