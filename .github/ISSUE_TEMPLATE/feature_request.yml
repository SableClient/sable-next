name: Feature Request
description: Suggest an idea
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        Please search for [existing issues](https://git.sable.moe/SableClient/sable-next/issues) before suggesting a feature.

  - type: textarea
    id: problem
    attributes:
      label: Describe the problem
      description: A clear description of the problem this feature would solve
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Describe the solution you'd like"
      description: A clear description of what change you would like
      placeholder: 'I would like to...'
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      description: Select All for every platform, Desktop or Mobile for those groups, or specific platforms. Select all that apply.
      multiple: true
      options:
        - All
        - Web
        - Desktop
        - Windows
        - macOS
        - Linux
        - Mobile
        - iOS
        - Android

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
