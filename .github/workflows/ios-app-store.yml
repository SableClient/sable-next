name: Upload iOS to App Store Connect
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions: {}
concurrency:
  group: ios-app-store-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: '1'
  CARGO_PROFILE_RELEASE_STRIP: none
  CARGO_TERM_COLOR: always
jobs:
  build-web:
    name: Build web assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: production
      SABLE_BUILD_FLAVOR: stable
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve version
        run: echo "VITE_APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Set up app and build
        uses: ./.github/actions/setup
        with:
          build: 'true'
      - name: Upload web assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-assets
          path: |
            .svelte-kit/output
            dist
            src/generated/wasm
          if-no-files-found: error
          retention-days: 1
  ios:
    name: Build and upload iOS
    needs: build-web
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      APPLE_DEVELOPMENT_TEAM: NXLJ6G3CP7
      APPLE_API_ISSUER: ${{ secrets.APP_STORE_API_ISSUER_ID }}
      APPLE_API_KEY: ${{ secrets.APP_STORE_API_KEY_ID }}
      APP_STORE_API_KEY_BASE64: ${{ secrets.APP_STORE_API_KEY_BASE64 }}
      APP_IDENTIFIER_CONFIG: '{"identifier":"moe.sable.app"}'
      RUST_TARGETS: aarch64-apple-ios
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      VITE_SENTRY_ENVIRONMENT: production
      SABLE_BUILD_FLAVOR: stable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
      - name: Set up app
        uses: ./.github/actions/setup
        with:
          rust: 'true'
          rust-cache-key: tauri-ios
          install-mise-tools: 'false'
      - name: Write the App Store Connect API key
        run: |
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APP_STORE_API_KEY_BASE64" | base64 --decode > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Set up iOS project
        run: |
          brew install cocoapods
          pnpm tauri ios init --ci --config "$APP_IDENTIFIER_CONFIG"
      - name: Download iOS frameworks
        run: pnpm ios:frameworks
      - name: Add Rust target
        run: |
          # shellcheck disable=SC2086 # RUST_TARGETS is a space-separated list.
          rustup target add $RUST_TARGETS
      - name: Stamp release version into tauri.conf.json
        run: node scripts/ci/set-tauri-version.mjs "$VERSION"
      - name: Build signed iOS bundle
        id: ipa
        run: |
          pnpm tauri ios build \
            --config src-tauri/tauri.ci.conf.json \
            --config "$APP_IDENTIFIER_CONFIG" \
            --export-method app-store-connect \
            --build-number "$GITHUB_RUN_NUMBER" \
            --ci
          node scripts/ci/upload-sentry-symbols.mjs --ios
          ipa="$(find src-tauri/gen/apple/build -type f -name '*.ipa' | head -n 1)"
          [ -n "$ipa" ] || { echo 'No iOS IPA found' >&2; exit 1; }
          echo "path=$ipa" >> "$GITHUB_OUTPUT"
      - name: List IPA frameworks
        env:
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: |
          dir="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$dir"
          find "$dir"/Payload/*.app/Frameworks -maxdepth 2
          find "$dir"/Payload/*.app/Frameworks -type f -perm -u+x -exec file {} \;
          for framework in "$dir"/Payload/*.app/Frameworks/*.framework; do
            echo "== $framework"
            codesign --verify --strict --verbose=4 "$framework" 2>&1 || true
            codesign -dvvv "$framework" 2>&1 | grep -E 'Identifier|Format|CodeDirectory|flags|Signature|Authority|Sealed|Info.plist|TeamIdentifier' || true
          done
      - name: Upload to App Store Connect
        env:
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: |
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
