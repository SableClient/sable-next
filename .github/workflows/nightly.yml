name: Nightly release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  release:
    name: Prepare nightly release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create or update nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --target "$SHA" --title 'Nightly (main)' \
              --notes "Rolling nightly build from main at $SHA"
          else
            gh release create nightly --prerelease --target "$SHA" --title 'Nightly (main)' \
              --notes "Rolling nightly build from main at $SHA"
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            runner: macos-latest
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
            bundle-path: target/universal-apple-darwin/release/bundle
          - name: Windows x86_64
            runner: windows-latest
            rust-targets: ''
            tauri-args: ''
            bundle-path: target/release/bundle
          - name: Linux x86_64
            runner: ubuntu-24.04
            rust-targets: ''
            tauri-args: ''
            bundle-path: target/release/bundle
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux Tauri dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config

      - name: Set up app and build web assets
        uses: ./.github/actions/setup
        with:
          build: 'true'

      - name: Add Rust targets
        if: ${{ matrix.rust-targets != '' }}
        shell: bash
        run: rustup target add ${{ matrix.rust-targets }}

      - name: Build desktop bundle
        shell: bash
        run: pnpm tauri build --config src-tauri/tauri.ci.conf.json ${{ matrix.tauri-args }}

      - name: Attach desktop bundles to nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ matrix.bundle-path }}
        run: |
          find "$BUNDLE_PATH" -type f \( \
            -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.AppImage' \
          \) -print0 > bundles
          test -s bundles || { echo "No desktop bundles found in $BUNDLE_PATH" >&2; exit 1; }
          while IFS= read -r -d '' bundle; do
            gh release upload nightly "$bundle" --clobber
          done < bundles

  finalize:
    name: Finalize nightly release
    needs: [release, build, android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Update nightly tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method PATCH "repos/$REPOSITORY/git/refs/tags/nightly" \
            -f sha="$SHA" -F force=true
          gh release edit nightly --prerelease --target "$SHA" --title 'Nightly (main)' \
            --notes "Rolling nightly build from main at $SHA"

  android:
    name: Build Android
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      MISE_ENV: tauri
      RUST_TARGETS: aarch64-linux-android armv7-linux-androideabi
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up app and build web assets
        uses: ./.github/actions/setup
        with:
          build: 'true'

      - name: Set up Android SDK and NDK
        shell: bash
        run: mise run tauri:setup:android

      - name: Add Rust targets
        shell: bash
        run: rustup target add $RUST_TARGETS

      - name: Build Android bundles
        shell: bash
        run: pnpm tauri android build --apk --aab --target aarch64 armv7

      - name: Attach Android bundles to nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find src-tauri/gen/android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) \
            -print0 > bundles
          test -s bundles || { echo 'No Android bundles found' >&2; exit 1; }
          while IFS= read -r -d '' bundle; do
            gh release upload nightly "$bundle" --clobber
          done < bundles

  ios:
    name: Build iOS
    needs: release
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RUST_TARGETS: aarch64-apple-ios
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up app and build web assets
        uses: ./.github/actions/setup
        with:
          build: 'true'

      - name: Set up iOS project
        shell: bash
        run: |
          brew install cocoapods
          pnpm tauri ios init --ci

      - name: Add Rust target
        shell: bash
        run: rustup target add $RUST_TARGETS

      - name: Build unsigned iOS bundle
        shell: bash
        run: pnpm tauri ios build --no-sign --ci

      - name: Attach iOS bundle to nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ipa="$(find src-tauri/gen/apple/build -type f -name '*.ipa' | head -n 1)"
          [ -n "$ipa" ] || { echo 'No iOS IPA found' >&2; exit 1; }
          gh release upload nightly "$ipa" --clobber
