name: Build Windows, Linux aarch64, macOS x86_64 and FreeBSD Electron apps
on:
  push:
    tags: ['v*']
  # Forgejo schedules nightlies and dispatches this with the commit it built.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach bundles to (e.g. v1.2.3). Empty builds a nightly.'
        required: false
        type: string
      sha:
        description: 'main commit a nightly builds. Empty builds HEAD.'
        required: false
        type: string
permissions: {}
concurrency:
  group: tauri-build-${{ github.event_name == 'workflow_dispatch' && (inputs.tag || github.run_id) || github.ref_name }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
  CARGO_PROFILE_RELEASE_STRIP: none
  CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
  CARGO_TERM_COLOR: always
  FORGEJO_URL: https://git.sable.moe
  FORGEJO_REPOSITORY: SableClient/sable-next
  FORGEJO_TOKEN: ${{ secrets.FORGEJO_RELEASE_TOKEN }}
jobs:
  setup-release:
    name: Resolve release target
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
      nightly: ${{ steps.meta.outputs.nightly }}
      sha: ${{ steps.meta.outputs.sha }}
      electron-targets: ${{ steps.targets.outputs.electron }}
    steps:
      # The push mirror from Forgejo can trail the dispatch.
      - name: Wait for the commit to reach GitHub
        if: ${{ inputs.sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          for _ in $(seq 40); do
            gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --silent && exit 0
            sleep 15
          done
          echo "::error::$SHA never reached GitHub." >&2
          exit 1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Resolve release meta
        id: meta
        uses: ./.github/actions/resolve-release-meta
        with:
          input-tag: ${{ inputs.tag }}
          git-sha: ${{ inputs.sha }}
      - name: Pick the Electron targets
        id: targets
        env:
          NIGHTLY: ${{ steps.meta.outputs.nightly }}
        run: |
          targets='[
            {"name": "Windows x86_64", "runner": "windows-latest", "platform": "--win"},
            {"name": "Linux x86_64", "runner": "ubuntu-24.04", "platform": "--linux"},
            {"name": "Linux aarch64", "runner": "ubuntu-24.04-arm", "platform": "--linux"}
          ]'
          if [ "$NIGHTLY" != 'true' ]; then
            targets="$(jq '. + [{"name": "macOS x86_64", "runner": "macos-26-intel", "platform": "--mac"}]' <<< "$targets")"
          fi
          echo "electron=$(jq -c . <<< "$targets")" >> "$GITHUB_OUTPUT"
      - name: Wait for release to exist
        if: ${{ steps.meta.outputs.nightly != 'true' }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: node scripts/ci/forgejo-release.mjs wait --attempts 60 --interval 15
      - name: Create nightly prerelease
        if: ${{ steps.meta.outputs.nightly == 'true' }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          node scripts/ci/forgejo-release.mjs ensure \
            --tag "$TAG" \
            --sha "$SHA" \
            --prerelease true \
            --title "Nightly build $VERSION" \
            --notes "Nightly build from main at $SHA"
  build-web:
    name: Build web assets
    needs: setup-release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Absent on forks, which builds an app with error reporting switched off.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Set up app and build
        uses: ./.github/actions/setup
        with:
          build: 'true'
      - name: Upload web assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-assets
          path: |
            .svelte-kit/output
            dist
            src/generated/wasm
          if-no-files-found: error
          retention-days: 7
  electron:
    name: ${{ matrix.name }} (Electron)
    needs: [setup-release, build-web]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-release.outputs.electron-targets) }}
    env:
      VERSION: ${{ needs.setup-release.outputs.version }}
      TAG: ${{ needs.setup-release.outputs.tag }}
      SHA: ${{ needs.setup-release.outputs.sha }}
      # Baked into the main process by electron/build.mjs.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_API_ISSUER: ${{ secrets.APP_STORE_API_ISSUER_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download web assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-assets
      - name: Write the App Store Connect API key
        if: ${{ runner.os == 'macOS' }}
        uses: ./.forgejo/actions/app-store-connect-key
        with:
          key-id: ${{ secrets.APP_STORE_API_KEY_ID }}
          key: ${{ secrets.APP_STORE_API_KEY_BASE64 }}
      - name: Import the signing identity
        if: ${{ runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' }}
        uses: ./.forgejo/actions/apple-signing-keychain
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libclang-dev libpipewire-0.3-dev pkg-config rpm
          # The Electron binary links these even under ELECTRON_RUN_AS_NODE.
          sudo apt-get install --no-install-recommends -y libnss3 libgtk-3-0 libgbm1 libasound2t64
      - name: Set up app
        uses: ./.github/actions/setup
        with:
          rust: 'true'
          rust-cache-key: electron-${{ runner.os }}-${{ runner.arch }}
          install-mise-tools: 'false'
      - name: Package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          sign_args=()
          if [ "$RUNNER_OS" = macOS ]; then
            if [ -n "${APPLE_CERTIFICATE:-}" ]; then
              # electron-builder takes the key's path, not its ID, from APPLE_API_KEY.
              export APPLE_API_KEY="$APPLE_API_KEY_PATH"
              export CSC_KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
              sign_args=(-c.mac.identity=NXLJ6G3CP7 -c.mac.hardenedRuntime=true -c.forceCodeSigning=true)
            else
              case "$VERSION" in
                *-nightly.*) unset APPLE_API_ISSUER APPLE_API_KEY_ID ;;
                *) echo 'APPLE_CERTIFICATE is required to build a stable macOS release.' >&2; exit 1 ;;
              esac
            fi
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            # Git Bash's perl lacks modules that OpenSSL's Configure loads.
            export OPENSSL_SRC_PERL='C:/Strawberry/perl/bin/perl.exe'
          fi
          pnpm --dir electron package "$PLATFORM" "${sign_args[@]}"
      - name: Remove the signing keychain
        if: ${{ always() && runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' }}
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - name: Upload native addon symbols
        shell: bash
        run: |
          args=()
          if [ "$RUNNER_OS" = Linux ]; then
            shopt -s nullglob
            executables=(electron/release/linux*-unpacked/sable{,-nightly})
            if [ "${#executables[@]}" -eq 1 ]; then
              args=(--electron "${executables[0]}")
            else
              echo "::warning::Expected one Electron executable, found ${#executables[@]}; Electron symbols are not mirrored"
            fi
          fi
          node scripts/ci/upload-sentry-symbols.mjs "${args[@]}" electron/dist
      - name: Verify native core shutdown
        if: ${{ runner.os != 'Windows' }}
        run: SABLE_NODE_ADDON="$PWD/electron/dist/sable_node.node" node --test crates/sable-node/tests/native-lifecycle.mjs
      - name: Verify native core shutdown in Electron
        if: ${{ runner.os != 'Windows' }}
        run: ELECTRON_RUN_AS_NODE=1 SABLE_NODE_ADDON="$PWD/electron/dist/sable_node.node" pnpm --dir electron exec electron --test "$PWD/crates/sable-node/tests/native-lifecycle.mjs"
      - name: Attest bundles
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            electron/release/*.exe
            electron/release/*.msi
            electron/release/*.deb
            electron/release/*.rpm
            electron/release/*.AppImage
            electron/release/*.tar.gz
            electron/release/*.dmg
            electron/release/*.zip
      # Forgejo's mac-update-manifest merges it into latest-mac.yml.
      - name: Rename the Intel update manifest
        if: ${{ runner.os == 'macOS' }}
        run: mv electron/release/latest-mac.yml electron/release/latest-mac-x64.yml
      - name: Publish Electron bundles and update metadata
        shell: bash
        run: node electron/publish-updates.mjs
      - name: Publish deb and rpm to the package registries
        if: ${{ runner.os == 'Linux' }}
        env:
          PACKAGES_USER: ${{ secrets.PACKAGES_USER }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          NIGHTLY: ${{ needs.setup-release.outputs.nightly }}
        run: |
          channel=stable
          [ "$NIGHTLY" != 'true' ] || channel=nightly
          api="$FORGEJO_URL/api/packages/${FORGEJO_REPOSITORY%%/*}"
          upload() {
            code=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' --user "$PACKAGES_USER:$PACKAGES_TOKEN" \
              --upload-file "$1" "$2")
            # 409 means this exact version is already published.
            case "$code" in 201|409) ;; *) echo "Upload of $1 failed with HTTP $code" >&2; exit 1 ;; esac
          }
          for deb in electron/release/*.deb; do
            upload "$deb" "$api/debian/pool/$channel/main/upload"
          done
          for rpm in electron/release/*.rpm; do
            upload "$rpm" "$api/rpm/$channel/upload?sign=true"
          done
  freebsd:
    name: FreeBSD x86_64 (Electron)
    needs: [setup-release, build-web]
    if: ${{ needs.setup-release.outputs.nightly != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.setup-release.outputs.version }}
      TAG: ${{ needs.setup-release.outputs.tag }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: stable
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download web assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-assets
      - name: Build, bundle and upload
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: '15'
          mem: 12288
          cpu: 4
          copyback: false
          envs: 'VERSION TAG VITE_APP_VERSION SABLE_BUILD_FLAVOR ELECTRON_SKIP_BINARY_DOWNLOAD FORGEJO_URL FORGEJO_REPOSITORY FORGEJO_TOKEN CARGO_INCREMENTAL CARGO_TERM_COLOR'
          prepare: |
            pkg install -y electron45 node24 npm-node24 perl5 rustup-init
            rustup-init -y --profile minimal --default-toolchain none
          run: |
            set -e
            . "$HOME/.cargo/env"
            npm install -g "$(node -p "require('./package.json').packageManager")"
            pnpm install --frozen-lockfile --ignore-scripts
            electron_version="$(pkg query %v electron45 | sed 's/_.*//')"
            node electron/package.mjs --linux dir \
              -c.electronDist=/usr/local/share/electron45 \
              -c.electronVersion="$electron_version"
            out="electron/release/sable-$VERSION"
            mkdir "$out"
            cp -R electron/release/linux*-unpacked/resources "$out/resources"
            rm -f "$out/resources/default_app.asar"
            # installMethod() reads this as a distribution package, which owns the desktop entry.
            echo freebsd > "$out/resources/package-type"
            install -m 755 packaging/freebsd/sable.sh "$out/sable"
            tarball="electron/release/sable-$VERSION-freebsd-x64.tar.gz"
            tar -czf "$tarball" -C electron/release "sable-$VERSION"
            node scripts/ci/forgejo-release.mjs upload "$tarball"
  flatpak-manifest:
    name: Render the nightly Flatpak manifest
    needs: [setup-release, electron]
    if: ${{ needs.setup-release.outputs.nightly == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Set up app
        uses: ./.github/actions/setup
        with:
          install-mise-tools: 'false'
      # extra-data installs download this exact file, so hash the published copy.
      - name: Render the manifest from the published tarball
        run: |
          tarball="sable-$VERSION-x64.tar.gz"
          mkdir tarball
          node scripts/ci/forgejo-release.mjs download --pattern "$tarball" --dir tarball
          node scripts/ci/render-flatpak-nightly.mjs "$VERSION" "$TAG" \
            "$(sha256sum "tarball/$tarball" | cut -d' ' -f1):$(stat -c %s "tarball/$tarball")" -
      - name: Upload the rendered manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-manifest
          path: |
            packaging/flatpak/electron/nightly/moe.sable.next.electron.Nightly.yml
            packaging/flatpak/electron/nightly/moe.sable.next.electron.Nightly.metainfo.xml
          if-no-files-found: error
          retention-days: 1
  flatpak:
    name: Build the nightly Flatpak repo
    needs: [setup-release, flatpak-manifest]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08@sha256:6ed6921bb5a9e1a916989971844f159b854b7b225880c381fa34f7a158863039
      options: --privileged
    env:
      VERSION: ${{ needs.setup-release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download the rendered manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-manifest
          path: packaging/flatpak/electron/nightly
      - name: Import the signing key
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          mkdir site
          printf '%s\n' "$FLATPAK_GPG_KEY" | gpg --batch --import
      - name: Copy the preinstalled runtimes into the writable layer
        run: |
          cp -a /var/lib/flatpak /var/lib/flatpak.rw
          rm -rf /var/lib/flatpak
          mv /var/lib/flatpak.rw /var/lib/flatpak
      - name: Build and sign the Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/electron/nightly/moe.sable.next.electron.Nightly.yml
          repo-dir: site/repo
          build-bundle: 'false'
          upload-artifact: 'false'
          gpg-sign: ${{ secrets.FLATPAK_GPG_KEY_ID }}
      - name: Sign the repo summary and write the landing page
        env:
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          flatpak build-update-repo \
            --title='Sable Nightly' \
            --default-branch=master \
            --gpg-sign="$FLATPAK_GPG_KEY_ID" \
            site/repo

          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY##*/}"
          base="https://$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]').github.io/$name"
          gpgkey="$(gpg --export "$FLATPAK_GPG_KEY_ID" | base64 -w0)"

          sed -e "s|@REPO_URL@|$base/repo/|" -e "s|@GPGKEY@|$gpgkey|" \
            packaging/flatpak/nightly/sable-next-nightly.flatpakrepo.in \
            > site/sable-next-nightly.flatpakrepo

          sed -e "s|@BASE_URL@|$base|g" -e "s|@VERSION@|$VERSION|g" \
            packaging/flatpak/nightly/index.html.in > site/index.html
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  flatpak-deploy:
    name: Deploy the nightly Flatpak repo
    needs: flatpak
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Queue rather than cancel so the newest nightly is always deployed last.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  handoff:
    name: Publish handoff manifest
    needs: [setup-release, electron, freebsd]
    # Waits for the FreeBSD bundle so the checksums cover it, without failing on it.
    if: ${{ !cancelled() && needs.electron.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Build and upload handoff manifest
        run: |
          jq -n --arg version "$VERSION" '{version: $version}' > github-bundles.json
          node scripts/ci/forgejo-release.mjs upload github-bundles.json
