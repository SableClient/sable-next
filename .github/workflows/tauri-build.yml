name: Build apps
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach bundles to (e.g. v1.2.3). Empty builds a nightly from HEAD.'
        required: false
        type: string
permissions: {}
concurrency:
  group: tauri-build-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
jobs:
  setup-release:
    name: Resolve release target
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
      nightly: ${{ steps.meta.outputs.nightly }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release meta
        id: meta
        uses: ./.github/actions/resolve-release-meta
        with:
          input-tag: ${{ inputs.tag }}
      - name: Wait for release to exist
        if: ${{ steps.meta.outputs.nightly != 'true' }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          for i in $(seq 1 12); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG found."
              exit 0
            fi
            echo "Waiting for release $TAG to be published ($i/12)…"
            sleep 15
          done
          echo "Release $TAG was not found." >&2
          exit 1
      - name: Ensure nightly prerelease exists
        if: ${{ steps.meta.outputs.nightly == 'true' }}
        env:
          SHA: ${{ github.sha }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            echo 'Reusing the existing nightly release while the new build is prepared.'
          else
            gh release create nightly --prerelease --target "$SHA" --title 'Nightly (main)' \
              --notes "Rolling nightly build from main at $SHA"
          fi
  build-web:
    name: Build web assets
    needs: setup-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Absent on forks, which builds an app with error reporting switched off.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      UPDATER_ENDPOINT: ${{ needs.setup-release.outputs.nightly == 'true' && format('https://github.com/{0}/releases/download/nightly/latest.json', github.repository) || '' }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Set up app and build
        uses: ./.github/actions/setup
        with:
          build: 'true'
      - name: Upload web assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-assets
          path: |
            .svelte-kit/output
            dist
            src/generated/wasm
          if-no-files-found: error
          retention-days: 7
  desktop:
    name: ${{ matrix.name }}
    needs: [setup-release, build-web]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            runner: macos-latest
            asset-platform: macos-universal
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
            version-args: ''
            bundle-path: target/universal-apple-darwin/release/bundle
          - name: Windows x86_64
            runner: windows-latest
            asset-platform: windows-x86_64
            rust-targets: ''
            tauri-args: ''
            version-args: --msi
            bundle-path: target/release/bundle
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      VERSION_ARGS: ${{ matrix.version-args }}
      # Read by src-tauri/build.rs, which bakes them into the binary.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      IS_NIGHTLY: ${{ needs.setup-release.outputs.nightly }}
      UPDATER_ENDPOINT: ${{ needs.setup-release.outputs.nightly == 'true' && format('https://github.com/{0}/releases/download/nightly/latest.json', github.repository) || '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
      - name: Set up app
        uses: ./.github/actions/setup
        with:
          build: 'false'
          install-mise-tools: 'false'
      - name: Add Rust targets
        if: ${{ matrix.rust-targets != '' }}
        shell: bash
        run: rustup target add ${{ matrix.rust-targets }}
      - name: Stamp release version into tauri.conf.json
        shell: bash
        run: |
          args="$VERSION_ARGS"
          [ -n "$UPDATER_ENDPOINT" ] && args="$args --updater-endpoint=$UPDATER_ENDPOINT"
          node .github/scripts/set-tauri-version.mjs "$VERSION" $args
      - name: Build desktop bundle
        shell: bash
        run: |
          config_args=(--config src-tauri/tauri.ci.conf.json)
          [ "$IS_NIGHTLY" = 'true' ] && config_args+=(--config src-tauri/tauri.nightly.conf.json)
          # Bundling an updater artifact without a key is a hard error.
          [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ] \
            && config_args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          pnpm tauri build "${config_args[@]}" ${{ matrix.tauri-args }}
      - name: Normalize bundle names
        shell: bash
        env:
          ASSET_PLATFORM: ${{ matrix.asset-platform }}
          BUNDLE_PATH: ${{ matrix.bundle-path }}
        run: |
          test -d "$BUNDLE_PATH" || { echo "Bundle directory not found: $BUNDLE_PATH" >&2; exit 1; }
          find "$BUNDLE_PATH" -type f -print0 \
            | while IFS= read -r -d '' path; do
                case "$path" in
                  *.app.tar.gz.sig) suffix='.app.tar.gz.sig' ;;
                  *.app.tar.gz) suffix='.app.tar.gz' ;;
                  *-setup.exe.sig) suffix='-setup.exe.sig' ;;
                  *-setup.exe) suffix='-setup.exe' ;;
                  *.msi.sig) suffix='.msi.sig' ;;
                  *.msi) suffix='.msi' ;;
                  *.AppImage.sig) suffix='.AppImage.sig' ;;
                  *.AppImage) suffix='.AppImage' ;;
                  *.dmg) suffix='.dmg' ;;
                  *.deb) suffix='.deb' ;;
                  *.rpm) suffix='.rpm' ;;
                  *) continue ;;
                esac
                target="$(dirname "$path")/sable-next-${VERSION}-${ASSET_PLATFORM}${suffix}"
                [ "$path" = "$target" ] || mv "$path" "$target"
              done
          find "$BUNDLE_PATH" -type f -name 'sable-next-*' -print0 > bundles
          test -s bundles || { echo "No desktop bundles found in $BUNDLE_PATH" >&2; exit 1; }
      - name: Attest desktop bundles
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.bundle-path }}/*/sable-next-*
      - name: Attach desktop bundles to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r -d '' bundle; do
            echo "Uploading $bundle"
            gh release upload "$TAG" "$bundle" --clobber
          done < bundles
  linux:
    name: Linux ${{ matrix.arch }} (CEF)
    needs: [setup-release, build-web]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      MISE_DISABLE_TOOLS: aqua:WebAssembly/binaryen,cargo:wasm-bindgen-cli
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      # Read by src-tauri/build.rs, which bakes them into the binary.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      IS_NIGHTLY: ${{ needs.setup-release.outputs.nightly }}
      UPDATER_ENDPOINT: ${{ needs.setup-release.outputs.nightly == 'true' && format('https://github.com/{0}/releases/download/nightly/latest.json', github.repository) || '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
      # tauri-runtime depends on webkit2gtk on Linux whatever the runtime, so
      # the headers stay even though nothing renders through it. --as-needed
      # keeps it out of the binary, hence no runtime dep in nfpm.yaml.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            file \
            libayatana-appindicator3-1 \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config
      - name: Set up app
        uses: ./.github/actions/setup
        with:
          build: 'false'
          install-mise-tools: 'false'
      - name: Stamp release version into tauri.conf.json
        run: |
          args=''
          [ -n "$UPDATER_ENDPOINT" ] && args="--updater-endpoint=$UPDATER_ENDPOINT"
          node .github/scripts/set-tauri-version.mjs "$VERSION" $args
      # `tauri:cef build` stops at the binary; the bundler cannot carry the
      # Chromium runtime, so cef:package assembles the packages around it.
      - name: Build and package the CEF bundles
        run: |
          config_args=(--config src-tauri/tauri.ci.conf.json)
          display_name='Sable Next'
          if [ "$IS_NIGHTLY" = 'true' ]; then
            config_args+=(--config src-tauri/tauri.nightly.conf.json)
            display_name='Sable Next Nightly'
          fi
          pnpm tauri:cef build "${config_args[@]}"
          mise run cef:package "$VERSION" "$display_name"
      - name: Check the packages carry what they should
        run: |
          deb="target/release/bundle/deb/sable-next-${VERSION}-linux-${ARCH}.deb"
          dpkg-deb --contents "$deb" | grep -q 'etc/apparmor.d/sable-next$'
          dpkg-deb --ctrl-tarfile "$deb" | tar -t | grep -qx './postinst'
          dpkg-deb --ctrl-tarfile "$deb" | tar -t | grep -qx './prerm'
          dpkg-deb --contents "$deb" | grep -q 'opt/sable-next/CEF-LICENSE.txt$'
      - name: Sign the AppImage for the updater
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: pnpm tauri signer sign "target/release/bundle/appimage/sable-next-${VERSION}-linux-${ARCH}.AppImage"
      - name: Attest Linux bundles
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/release/bundle/deb/sable-next-*.deb
            target/release/bundle/rpm/sable-next-*.rpm
            target/release/bundle/appimage/sable-next-*.AppImage
      - name: Attach Linux bundles to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for bundle in "target/release/bundle/deb/sable-next-${VERSION}-linux-${ARCH}.deb" \
                        "target/release/bundle/rpm/sable-next-${VERSION}-linux-${ARCH}.rpm" \
                        "target/release/bundle/appimage/sable-next-${VERSION}-linux-${ARCH}.AppImage" \
                        "target/release/bundle/appimage/sable-next-${VERSION}-linux-${ARCH}.AppImage.sig"; do
            [ -e "$bundle" ] || continue
            echo "Uploading $bundle"
            gh release upload "$TAG" "$bundle" --clobber
          done
  android:
    name: Build Android
    needs: [setup-release, build-web]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      MISE_ENV: tauri
      # Matches the ABIs passed to `tauri android build` below.
      RUST_TARGETS: aarch64-linux-android armv7-linux-androideabi
      # Read by src-tauri/build.rs, which bakes them into the binary.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      IS_NIGHTLY: ${{ needs.setup-release.outputs.nightly }}
      UPDATER_ENDPOINT: ${{ needs.setup-release.outputs.nightly == 'true' && format('https://github.com/{0}/releases/download/nightly/latest.json', github.repository) || '' }}
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
      - name: Set up app
        uses: ./.github/actions/setup
        with:
          build: 'false'
          install-mise-tools: 'false'
      - name: Set up Android SDK and NDK
        run: mise run tauri:setup:android
      - name: Add Rust targets
        run: |
          # shellcheck disable=SC2086 # RUST_TARGETS is a space-separated list.
          rustup target add $RUST_TARGETS
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
      - name: Stamp release version into tauri.conf.json
        run: |
          args=''
          [ -n "$UPDATER_ENDPOINT" ] && args="--updater-endpoint=$UPDATER_ENDPOINT"
          node .github/scripts/set-tauri-version.mjs "$VERSION" $args
      - name: Prepare nightly Android package
        if: ${{ needs.setup-release.outputs.nightly == 'true' }}
        run: |
          app_dir=src-tauri/gen/android/app
          build_src_dir=src-tauri/gen/android/buildSrc
          nightly_package_dir=moe/sable/next/nightly
          nightly_source_dir="$RUNNER_TEMP/android-nightly-package"

          # Tauri resolves sources from the active identifier's package path.
          mkdir -p "$nightly_source_dir"
          cp -a "$app_dir/src/main/java/moe/sable/next" "$nightly_source_dir/app"
          cp -a "$build_src_dir/src/main/java/moe/sable/next" "$nightly_source_dir/buildSrc"
          find "$nightly_source_dir" -type f -exec sed -i \
            's/moe\.sable\.next/moe.sable.next.nightly/g' {} +
          rm -rf "$app_dir/src/main/java/moe/sable/next" "$build_src_dir/src/main/java/moe/sable/next"
          mkdir -p "$app_dir/src/main/java/moe/sable/next" "$build_src_dir/src/main/java/moe/sable/next"
          mv "$nightly_source_dir/app" "$app_dir/src/main/java/$nightly_package_dir"
          mv "$nightly_source_dir/buildSrc" "$build_src_dir/src/main/java/$nightly_package_dir"
          sed -i 's/moe\.sable\.next/moe.sable.next.nightly/g' \
            "$app_dir/build.gradle.kts" "$app_dir/src/main/AndroidManifest.xml"
          sed -i \
            -e 's/Java_moe_sable_next_MainActivity/Java_moe_sable_next_nightly_MainActivity/g' \
            -e 's#moe/sable/next/MainActivity#moe/sable/next/nightly/MainActivity#g' \
            src-tauri/src/mobile.rs
      - name: Set up Android signing
        if: ${{ env.ANDROID_KEY_BASE64 != '' }}
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=$ANDROID_KEY_ALIAS" > keystore.properties
          echo "password=$ANDROID_KEY_PASSWORD" >> keystore.properties
          base64 -d <<< "$ANDROID_KEY_BASE64" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
      - name: Build Android bundles
        run: |
          config_args=(--config src-tauri/tauri.ci.conf.json)
          [ "$IS_NIGHTLY" = 'true' ] && config_args+=(--config src-tauri/tauri.nightly.conf.json)
          pnpm tauri android build "${config_args[@]}" --apk --aab --target aarch64 armv7
          out='src-tauri/gen/android/app/build/outputs'
          apk="$(find "$out/apk/universal/release" -name '*.apk' -type f | head -n 1)"
          aab="$(find "$out/bundle/universalRelease" -name '*.aab' -type f | head -n 1)"
          [ -n "$apk" ] || { echo 'APK not found' >&2; exit 1; }
          [ -n "$aab" ] || { echo 'AAB not found' >&2; exit 1; }
          mv "$apk" "$(dirname "$apk")/sable-next-${VERSION}-android-universal.apk"
          mv "$aab" "$(dirname "$aab")/sable-next-${VERSION}-android-universal.aab"
      - name: Verify the APK is signed
        if: ${{ env.ANDROID_KEY_BASE64 != '' }}
        run: |
          apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/sable-next-${VERSION}-android-universal.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n 1)"
          [ -n "$apksigner" ] || { echo 'apksigner not found' >&2; exit 1; }
          "$apksigner" verify --print-certs "$apk"
      - name: Attest Android bundles
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            src-tauri/gen/android/app/build/outputs/apk/**/sable-next-*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/sable-next-*.aab
      - name: Attach Android bundles to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find src-tauri/gen/android/app/build/outputs -type f -name 'sable-next-*' \
            \( -name '*.apk' -o -name '*.aab' \) -print0 > bundles
          test -s bundles || { echo 'No Android bundles found' >&2; exit 1; }
          while IFS= read -r -d '' bundle; do
            echo "Uploading $bundle"
            gh release upload "$TAG" "$bundle" --clobber
          done < bundles
  ios:
    name: Build iOS
    needs: [setup-release, build-web]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      ipa_name: ${{ steps.ipa.outputs.name }}
      ipa_size: ${{ steps.ipa.outputs.size }}
      ipa_version: ${{ steps.ipa.outputs.version }}
      ipa_build: ${{ steps.ipa.outputs.build }}
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      IS_NIGHTLY: ${{ needs.setup-release.outputs.nightly }}
      RUST_TARGETS: aarch64-apple-ios
      # Read by src-tauri/build.rs, which bakes them into the binary.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
      - name: Set up app
        uses: ./.github/actions/setup
        with:
          build: 'false'
          install-mise-tools: 'false'
      - name: Set up iOS project
        run: |
          brew install cocoapods
          config_args=()
          [ "$IS_NIGHTLY" = 'true' ] && config_args+=(--config src-tauri/tauri.nightly.conf.json)
          pnpm tauri ios init --ci "${config_args[@]}"
      - name: Download iOS frameworks
        run: pnpm ios:frameworks
      - name: Add Rust target
        run: |
          # shellcheck disable=SC2086 # RUST_TARGETS is a space-separated list.
          rustup target add $RUST_TARGETS
      # CFBundleShortVersionString rejects the -nightly suffix, so nightly
      # builds fold their timestamp into the patch component instead.
      - name: Stamp release version into tauri.conf.json
        run: |
          if [ "$IS_NIGHTLY" = 'true' ]; then
            node .github/scripts/set-tauri-version.mjs "$VERSION" --apple-short-version
          else
            node .github/scripts/set-tauri-version.mjs "$VERSION"
          fi
      - name: Build unsigned iOS bundle
        id: ipa
        run: |
          config_args=(--config src-tauri/tauri.ci.conf.json)
          [ "$IS_NIGHTLY" = 'true' ] && config_args+=(--config src-tauri/tauri.nightly.conf.json)
          pnpm tauri ios build "${config_args[@]}" --no-sign --ci
          ipa="$(find src-tauri/gen/apple/build -type f -name '*.ipa' | head -n 1)"
          [ -n "$ipa" ] || { echo 'No iOS IPA found' >&2; exit 1; }
          target="$(dirname "$ipa")/sable-next-${VERSION}-ios-arm64.ipa"
          [ "$ipa" = "$target" ] || mv "$ipa" "$target"

          unzip -p "$target" 'Payload/*.app/Info.plist' > Info.plist
          short_version="$(plutil -extract CFBundleShortVersionString raw -o - Info.plist)"
          bundle_version="$(plutil -extract CFBundleVersion raw -o - Info.plist)"

          {
            echo "path=$target"
            echo "name=$(basename "$target")"
            echo "size=$(stat -f%z "$target")"
            echo "version=$short_version"
            echo "build=$bundle_version"
          } >> "$GITHUB_OUTPUT"
      - name: Attest iOS bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.ipa.outputs.path }}
      - name: Attach iOS bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: gh release upload "$TAG" "$IPA_PATH" --clobber
  obtainium:
    name: Publish Obtainium config
    needs: [setup-release, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Generate obtainium.json
        run: node .github/scripts/obtainium-generate.mjs "$VERSION" "$TAG" obtainium.json
      - name: Attach Obtainium config to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" obtainium.json --clobber
  altstore:
    name: Publish AltStore source
    needs: [setup-release, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      IS_NIGHTLY: ${{ needs.setup-release.outputs.nightly }}
      IPA_NAME: ${{ needs.ios.outputs.ipa_name }}
      IPA_SIZE: ${{ needs.ios.outputs.ipa_size }}
      IPA_VERSION: ${{ needs.ios.outputs.ipa_version }}
      IPA_BUILD: ${{ needs.ios.outputs.ipa_build }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      # One asset name for both channels keeps the subscribed URL stable:
      # releases/latest/download for stable, the rolling tag for nightly.
      - name: Build AltStore source
        run: |
          if [ "$IS_NIGHTLY" = 'true' ]; then
            # Older entries would 404 once finalize-nightly prunes their IPAs.
            export ALTSTORE_MAX_VERSIONS=1
            cp .github/templates/altstore-source-nightly.json altstore-source.json
          else
            previous="$(
              gh release list --limit 100 --exclude-pre-releases --json tagName --jq '.[].tagName' \
                | while read -r candidate; do
                    if [ "$candidate" != "$TAG" ] &&
                       gh release view "$candidate" --json assets --jq '.assets[].name' \
                         | grep -qxF altstore-source.json; then
                      echo "$candidate"
                      break
                    fi
                  done
            )"
            if [ -n "$previous" ]; then
              echo "Carrying versions forward from $previous."
              gh release download "$previous" --pattern altstore-source.json --output altstore-source.json
            else
              cp .github/templates/altstore-source.json altstore-source.json
            fi
          fi

          node .github/scripts/update-altstore-source.mjs \
            altstore-source.json \
            "$IPA_VERSION" \
            "$IPA_BUILD" \
            "$IPA_SIZE" \
            "https://github.com/${REPOSITORY}/releases/download/${TAG}/${IPA_NAME}" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "Sable Next $VERSION"
      - name: Attach AltStore source to release
        run: gh release upload "$TAG" altstore-source.json --clobber
  finalize-nightly:
    name: Finalize nightly release
    needs: [setup-release, desktop, linux, android, ios, obtainium, altstore]
    # The prune only removes what this run replaced, so a failed platform
    # cannot strand the release on the previous run's bundles.
    if: ${{ always() && needs.setup-release.result == 'success' && needs.setup-release.outputs.nightly == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SHA: ${{ github.sha }}
      VERSION: ${{ needs.setup-release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What remains after stripping this run's version names the platform:
      # `linux-x86_64.deb`, `android-universal.apk`.
      - name: Collect the bundles this run produced
        id: fresh
        run: |
          gh release view nightly --repo "$REPOSITORY" --json assets \
            | jq -r --arg prefix "sable-next-$VERSION-" \
                '.assets[].name | select(startswith($prefix)) | ltrimstr($prefix)' \
            | sort -u > fresh
          echo 'This run produced:'
          cat fresh
          if [ -s fresh ]; then echo 'any=true' >> "$GITHUB_OUTPUT"; fi
      - name: Update nightly tag
        if: ${{ steps.fresh.outputs.any == 'true' }}
        run: |
          gh api --method PATCH "repos/$REPOSITORY/git/refs/tags/nightly" \
            -f sha="$SHA" -F force=true
          gh release edit nightly --repo "$REPOSITORY" --prerelease --target "$SHA" --title 'Nightly (main)' \
            --notes "Rolling nightly build $VERSION from main at $SHA"
      # Stamped names never clobber, so they accumulate and Obtainium starts
      # offering a stale APK. The .json manifests clobber in place.
      - name: Remove superseded nightly assets
        run: |
          gh release view nightly --repo "$REPOSITORY" --json assets \
            | jq -r --arg prefix "sable-next-$VERSION-" \
                '.assets[].name | select((startswith($prefix) or endswith(".json")) | not)' \
            | while read -r name; do
                while read -r suffix; do
                  case "$name" in
                    *-"$suffix")
                      echo "Removing superseded nightly asset: $name"
                      gh release delete-asset nightly "$name" --repo "$REPOSITORY" --yes
                      break
                      ;;
                  esac
                done < fresh
              done
  updater-manifest:
    name: Publish updater manifest
    needs: [setup-release, desktop, linux, android, ios]
    if: ${{ always() && needs.setup-release.result == 'success' && needs.desktop.result == 'success' && needs.linux.result == 'success' && needs.android.result == 'success' && needs.ios.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Build updater manifest
        run: node .github/scripts/build-updater-manifest.mjs
      - name: Upload updater manifest
        if: ${{ hashFiles('latest.json') != '' }}
        run: gh release upload "$TAG" latest.json --clobber
