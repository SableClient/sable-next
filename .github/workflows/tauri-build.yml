name: Build Apple, Windows and Linux aarch64 apps
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach bundles to (e.g. v1.2.3). Empty builds a nightly from HEAD.'
        required: false
        type: string
permissions: {}
concurrency:
  group: tauri-build-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  FORGEJO_URL: https://git.sable.moe
  FORGEJO_REPOSITORY: SableClient/sable-next
  FORGEJO_TOKEN: ${{ secrets.FORGEJO_RELEASE_TOKEN }}
jobs:
  setup-release:
    name: Resolve release target
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
      nightly: ${{ steps.meta.outputs.nightly }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release meta
        id: meta
        uses: ./.github/actions/resolve-release-meta
        with:
          input-tag: ${{ inputs.tag }}
      - name: Wait for release to exist
        if: ${{ steps.meta.outputs.nightly != 'true' }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: node scripts/ci/forgejo-release.mjs wait --attempts 60 --interval 15
      - name: Create nightly prerelease
        if: ${{ steps.meta.outputs.nightly == 'true' }}
        env:
          SHA: ${{ github.sha }}
        run: |
          node scripts/ci/forgejo-release.mjs ensure \
            --tag "${{ steps.meta.outputs.tag }}" \
            --sha "$SHA" \
            --prerelease true \
            --title "Nightly build ${{ steps.meta.outputs.version }}" \
            --notes "Nightly build from main at $SHA"
  build-web:
    name: Build web assets
    needs: setup-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Absent on forks, which builds an app with error reporting switched off.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      UPDATER_ENDPOINT: ${{ needs.setup-release.outputs.nightly == 'true' && 'https://git.sable.moe/SableClient/sable-next/releases/download/nightly/latest.json' || '' }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Set up app and build
        uses: ./.github/actions/setup
        with:
          build: 'true'
      - name: Upload web assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-assets
          path: |
            .svelte-kit/output
            dist
            src/generated/wasm
          if-no-files-found: error
          retention-days: 7
  desktop:
    name: ${{ matrix.name }}
    needs: [setup-release, build-web]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            runner: macos-latest
            asset-platform: macos-universal
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
            version-args: ''
            bundle-path: target/universal-apple-darwin/release/bundle
          - name: Windows x86_64
            runner: windows-latest
            asset-platform: windows-x86_64
            rust-targets: ''
            tauri-args: ''
            version-args: --msi
            bundle-path: target/release/bundle
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      VERSION_ARGS: ${{ matrix.version-args }}
      # Read by src-tauri/build.rs, which bakes them into the binary.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      IS_NIGHTLY: ${{ needs.setup-release.outputs.nightly }}
      UPDATER_ENDPOINT: ${{ needs.setup-release.outputs.nightly == 'true' && 'https://git.sable.moe/SableClient/sable-next/releases/download/nightly/latest.json' || '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
      - name: Set up app
        uses: ./.github/actions/setup
        with:
          rust: 'true'
          rust-cache-key: tauri-desktop
          install-mise-tools: 'false'
      - name: Add Rust targets
        if: ${{ matrix.rust-targets != '' }}
        shell: bash
        run: rustup target add ${{ matrix.rust-targets }}
      - name: Stamp release version into tauri.conf.json
        shell: bash
        run: |
          args="$VERSION_ARGS"
          [ -n "$UPDATER_ENDPOINT" ] && args="$args --updater-endpoint=$UPDATER_ENDPOINT"
          node scripts/ci/set-tauri-version.mjs "$VERSION" $args
      - name: Build desktop bundle
        shell: bash
        run: |
          config_args=(--config src-tauri/tauri.ci.conf.json)
          [ "$IS_NIGHTLY" = 'true' ] && config_args+=(--config src-tauri/tauri.nightly.conf.json)
          # Bundling an updater artifact without a key is a hard error.
          [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ] \
            && config_args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          pnpm tauri build "${config_args[@]}" ${{ matrix.tauri-args }}
      - name: Normalize bundle names
        shell: bash
        env:
          ASSET_PLATFORM: ${{ matrix.asset-platform }}
          BUNDLE_PATH: ${{ matrix.bundle-path }}
        run: |
          test -d "$BUNDLE_PATH" || { echo "Bundle directory not found: $BUNDLE_PATH" >&2; exit 1; }
          find "$BUNDLE_PATH" -type f -print0 \
            | while IFS= read -r -d '' path; do
                case "$path" in
                  *.app.tar.gz.sig) suffix='.app.tar.gz.sig' ;;
                  *.app.tar.gz) suffix='.app.tar.gz' ;;
                  *-setup.exe.sig) suffix='-setup.exe.sig' ;;
                  *-setup.exe) suffix='-setup.exe' ;;
                  *.msi.sig) suffix='.msi.sig' ;;
                  *.msi) suffix='.msi' ;;
                  *.dmg) suffix='.dmg' ;;
                  *) continue ;;
                esac
                target="$(dirname "$path")/sable-next-${VERSION}-${ASSET_PLATFORM}${suffix}"
                [ "$path" = "$target" ] || mv "$path" "$target"
              done
          find "$BUNDLE_PATH" -type f -name 'sable-next-*' > bundles
          test -s bundles || { echo "No desktop bundles found in $BUNDLE_PATH" >&2; exit 1; }
      - name: Attest desktop bundles
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.bundle-path }}/*/sable-next-*
      - name: Attach desktop bundles to release
        shell: bash
        run: |
          bundles=()
          while IFS= read -r bundle; do bundles+=("$bundle"); done < bundles
          node scripts/ci/forgejo-release.mjs upload "${bundles[@]}"
  ios:
    name: Build iOS
    needs: [setup-release, build-web]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      ipa_name: ${{ steps.ipa.outputs.name }}
      ipa_size: ${{ steps.ipa.outputs.size }}
      ipa_version: ${{ steps.ipa.outputs.version }}
      ipa_build: ${{ steps.ipa.outputs.build }}
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      IS_NIGHTLY: ${{ needs.setup-release.outputs.nightly }}
      RUST_TARGETS: aarch64-apple-ios
      # Read by src-tauri/build.rs, which bakes them into the binary.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
      - name: Set up app
        uses: ./.github/actions/setup
        with:
          rust: 'true'
          rust-cache-key: tauri-ios
          install-mise-tools: 'false'
      - name: Set up iOS project
        run: |
          brew install cocoapods
          config_args=()
          [ "$IS_NIGHTLY" = 'true' ] && config_args+=(--config src-tauri/tauri.nightly.conf.json)
          pnpm tauri ios init --ci "${config_args[@]}"
      - name: Download iOS frameworks
        run: pnpm ios:frameworks
      - name: Add Rust target
        run: |
          # shellcheck disable=SC2086 # RUST_TARGETS is a space-separated list.
          rustup target add $RUST_TARGETS
      # CFBundleShortVersionString rejects the -nightly suffix, so nightly
      # builds fold their timestamp into the patch component instead.
      - name: Stamp release version into tauri.conf.json
        run: |
          if [ "$IS_NIGHTLY" = 'true' ]; then
            node scripts/ci/set-tauri-version.mjs "$VERSION" --apple-short-version
          else
            node scripts/ci/set-tauri-version.mjs "$VERSION"
          fi
      - name: Build unsigned iOS bundle
        id: ipa
        run: |
          config_args=(--config src-tauri/tauri.ci.conf.json)
          [ "$IS_NIGHTLY" = 'true' ] && config_args+=(--config src-tauri/tauri.nightly.conf.json)
          pnpm tauri ios build "${config_args[@]}" --no-sign --ci
          ipa="$(find src-tauri/gen/apple/build -type f -name '*.ipa' | head -n 1)"
          [ -n "$ipa" ] || { echo 'No iOS IPA found' >&2; exit 1; }
          target="$(dirname "$ipa")/sable-next-${VERSION}-ios-arm64.ipa"
          [ "$ipa" = "$target" ] || mv "$ipa" "$target"

          unzip -p "$target" 'Payload/*.app/Info.plist' > Info.plist
          short_version="$(plutil -extract CFBundleShortVersionString raw -o - Info.plist)"
          bundle_version="$(plutil -extract CFBundleVersion raw -o - Info.plist)"

          {
            echo "path=$target"
            echo "name=$(basename "$target")"
            echo "size=$(stat -f%z "$target")"
            echo "version=$short_version"
            echo "build=$bundle_version"
          } >> "$GITHUB_OUTPUT"
      - name: Attest iOS bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.ipa.outputs.path }}
      - name: Attach iOS bundle to release
        env:
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: node scripts/ci/forgejo-release.mjs upload "$IPA_PATH"
  linux:
    name: Linux aarch64 (CEF)
    needs: [setup-release, build-web]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      ARCH: aarch64
      MISE_DISABLE_TOOLS: aqua:WebAssembly/binaryen,ubi:rustwasm/wasm-bindgen
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      # Read by src-tauri/build.rs, which bakes them into the binary.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: ${{ needs.setup-release.outputs.nightly == 'true' && 'preview' || 'production' }}
      VITE_APP_VERSION: ${{ needs.setup-release.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.setup-release.outputs.nightly == 'true' && 'nightly' || 'stable' }}
      IS_NIGHTLY: ${{ needs.setup-release.outputs.nightly }}
      UPDATER_ENDPOINT: ${{ needs.setup-release.outputs.nightly == 'true' && 'https://git.sable.moe/SableClient/sable-next/releases/download/nightly/latest.json' || '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
      # tauri-runtime depends on webkit2gtk on Linux whatever the runtime, so
      # the headers stay even though nothing renders through it. --as-needed
      # keeps it out of the binary, hence no runtime dep in nfpm.yaml.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            file \
            libayatana-appindicator3-1 \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config
      - name: Set up app
        uses: ./.github/actions/setup
        with:
          rust: 'true'
          rust-cache-key: tauri-linux
          install-mise-tools: 'false'
      - name: Stamp release version into tauri.conf.json
        run: |
          args=''
          [ -n "$UPDATER_ENDPOINT" ] && args="--updater-endpoint=$UPDATER_ENDPOINT"
          node scripts/ci/set-tauri-version.mjs "$VERSION" $args
      # `tauri:cef build` stops at the binary; the bundler cannot carry the
      # Chromium runtime, so cef:package assembles the packages around it.
      - name: Build and package the CEF bundles
        run: |
          config_args=(--config src-tauri/tauri.ci.conf.json)
          display_name='Sable Next'
          if [ "$IS_NIGHTLY" = 'true' ]; then
            config_args+=(--config src-tauri/tauri.nightly.conf.json)
            display_name='Sable Next Nightly'
          fi
          pnpm tauri:cef build "${config_args[@]}"
          mise run cef:package "$VERSION" "$display_name"
      - name: Check the packages carry what they should
        run: |
          deb="target/release/bundle/deb/sable-next-${VERSION}-linux-${ARCH}.deb"
          dpkg-deb --contents "$deb" | grep -q 'etc/apparmor.d/sable-next$'
          dpkg-deb --ctrl-tarfile "$deb" | tar -t | grep -qx './postinst'
          dpkg-deb --ctrl-tarfile "$deb" | tar -t | grep -qx './prerm'
          dpkg-deb --contents "$deb" | grep -q 'opt/sable-next/CEF-LICENSE.txt$'
      - name: Sign the AppImage for the updater
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: pnpm tauri signer sign "target/release/bundle/appimage/sable-next-${VERSION}-linux-${ARCH}.AppImage"
      - name: Attest Linux bundles
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/release/bundle/deb/sable-next-*.deb
            target/release/bundle/rpm/sable-next-*.rpm
            target/release/bundle/sable-next-*.tar.gz
            target/release/bundle/appimage/sable-next-*.AppImage
      - name: Attach Linux bundles to release
        run: |
          bundles=()
          for bundle in "target/release/bundle/deb/sable-next-${VERSION}-linux-${ARCH}.deb" \
                        "target/release/bundle/rpm/sable-next-${VERSION}-linux-${ARCH}.rpm" \
                        "target/release/bundle/sable-next-${VERSION}-linux-${ARCH}.tar.gz" \
                        "target/release/bundle/appimage/sable-next-${VERSION}-linux-${ARCH}.AppImage" \
                        "target/release/bundle/appimage/sable-next-${VERSION}-linux-${ARCH}.AppImage.sig"; do
            [ -e "$bundle" ] && bundles+=("$bundle")
          done
          node scripts/ci/forgejo-release.mjs upload "${bundles[@]}"
  build-nightly-flatpak:
    name: Build nightly Flatpak ${{ matrix.arch }}
    needs: [setup-release, linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    if: ${{ needs.setup-release.outputs.nightly == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      ARCH: ${{ matrix.arch }}
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      # x86_64 is built on Forgejo, so its tarball can lag this run or never
      # arrive. That arch is skipped rather than failing the nightly.
      - name: Measure the release tarball
        id: tarball
        shell: bash
        run: |
          tarball="sable-next-${VERSION}-linux-${ARCH}.tar.gz"
          if ! node scripts/ci/forgejo-release.mjs wait-assets \
                 --names "$tarball" --attempts 40 --interval 30; then
            echo "::warning::$tarball never appeared; skipping the $ARCH Flatpak."
            exit 0
          fi
          mkdir -p tarball
          node scripts/ci/forgejo-release.mjs download --pattern "$tarball" --dir tarball
          {
            echo "SHA256=$(sha256sum "tarball/$tarball" | awk '{print $1}')"
            echo "SIZE=$(stat -c %s "tarball/$tarball")"
          } >> "$GITHUB_ENV"
          echo 'built=true' >> "$GITHUB_OUTPUT"
      - name: Install flatpak-builder
        if: ${{ steps.tarball.outputs.built == 'true' }}
        shell: bash
        run: |
          sudo apt-get update
          # elfutils supplies eu-strip, which flatpak-builder needs.
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Render the manifest
        if: ${{ steps.tarball.outputs.built == 'true' }}
        shell: bash
        run: |
          if [ "$ARCH" = 'x86_64' ]; then
            node scripts/ci/render-flatpak-nightly.mjs "$VERSION" "$TAG" "$SHA256:$SIZE" -
          else
            node scripts/ci/render-flatpak-nightly.mjs "$VERSION" "$TAG" - "$SHA256:$SIZE"
          fi
      - name: Build the Flatpak
        if: ${{ steps.tarball.outputs.built == 'true' }}
        shell: bash
        run: |
          # rofiles-fuse is unavailable on hosted runners.
          flatpak-builder \
            --user \
            --install-deps-from=flathub \
            --force-clean \
            --disable-rofiles-fuse \
            --default-branch=master \
            --repo=repo \
            builddir packaging/flatpak/nightly/moe.sable.next.Nightly.yml
      - name: Upload the exported repo
        if: ${{ steps.tarball.outputs.built == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-nightly-repo-${{ matrix.arch }}
          path: repo
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
  publish-nightly-flatpak:
    name: Publish the nightly Flatpak repo
    needs: [setup-release, build-nightly-flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ always() && needs.setup-release.outputs.nightly == 'true' }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Check for the signing key and the built repos
        id: gate
        shell: bash
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${FLATPAK_GPG_KEY:-}" ] || [ -z "${FLATPAK_GPG_KEY_ID:-}" ]; then
            echo "::notice::FLATPAK_GPG_KEY/FLATPAK_GPG_KEY_ID are not set; skipping the Flatpak publish."
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The repo is rebuilt from scratch, so publishing one arch delists the other.
          built="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                     --paginate --jq '.artifacts[].name')"
          for arch in x86_64 aarch64; do
            if ! printf '%s\n' "$built" | grep -qx "flatpak-nightly-repo-$arch"; then
              echo "::notice::No $arch Flatpak repo; skipping the publish."
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          for arch in x86_64 aarch64; do
            url="$FORGEJO_URL/$FORGEJO_REPOSITORY/releases/download/$TAG/sable-next-$VERSION-linux-$arch.tar.gz"
            for attempt in $(seq 20); do
              if curl -fsSLI -o /dev/null "$url"; then
                unset url
                break
              fi
              echo "Waiting for $url ($attempt/20)…"
              sleep 30
            done
            if [ -n "${url:-}" ]; then
              echo "::notice::$url is not public yet; skipping the publish."
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Install flatpak
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree
      - name: Download the exported repos
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: flatpak-nightly-repo-*
          path: arch-repos
      - name: Import the signing key
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$FLATPAK_GPG_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Assemble and sign the repo
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        env:
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          # A fresh repo each night: older commits point at pruned assets.
          mkdir -p site/repo
          ostree --repo=site/repo init --mode=archive-z2
          # download-artifact extracts a solo pattern match directly into the
          # path; multiple matches land in per-artifact subdirectories.
          if [ -e arch-repos/config ]; then
            repos=(arch-repos/)
          else
            repos=(arch-repos/*/)
          fi
          for src in "${repos[@]}"; do
            # Zip artifacts drop empty directories; ostree needs refs/remotes
            # to exist when listing the source repo's refs.
            mkdir -p "$src/refs/remotes"
            echo "Pulling $src"
            ostree --repo=site/repo pull-local "$src"
          done
          # build-update-repo signs the summary, not the commits under it.
          ostree --repo=site/repo refs | while read -r ref; do
            commit="$(ostree --repo=site/repo rev-parse "$ref")"
            ostree --repo=site/repo gpg-sign \
              --gpg-homedir="$GNUPGHOME" "$commit" "$FLATPAK_GPG_KEY_ID"
          done
          flatpak build-update-repo \
            --title='Sable Next Nightly' \
            --default-branch=master \
            --gpg-sign="$FLATPAK_GPG_KEY_ID" \
            --gpg-homedir="$GNUPGHOME" \
            site/repo
          ostree --repo=site/repo refs
      - name: Write the .flatpakrepo and landing page
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        env:
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY##*/}"
          base="https://$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]').github.io/$name"
          gpgkey="$(gpg --homedir "$GNUPGHOME" --export "$FLATPAK_GPG_KEY_ID" | base64 -w0)"

          sed -e "s|@REPO_URL@|$base/repo/|" -e "s|@GPGKEY@|$gpgkey|" \
            packaging/flatpak/nightly/sable-next-nightly.flatpakrepo.in \
            > site/sable-next-nightly.flatpakrepo

          sed -e "s|@BASE_URL@|$base|g" -e "s|@VERSION@|$VERSION|g" \
            packaging/flatpak/nightly/index.html.in > site/index.html
      - name: Upload the Pages artifact
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deploy
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  handoff:
    name: Publish handoff manifest
    needs: [setup-release, desktop, linux, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ needs.setup-release.outputs.tag }}
      VERSION: ${{ needs.setup-release.outputs.version }}
      IPA_NAME: ${{ needs.ios.outputs.ipa_name }}
      IPA_SIZE: ${{ needs.ios.outputs.ipa_size }}
      IPA_VERSION: ${{ needs.ios.outputs.ipa_version }}
      IPA_BUILD: ${{ needs.ios.outputs.ipa_build }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup-release.outputs.ref }}
          persist-credentials: false
      - name: Build and upload handoff manifest
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg name "$IPA_NAME" \
            --arg size "$IPA_SIZE" \
            --arg ipa_version "$IPA_VERSION" \
            --arg build "$IPA_BUILD" \
            '{version: $version, ipa: {name: $name, size: $size, version: $ipa_version, build: $build}}' \
            > github-bundles.json
          node scripts/ci/forgejo-release.mjs upload github-bundles.json
