name: Rust quality checks

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deny.toml'
      - '.github/workflows/rust-quality.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deny.toml'
      - '.github/workflows/rust-quality.yml'
  merge_group:

permissions: {}

concurrency:
  group: rust-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Rust format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  checks:
    name: Rust check, test, and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Supplies wasm-bindgen-test-runner at the version mise pins.
      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: true
          env: false

      - name: Trust project mise configuration
        run: mise settings set trusted_config_paths "$GITHUB_WORKSPACE"

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      # --all-features would turn on both desktop runtimes and download CEF,
      # so the app crate is checked on its default runtime. The CEF build is
      # covered by the Linux release job.
      - name: Run workspace Clippy
        run: |
          cargo clippy --locked --workspace --exclude app --all-targets --all-features -- -D warnings
          cargo clippy --locked -p app --all-targets -- -D warnings

      - name: Run WASM-target Clippy
        run: cargo clippy --locked -p sable-wasm --target wasm32-unknown-unknown --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: |
          cargo test --locked --workspace --exclude app --all-features
          cargo test --locked -p app

      - name: Check generated bindings are current
        run: git diff --exit-code src/generated

      - name: Check dependency policy
        run: cargo deny check

      - name: Run WASM-target tests
        run: |
          export CHROMEDRIVER="${CHROMEWEBDRIVER:?chromedriver comes from the runner image}/chromedriver"
          cargo test --locked -p sable-wasm --target wasm32-unknown-unknown --profile wasm-dev

      - name: Run WASM-target tests on Firefox
        run: |
          export GECKODRIVER="${GECKOWEBDRIVER:?geckodriver comes from the runner image}/geckodriver"
          cargo test --locked -p sable-wasm --target wasm32-unknown-unknown --profile wasm-dev

      - name: Check Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --workspace --exclude app --all-features --no-deps
          cargo doc --locked -p app --no-deps
