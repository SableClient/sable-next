name: Application CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect deployment changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      preview: ${{ steps.filter.outputs.preview }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          infra=false
          preview=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || {
            [[ "$EVENT_NAME" == "push" ]] && [[ "$REF_NAME" == "refs/heads/main" ]]
          }; then
            infra=true
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]] && [[ "$HEAD_REPOSITORY" == "$REPOSITORY" ]]; then
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

            if printf '%s\n' "$changed_files" | grep -Eq '^(infra/|wrangler\.jsonc$|\.github/workflows/application\.yml$|\.github/actions/prepare-tofu/|\.github/actions/setup/|mise\.toml$)'; then
              infra=true
            fi

            if printf '%s\n' "$changed_files" | grep -Eq '^(src/|static/|crates/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|vite\.config\.ts$|svelte\.config\.js$|wrangler\.jsonc$|\.github/workflows/application\.yml$|\.github/actions/setup/)'; then
              preview=true
            fi
          fi

          {
            echo "infra=$infra"
            echo "preview=$preview"
          } >> "$GITHUB_OUTPUT"

  build-web:
    name: Build web assets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up app and build
        uses: ./.github/actions/setup
        with:
          build: 'true'

      - name: Upload web assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-assets
          path: |
            .svelte-kit/output
            dist
            src/generated/wasm
          if-no-files-found: error
          retention-days: 7

  release:
    name: Prepare nightly release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - name: Determine whether to publish
        id: metadata
        shell: bash
        run: |
          publish=false
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]] || {
            [[ "${{ github.event_name }}" == 'push' ]] && [[ "${{ github.ref }}" == 'refs/heads/main' ]]
          }; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: ${{ steps.metadata.outputs.publish == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or update nightly release
        if: ${{ steps.metadata.outputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --target "$SHA" --title 'Nightly (main)' \
              --notes "Rolling nightly build from main at $SHA"
          else
            gh release create nightly --prerelease --target "$SHA" --title 'Nightly (main)' \
              --notes "Rolling nightly build from main at $SHA"
          fi

  quality:
    name: Frontend quality
    needs: build-web
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets

      - name: Set up app
        uses: ./.github/actions/setup
        with:
          build: 'false'
          install-wasm-pack: 'false'
          install-mise-tools: 'false'

      - name: Check Oxfmt formatting
        run: pnpm fmt:check

      - name: Run ESLint
        run: pnpm lint

      - name: Run Stylelint
        run: pnpm stylelint

      - name: Run svelte-check
        run: pnpm check

      - name: Run Vitest
        run: pnpm test

  playwright:
    name: Playwright
    needs: build-web
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets

      - name: Set up app
        uses: ./.github/actions/setup
        with:
          build: 'false'
          install-wasm-pack: 'false'
          install-mise-tools: 'false'

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  tauri:
    name: ${{ matrix.name }}
    needs: [build-web, release]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            runner: macos-latest
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
            bundle-path: target/universal-apple-darwin/release/bundle
          - name: Windows x86_64
            runner: windows-latest
            rust-targets: ''
            tauri-args: ''
            bundle-path: target/release/bundle
          - name: Linux x86_64
            runner: ubuntu-24.04
            rust-targets: ''
            tauri-args: ''
            bundle-path: target/release/bundle
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets

      - name: Install Linux Tauri dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config

      - name: Set up app
        uses: ./.github/actions/setup
        with:
          build: 'false'
          install-wasm-pack: 'false'
          install-mise-tools: 'false'

      - name: Add Rust targets
        if: ${{ matrix.rust-targets != '' }}
        shell: bash
        run: rustup target add ${{ matrix.rust-targets }}

      - name: Build desktop bundle
        shell: bash
        run: pnpm tauri build --config src-tauri/tauri.ci.conf.json ${{ matrix.tauri-args }}

      - name: Upload desktop bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sable-next-${{ runner.os }}
          path: ${{ matrix.bundle-path }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach desktop bundles to nightly release
        if: ${{ needs.release.outputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ matrix.bundle-path }}
        run: |
          find "$BUNDLE_PATH" -type f \( \
            -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.AppImage' \
          \) -print0 > bundles
          test -s bundles || { echo "No desktop bundles found in $BUNDLE_PATH" >&2; exit 1; }
          while IFS= read -r -d '' bundle; do
            gh release upload nightly "$bundle" --clobber
          done < bundles

  android:
    name: Build Android
    needs: [build-web, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      MISE_ENV: tauri
      RUST_TARGETS: aarch64-linux-android armv7-linux-androideabi
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets

      - name: Set up app
        uses: ./.github/actions/setup
        with:
          build: 'false'
          install-wasm-pack: 'false'
          install-mise-tools: 'false'

      - name: Set up Android SDK and NDK
        shell: bash
        run: mise run tauri:setup:android

      - name: Add Rust targets
        shell: bash
        run: rustup target add $RUST_TARGETS

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build Android bundles
        shell: bash
        run: pnpm tauri android build --apk --aab --target aarch64 armv7

      - name: Upload Android bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sable-next-android
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
            src-tauri/gen/android/app/build/outputs/**/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Attach Android bundles to nightly release
        if: ${{ needs.release.outputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find src-tauri/gen/android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) \
            -print0 > bundles
          test -s bundles || { echo 'No Android bundles found' >&2; exit 1; }
          while IFS= read -r -d '' bundle; do
            gh release upload nightly "$bundle" --clobber
          done < bundles

  ios:
    name: Build iOS
    needs: [build-web, release]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RUST_TARGETS: aarch64-apple-ios
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets

      - name: Set up app
        uses: ./.github/actions/setup
        with:
          build: 'false'
          install-wasm-pack: 'false'
          install-mise-tools: 'false'

      - name: Set up iOS project
        shell: bash
        run: |
          brew install cocoapods
          pnpm tauri ios init --ci

      - name: Add Rust target
        shell: bash
        run: rustup target add $RUST_TARGETS

      - name: Build unsigned iOS bundle
        shell: bash
        run: pnpm tauri ios build --no-sign --ci

      - name: Upload iOS bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sable-next-ios
          path: src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Attach iOS bundle to nightly release
        if: ${{ needs.release.outputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ipa="$(find src-tauri/gen/apple/build -type f -name '*.ipa' | head -n 1)"
          [ -n "$ipa" ] || { echo 'No iOS IPA found' >&2; exit 1; }
          gh release upload nightly "$ipa" --clobber

  finalize-nightly:
    name: Finalize nightly release
    needs: [release, tauri, android, ios]
    if: ${{ needs.release.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Update nightly tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method PATCH "repos/$REPOSITORY/git/refs/tags/nightly" \
            -f sha="$SHA" -F force=true
          gh release edit nightly --prerelease --target "$SHA" --title 'Nightly (main)' \
            --notes "Rolling nightly build from main at $SHA"

  cloudflare-assets:
    name: Prepare Cloudflare assets
    needs: [build-web, changes]
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
          path: .

      - name: Upload Cloudflare assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-web-assets
          path: dist
          if-no-files-found: error
          retention-days: 1

  plan:
    name: Cloudflare plan
    needs: cloudflare-assets
    if: ${{ needs.cloudflare-assets.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.TF_CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TF_VAR_account_id: ${{ secrets.TF_VAR_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ secrets.TF_VAR_ZONE_ID }}
      TF_HTTP_USERNAME: ${{ secrets.TF_HTTP_USERNAME }}
      TF_HTTP_PASSWORD: ${{ secrets.TF_HTTP_PASSWORD }}
      TF_VAR_workers_message: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.ref_name }}
      TF_HTTP_ADDRESS: ${{ vars.TF_HTTP_ADDRESS }}
      TF_HTTP_LOCK_ADDRESS: ${{ vars.TF_HTTP_LOCK_ADDRESS }}
      TF_HTTP_UNLOCK_ADDRESS: ${{ vars.TF_HTTP_UNLOCK_ADDRESS }}
      TF_HTTP_LOCK_METHOD: 'POST'
      TF_HTTP_UNLOCK_METHOD: 'DELETE'
      TF_HTTP_RETRY_WAIT_MIN: '5'
      TF_VAR_custom_domain: ${{ vars.TF_VAR_CUSTOM_DOMAIN }}
      TF_VAR_worker_name: ${{ vars.TF_VAR_WORKER_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Cloudflare assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cloudflare-web-assets
          path: dist

      - uses: ./.github/actions/prepare-tofu
        with:
          build: 'false'

      - name: Plan infrastructure
        working-directory: infra/web
        run: mise run opentofu -- plan -input=false -no-color

      - name: Comment PR plan
        if: github.event_name == 'pull_request'
        uses: dflook/tofu-plan@cdb4f4d604c9fa695e457744dd1f802853397ce7 # v3.0.0
        with:
          path: infra/web
          label: development

  apply:
    name: Cloudflare apply
    needs: plan
    if: ${{ needs.plan.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment:
      name: development
      url: https://next.sable.moe
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.TF_CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TF_VAR_account_id: ${{ secrets.TF_VAR_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ secrets.TF_VAR_ZONE_ID }}
      TF_HTTP_USERNAME: ${{ secrets.TF_HTTP_USERNAME }}
      TF_HTTP_PASSWORD: ${{ secrets.TF_HTTP_PASSWORD }}
      TF_VAR_workers_message: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.ref_name }}
      TF_HTTP_ADDRESS: ${{ vars.TF_HTTP_ADDRESS }}
      TF_HTTP_LOCK_ADDRESS: ${{ vars.TF_HTTP_LOCK_ADDRESS }}
      TF_HTTP_UNLOCK_ADDRESS: ${{ vars.TF_HTTP_UNLOCK_ADDRESS }}
      TF_HTTP_LOCK_METHOD: 'POST'
      TF_HTTP_UNLOCK_METHOD: 'DELETE'
      TF_HTTP_RETRY_WAIT_MIN: '5'
      TF_VAR_custom_domain: ${{ vars.TF_VAR_CUSTOM_DOMAIN }}
      TF_VAR_worker_name: ${{ vars.TF_VAR_WORKER_NAME }}
    concurrency:
      group: cloudflare-infra-development
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Cloudflare assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cloudflare-web-assets
          path: dist

      - uses: ./.github/actions/prepare-tofu
        with:
          build: 'false'

      - name: Apply infrastructure
        working-directory: infra/web
        run: mise run opentofu -- apply -input=false -auto-approve

  cloudflare-preview:
    name: Cloudflare Worker preview
    needs: [build-web, changes]
    if: ${{ needs.changes.outputs.preview == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.TF_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets

      - name: Set up app
        uses: ./.github/actions/setup
        with:
          build: 'false'
          install-wasm-pack: 'false'
          install-mise-tools: 'false'

      - name: Prepare preview metadata
        id: metadata
        shell: bash
        run: |
          preview_message="$(git log -1 --pretty=%s)"
          preview_message="$(printf '%s' "$preview_message" | head -c 100)"

          {
            echo 'preview_message<<EOF'
            echo "$preview_message"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set deploy alias
        id: alias
        shell: bash
        run: echo "alias=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Upload Worker preview
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        env:
          PREVIEW_MESSAGE: ${{ steps.metadata.outputs.preview_message }}
        with:
          apiToken: ${{ secrets.TF_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.TF_VAR_ACCOUNT_ID }}
          command: >
            versions upload
            --config wrangler.jsonc
            --preview-alias ${{ steps.alias.outputs.alias }}
            --message "$PREVIEW_MESSAGE"

      - name: Resolve preview URL
        id: preview
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          COMMAND_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          ALIAS: ${{ steps.alias.outputs.alias }}
        shell: bash
        run: |
          alias_url_pattern="^https?://${ALIAS}-[^[:space:]]+$"
          preview_url=""

          if printf '%s\n' "$DEPLOYMENT_URL" | grep -Eq "$alias_url_pattern"; then
            preview_url="$DEPLOYMENT_URL"
          else
            preview_url="$(printf '%s\n' "$COMMAND_OUTPUT" | grep -Eo "https?://${ALIAS}-[^[:space:]]*" | head -n 1 || true)"
          fi

          if ! printf '%s\n' "$preview_url" | grep -Eq "$alias_url_pattern"; then
            echo "Failed to resolve aliased Worker preview URL." >&2
            exit 1
          fi

          echo "preview_url=${preview_url}" >> "$GITHUB_OUTPUT"

      - name: Publish summary and PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MARKER: '<!-- cloudflare-worker-preview -->'
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          PREVIEW_ALIAS: ${{ steps.alias.outputs.alias }}
          SHORT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = process.env.MARKER;
            const previewUrl = process.env.PREVIEW_URL;
            const previewAlias = process.env.PREVIEW_ALIAS;
            const shortSha = process.env.SHORT_SHA?.slice(0, 7);
            const now = new Date().toUTCString().replace(':00 GMT', ' UTC');

            if (!previewUrl) {
              core.setFailed('Missing preview URL from Cloudflare deploy step.');
              return;
            }

            const tableRow = '| Deployment successful! | <a href="' + previewUrl + '">' + previewUrl + '</a> | ' + shortSha + ' | `' + previewAlias + '` | ' + now + ' |';
            const comment = [
              marker,
              '## Deploying with &nbsp;<a href="https://workers.dev"><img alt="Cloudflare" src="https://workers.cloudflare.com/logo.svg" width="16"></a> &nbsp;Cloudflare Workers',
              '',
              '| Status | Preview URL | Commit | Alias | Updated (UTC) |',
              '| - | - | - | - | - |',
              tableRow,
            ].join('\n');

            await core.summary.addRaw(comment.replace(marker + '\n', '')).write();

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.deleteComment({
                owner, repo, comment_id: existing.id,
              });
            }

            await github.rest.issues.createComment({ owner, repo, issue_number, body: comment });
