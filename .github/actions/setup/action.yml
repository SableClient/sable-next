name: Setup App
description: Installs the Sable web toolchain and optionally builds the app.

inputs:
  build:
    description: Whether to build the WASM bindings and the static web app.
    required: false
    default: 'false'
  rust:
    description: Whether the job compiles Rust of its own.
    required: false
    default: 'false'
  rust-cache-key:
    description: rust-cache's shared-key.
    required: false
    default: 'wasm'
  install-mise-tools:
    description: Whether to install tools declared in mise.toml.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.14.0
        cache: pnpm

    - name: Set up mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: '2026.9.2'
        cache: ${{ inputs.install-mise-tools }}
        env: false
        install: ${{ inputs.install-mise-tools }}

    # Xcode drops CI and MISE_TRUSTED_CONFIG_PATHS from run-script build phases
    # while keeping PATH, so mise stops auto-trusting the config there. Only
    # trusting on disk survives that.
    - name: Trust project mise configuration
      shell: bash
      working-directory: ${{ github.workspace }}
      run: mise settings set trusted_config_paths "$GITHUB_WORKSPACE"

    # The bindings are a pure function of the Rust sources and the pinned
    # toolchain, so every job that builds shares one entry and only the first
    # miss compiles.
    - name: Restore WASM bindings
      id: wasm
      if: ${{ inputs.build == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: src/generated/wasm
        key: wasm-${{ runner.os }}-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'mise.toml', 'scripts/build-wasm.mjs') }}

    - name: Set up Rust
      if: ${{ inputs.rust == 'true' || (inputs.build == 'true' && steps.wasm.outputs.cache-hit != 'true') }}
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
      with:
        toolchain: 1.97.1
        targets: wasm32-unknown-unknown

    - name: Cache Rust artifacts
      if: ${{ inputs.rust == 'true' || (inputs.build == 'true' && steps.wasm.outputs.cache-hit != 'true') }}
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.rust-cache-key }}
        cache-on-failure: true

    - name: Install JavaScript dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      run: pnpm install --frozen-lockfile

    - name: Build the WASM bindings
      if: ${{ inputs.build == 'true' && steps.wasm.outputs.cache-hit != 'true' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: pnpm wasm:build

    # `vite build` rather than `pnpm build`, whose prebuild hook would recompile
    # the bindings the cache just restored.
    - name: Build app
      if: ${{ inputs.build == 'true' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: pnpm exec vite build
