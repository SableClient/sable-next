name: Setup App
description: Installs the Sable web toolchain and optionally builds the app.

inputs:
  build:
    description: Whether to build the static web app after generating WASM.
    required: false
    default: 'false'
  install-mise-tools:
    description: Whether to install tools declared in mise.toml.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.14.0
        cache: pnpm

    - name: Set up mise
      uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      with:
        cache: true
        env: false
        install: ${{ inputs.install-mise-tools }}

    # Xcode drops CI and MISE_TRUSTED_CONFIG_PATHS from run-script build phases
    # while keeping PATH, so mise stops auto-trusting the config there. Only
    # trusting on disk survives that.
    - name: Trust project mise configuration
      shell: bash
      working-directory: ${{ github.workspace }}
      run: mise settings set trusted_config_paths "$GITHUB_WORKSPACE"

    - name: Set up Rust for WASM generation
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
      with:
        toolchain: 1.97.1
        targets: wasm32-unknown-unknown

    - name: Cache Rust artifacts
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: Install JavaScript dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      run: pnpm install --frozen-lockfile

    - name: Build app
      if: ${{ inputs.build == 'true' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: pnpm run build
